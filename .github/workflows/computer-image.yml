name: computer-image

on:
  pull_request:
    paths:
      - apps/daemon/computer-image/**
      - .github/workflows/computer-image.yml
  push:
    branches: [main]
    paths:
      - apps/daemon/computer-image/**
      - .github/workflows/computer-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: computer-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Check the guard ruleset
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nftables
          sudo nft -c -f apps/daemon/computer-image/guard.nft

  image:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/daemon/computer-image
          platforms: linux/arm64,linux/amd64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/xiechimon/cairn-computer:${{ github.sha }}

      - name: Report the digest to pin in image.json
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: echo "ghcr.io/xiechimon/cairn-computer@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
