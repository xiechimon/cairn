name: schema-glance-comment

on:
  workflow_run:
    workflows: [schema-glance]
    types: [completed]

permissions:
  pull-requests: write
  actions: read

jobs:
  comment:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: schema-glance
          path: ${{ runner.temp }}/artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Upsert sticky comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          pr_number="$EVENT_PR_NUMBER"
          if [ -z "$pr_number" ]; then
            matches=$(gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" \
              --jq ".[] | select(.head.sha == \"$HEAD_SHA\") | .number")
            if [ "$(printf '%s\n' "$matches" | grep -c .)" -ne 1 ]; then
              echo "::notice::Could not resolve exactly one open PR for $HEAD_SHA"
              exit 0
            fi
            pr_number="$matches"
          fi
          case "$pr_number" in
            ''|*[!0-9]*) echo "::error::Unexpected PR number"; exit 1 ;;
          esac

          marker='<!-- schema-glance -->'
          artifact="$RUNNER_TEMP/artifact/schema-glance.md"
          body="$RUNNER_TEMP/comment.md"
          printf '%s\n' "$marker" > "$body"
          if [ "$(wc -c < "$artifact")" -gt 61440 ]; then
            printf '### Schema changes\n\nTable too large, see the run summary.\n' >> "$body"
          elif grep -q -e '<!--' -e '@' "$artifact"; then
            printf '### Schema changes\n\nTable withheld because it contains unsafe text, see the run summary.\n' >> "$body"
          else
            cat "$artifact" >> "$body"
          fi

          comment_id=$(gh api --paginate "repos/$REPO/issues/$pr_number/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$comment_id" -F "body=@$body"
          else
            gh api --method POST "repos/$REPO/issues/$pr_number/comments" -F "body=@$body"
          fi
