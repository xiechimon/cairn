name: mac-confinement

on:
  pull_request:
    paths:
      - apps/daemon/src/backend/**
      - apps/daemon/src/process-tree.ts
      - apps/daemon/src/computer/host.ts
      - apps/daemon/test/confine-*.test.ts
      - apps/daemon/test/host-shell-confinement.test.ts
      - apps/daemon/test/confinement-availability.test.ts
      - apps/daemon/test/computer-host-detached.test.ts
      - .github/workflows/mac-confinement.yml
  push:
    branches: [main]
    paths:
      - apps/daemon/src/backend/**
      - apps/daemon/src/process-tree.ts
      - apps/daemon/src/computer/host.ts
      - apps/daemon/test/confine-*.test.ts
      - apps/daemon/test/host-shell-confinement.test.ts
      - apps/daemon/test/confinement-availability.test.ts
      - apps/daemon/test/computer-host-detached.test.ts
      - .github/workflows/mac-confinement.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-confinement-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Every machine this repo is built on is one lane's machine; a GitHub runner is one job's
  # machine. The explicit flag keeps the bypass visible in the runner log instead of implicit.
  CAIRN_HEAVY_GATE_BYPASS: '1'

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run the Seatbelt session probes
        run: pnpm exec vitest run apps/daemon/test/confine-seatbelt.test.ts apps/daemon/test/confine-session.test.ts apps/daemon/test/host-shell-confinement.test.ts apps/daemon/test/acp-spike.test.ts

      - name: Run the macOS process-cleanup probes
        run: pnpm exec vitest run apps/daemon/test/computer-host-detached.test.ts
