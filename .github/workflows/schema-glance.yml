name: schema-glance

on:
  pull_request:
    paths:
      - 'apps/server/drizzle/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  schema-glance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Render schema diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git show "$BASE_SHA:scripts/schema-glance.mjs" > "$RUNNER_TEMP/schema-glance.mjs" 2>/dev/null || cp scripts/schema-glance.mjs "$RUNNER_TEMP/schema-glance.mjs"
          node "$RUNNER_TEMP/schema-glance.mjs" --base "$BASE_SHA" --head "$HEAD_SHA" > "$RUNNER_TEMP/schema-glance.md"
          cat "$RUNNER_TEMP/schema-glance.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upsert sticky comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          marker='<!-- schema-glance -->'
          { printf '%s\n' "$marker"; cat "$RUNNER_TEMP/schema-glance.md"; } > "$RUNNER_TEMP/schema-glance-comment.md"
          comment_id=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$comment_id" -F "body=@$RUNNER_TEMP/schema-glance-comment.md"
          else
            gh api --method POST "repos/$REPO/issues/$PR_NUMBER/comments" -F "body=@$RUNNER_TEMP/schema-glance-comment.md"
          fi
