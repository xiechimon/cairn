name: visual-baselines
run-name: visual-baselines ${{ inputs.sha }} ${{ inputs.ref }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Full remote ref (refs/heads/baselines/<lane>) holding the commit to render
        required: true
        type: string
      sha:
        description: Expected 40-character HEAD commit SHA to render
        required: true
        type: string
      surfaces:
        description: Optional comma/space-separated surface IDs from apps/web/e2e/visual-surfaces.json
        required: false
        default: ''
        type: string

concurrency:
  group: visual-baselines-${{ inputs.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CAIRN_HEAVY_GATE_BYPASS: '1'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate inputs
        env:
          INPUT_REF: ${{ inputs.ref }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          if ! printf '%s' "$INPUT_REF" | grep -qE '^refs/heads/baselines/[A-Za-z0-9._/-]+$'; then
            echo "::error::ref must start with refs/heads/baselines/ (got: $INPUT_REF)"
            exit 1
          fi
          if ! printf '%s' "$INPUT_SHA" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::sha must be a 40-char lowercase hex commit SHA (got: $INPUT_SHA)"
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Verify checked-out SHA
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          actual=$(git rev-parse HEAD)
          if [ "$actual" != "$INPUT_SHA" ]; then
            echo "::error::checked-out HEAD ($actual) does not match inputs.sha ($INPUT_SHA)"
            exit 1
          fi

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium
        uses: ./.github/actions/playwright-chromium

      - name: Render Linux visual baselines
        working-directory: apps/web
        env:
          VISUAL_SURFACES: ${{ inputs.surfaces }}
        run: pnpm exec playwright test e2e/visual-baseline.spec.ts --update-snapshots

      - name: Upload rendered baselines
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-baselines-${{ inputs.sha }}
          path: apps/web/e2e/visual-baseline.spec.ts-snapshots/*.png
          retention-days: 3
          if-no-files-found: error
