name: desktop-release

on:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Skip a nightly run when main has not moved since the last release
        id: changed
        run: |
          last=$(git tag --list 'desktop-v*' --sort=-v:refname | head -n 1)
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ -n "$last" ] && [ "$(git rev-list -n 1 "$last")" = "$GITHUB_SHA" ]; then
            echo "main is still at $last; nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        if: steps.changed.outputs.release == 'true'

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: steps.changed.outputs.release == 'true'
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: steps.changed.outputs.release == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build the web UI, the server and the Runner
        if: steps.changed.outputs.release == 'true'
        run: |
          pnpm --filter @cairn/web build
          pnpm --filter @xiechimon/cairn build
          pnpm --filter @xiechimon/cairn-cli build
          node apps/server/scripts/stage-web.mjs
          pnpm --filter @cairn/desktop stage-server
          pnpm --filter @cairn/desktop stage-runner

      - name: Package arm64 and x64
        if: steps.changed.outputs.release == 'true'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        working-directory: apps/desktop
        run: |
          node build.mjs
          pnpm exec electron-builder --mac dmg zip --arm64 --x64 -c.extraMetadata.version="$VERSION"

      - name: Launch the arm64 app before publishing it
        if: steps.changed.outputs.release == 'true'
        working-directory: apps/desktop
        run: pnpm smoke

      - name: Write the update manifest
        if: steps.changed.outputs.release == 'true'
        working-directory: apps/desktop
        run: node scripts/release-manifest.mjs "$VERSION" release

      - name: Publish the release
        if: steps.changed.outputs.release == 'true'
        working-directory: apps/desktop/release
        run: |
          gh release create "desktop-v$VERSION" \
            --target "$GITHUB_SHA" \
            --latest \
            --title "Cairn for Mac $VERSION" \
            --notes "Built from $GITHUB_SHA. Ad-hoc signed: the first launch needs right-click, Open." \
            Cairn-"$VERSION"-arm64.dmg Cairn-"$VERSION"-x64.dmg \
            Cairn-"$VERSION"-arm64.zip Cairn-"$VERSION"-x64.zip \
            desktop-latest.json
