name: desktop-release

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

env:
  CAIRN_HEAVY_GATE_BYPASS: '1'

jobs:
  decide:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    outputs:
      release: ${{ steps.decision.outputs.release }}
      sha: ${{ steps.decision.outputs.sha }}
      version: ${{ steps.decision.outputs.version }}
    steps:
      - name: Resolve main history for candidate selection
        id: sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GATE_REPO: ${{ github.repository }}
        run: |
          tip=$(gh api "repos/$GATE_REPO/branches/main" --jq .commit.sha)
          echo "this run releases the current main tip: $tip"
          echo "sha=$tip" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.sha.outputs.sha }}

      - name: Select the newest green changed unreleased commit on main
        id: decision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ steps.sha.outputs.sha }}
          GATE_REPO: ${{ github.repository }}
        run: node scripts/ops/release-decide.mjs "$RELEASE_SHA" >> "$GITHUB_OUTPUT"

  live-verify:
    needs: decide
    if: needs.decide.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ needs.decide.outputs.sha }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium
        uses: ./.github/actions/playwright-chromium

      - name: Drive the new-task journey on an isolated stack
        env:
          VERIFY_EVIDENCE_DIR: ${{ runner.temp }}/verify-evidence
        run: |
          mkdir -p "$VERIFY_EVIDENCE_DIR"
          node .claude/skills/verify-cairn/scripts/launch.mjs > "$RUNNER_TEMP/launch.log" 2>&1 &
          launcher=$!
          finish() {
            node .claude/skills/verify-cairn/scripts/cleanup.mjs || kill "$launcher" 2>/dev/null || true
          }
          trap finish EXIT
          for _ in $(seq 1 360); do
            if grep -q 'verify stack ready' "$RUNNER_TEMP/launch.log"; then break; fi
            if ! kill -0 "$launcher" 2>/dev/null; then cat "$RUNNER_TEMP/launch.log"; exit 1; fi
            sleep 1
          done
          grep -q 'verify stack ready' "$RUNNER_TEMP/launch.log" || { cat "$RUNNER_TEMP/launch.log"; exit 1; }
          node .claude/skills/verify-cairn/scripts/vp.mjs drive board-new-task new-task

      - name: Require a passing new-task result
        env:
          VERIFY_EVIDENCE_DIR: ${{ runner.temp }}/verify-evidence
        run: node scripts/ops/require-verify-evidence.mjs "$VERIFY_EVIDENCE_DIR/result.json" new-task

      - name: Upload the live-verify evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-verify-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verify-evidence
          if-no-files-found: warn
          retention-days: 14

  package:
    needs: [decide, live-verify]
    if: needs.decide.outputs.release == 'true'
    runs-on: macos-latest
    environment: desktop-release
    timeout-minutes: 60
    strategy:
      matrix:
        arch: [arm64, x64]
    env:
      ARCH: ${{ matrix.arch }}
      VERSION: ${{ needs.decide.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.decide.outputs.sha }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check that the host shell Seatbelt profile still reaches the network over TLS
        if: matrix.arch == 'arm64'
        run: pnpm --filter @xiechimon/cairn-cli exec vitest run test/seatbelt-tls.test.ts

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/tsnet-sidecar/go.mod
          cache-dependency-path: apps/tsnet-sidecar/go.sum

      - name: Build the tsnet sidecar for this arch
        working-directory: apps/tsnet-sidecar
        env:
          CGO_ENABLED: '0'
          GOOS: darwin
          GOARCH: ${{ matrix.arch == 'x64' && 'amd64' || 'arm64' }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags '-s -w' -o "dist/tsnet-sidecar-${GOOS}-${GOARCH}" .

      - name: Build the web UI, the server and the Runner
        env:
          CAIRN_DESKTOP_ARCH: ${{ matrix.arch }}
        run: |
          pnpm --filter @cairn/web build
          pnpm --filter @xiechimon/cairn build
          pnpm --filter @xiechimon/cairn-cli build
          node apps/server/scripts/stage-web.mjs
          pnpm --filter @cairn/desktop stage-server
          pnpm --filter @cairn/desktop stage-runner
          pnpm --filter @cairn/desktop stage-agent-desktop
          test -f "apps/desktop/server/tsnet-sidecar-darwin-${{ matrix.arch == 'x64' && 'amd64' || 'arm64' }}"

      - name: Import the release signing certificate
        env:
          P12_BASE64: ${{ secrets.MAC_SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MAC_SIGNING_P12_PASSWORD }}
        run: |
          umask 077
          trap 'rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/signing.password"' EXIT
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          printf '%s' "$P12_PASSWORD" > "$RUNNER_TEMP/signing.password"
          apps/desktop/scripts/import-signing-identity.sh "$RUNNER_TEMP/signing.p12" \
            "$RUNNER_TEMP/signing.password" apps/desktop/signing/cairn-mac-self-signed.crt

      - name: Package the app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        working-directory: apps/desktop
        run: |
          node build.mjs
          pnpm exec electron-builder --mac dmg zip "--$ARCH" -c.extraMetadata.version="$VERSION"

      - name: Check that the update zip holds an app signed by the release certificate
        working-directory: apps/desktop
        run: |
          mkdir -p "$RUNNER_TEMP/unzipped"
          ditto -x -k "release/Cairn-$VERSION-$ARCH.zip" "$RUNNER_TEMP/unzipped"
          node scripts/check-signature.mjs signing/cairn-mac-self-signed.crt \
            "$RUNNER_TEMP/unzipped/Cairn.app"

      - name: Check that the update zip's Runner resolves the Claude Code binary for its arch
        working-directory: apps/desktop
        run: |
          node scripts/check-runner-claude.mjs \
            "$RUNNER_TEMP/unzipped/Cairn.app/Contents/Resources/runner" darwin "$ARCH"
          node scripts/check-virtual-store.mjs \
            "$RUNNER_TEMP/unzipped/Cairn.app/Contents/Resources/runner" \
            "$RUNNER_TEMP/unzipped/Cairn.app/Contents/Resources/server"

      - name: Launch the arm64 app before publishing it
        if: matrix.arch == 'arm64'
        working-directory: apps/desktop
        env:
          CAIRN_SMOKE_ISOLATED_SESSION: '1'
        run: pnpm smoke

      - name: Walk the packaged feature journeys in local and remote server modes
        if: matrix.arch == 'arm64' && hashFiles('apps/desktop/scripts/journeys/*.mjs') != ''
        timeout-minutes: 10
        working-directory: apps/desktop
        env:
          CAIRN_SMOKE_ISOLATED_SESSION: '1'
        run: node scripts/packaged-journey.mjs "$RUNNER_TEMP/unzipped/Cairn.app" "$RUNNER_TEMP/packaged-journeys"

      - name: Upload packaged journey evidence
        if: always() && matrix.arch == 'arm64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packaged-journeys-${{ github.run_attempt }}
          path: ${{ runner.temp }}/packaged-journeys
          if-no-files-found: ignore
          retention-days: 14

      - name: Download the previous release for the migration smoke
        if: matrix.arch == 'arm64'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prev_tag=$(node scripts/ops/last-desktop-release.mjs "$GITHUB_REPOSITORY")
          test -n "$prev_tag" || { echo "no published desktop release to compare against"; exit 1; }
          echo "previous release: $prev_tag"
          gh release download "$prev_tag" -p 'Cairn-*-arm64.zip' --dir "$RUNNER_TEMP/prev" --clobber
          mkdir -p "$RUNNER_TEMP/prev-app"
          ditto -x -k "$RUNNER_TEMP"/prev/Cairn-*-arm64.zip "$RUNNER_TEMP/prev-app"

      - name: Run the post-install smoke on the packaged arm64 app
        if: matrix.arch == 'arm64'
        timeout-minutes: 10
        run: |
          node scripts/smoke/post-install.mjs \
            --app "$RUNNER_TEMP/unzipped/Cairn.app" \
            --prev-app "$RUNNER_TEMP/prev-app/Cairn.app" \
            --evidence "$RUNNER_TEMP/smoke-evidence"

      - name: Upload post-install smoke evidence
        if: failure() && matrix.arch == 'arm64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-evidence-${{ matrix.arch }}
          path: ${{ runner.temp }}/smoke-evidence
          if-no-files-found: ignore
          retention-days: 7

      - name: Keep the packaged files for the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.arch }}
          path: |
            apps/desktop/release/Cairn-${{ env.VERSION }}-${{ matrix.arch }}.dmg
            apps/desktop/release/Cairn-${{ env.VERSION }}-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - name: Remove the signing keychain
        if: always()
        run: |
          keychain="$RUNNER_TEMP/cairn-signing.keychain-db"
          if [ -e "$keychain" ]; then
            security delete-keychain "$keychain"
          fi

  package-win:
    needs: [decide, live-verify]
    if: needs.decide.outputs.release == 'true'
    runs-on: windows-latest
    environment: desktop-release
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.decide.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.decide.outputs.sha }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/tsnet-sidecar/go.mod
          cache-dependency-path: apps/tsnet-sidecar/go.sum

      - name: Build the tsnet sidecar for windows-amd64
        working-directory: apps/tsnet-sidecar
        shell: pwsh
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          go build -trimpath -ldflags '-s -w' -o "dist/tsnet-sidecar-windows-amd64.exe" .

      - name: Build the web UI, the server and the Runner
        shell: pwsh
        env:
          CAIRN_DESKTOP_ARCH: x64
        run: |
          pnpm --filter @cairn/web build
          pnpm --filter @xiechimon/cairn build
          pnpm --filter @xiechimon/cairn-cli build
          node apps/server/scripts/stage-web.mjs
          pnpm --filter @cairn/desktop stage-server
          pnpm --filter @cairn/desktop stage-runner

      - name: Package the Windows x64 installer and zip
        working-directory: apps/desktop
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          node build.mjs
          pnpm exec electron-builder --win nsis zip --x64 "-c.extraMetadata.version=$env:VERSION" --publish never

      - name: Keep the packaged Windows files for the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-win-x64
          path: |
            apps/desktop/release/Cairn-${{ env.VERSION }}-win-x64.exe
            apps/desktop/release/Cairn-${{ env.VERSION }}-win-x64.zip
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  package-linux:
    needs: [decide, live-verify]
    if: needs.decide.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: desktop-release
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.decide.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.decide.outputs.sha }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/tsnet-sidecar/go.mod
          cache-dependency-path: apps/tsnet-sidecar/go.sum

      - name: Build the tsnet sidecar for linux-amd64
        working-directory: apps/tsnet-sidecar
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath -ldflags '-s -w' -o dist/tsnet-sidecar-linux-amd64 .

      - name: Build the web UI, the server and the Runner
        env:
          CAIRN_DESKTOP_ARCH: x64
          ARCH: x64
        run: |
          pnpm --filter @cairn/web build
          pnpm --filter @xiechimon/cairn build
          pnpm --filter @xiechimon/cairn-cli build
          node apps/server/scripts/stage-web.mjs
          pnpm --filter @cairn/desktop stage-server
          pnpm --filter @cairn/desktop stage-runner
          test -f apps/desktop/server/tsnet-sidecar-linux-amd64

      - name: Package the Linux x64 archive
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          node build.mjs
          pnpm exec electron-builder --linux tar.gz --x64 -c.extraMetadata.version="$VERSION" --publish never

      - name: Check that the Linux archive holds the Runner and sidecar
        working-directory: apps/desktop
        run: |
          mkdir -p "$RUNNER_TEMP/extracted"
          tar -xzf "release/Cairn-$VERSION-linux-x64.tar.gz" -C "$RUNNER_TEMP/extracted" --strip-components=1
          test -x "$RUNNER_TEMP/extracted/cairn"
          test -f "$RUNNER_TEMP/extracted/resources/server/tsnet-sidecar-linux-amd64"
          node scripts/check-runner-claude.mjs "$RUNNER_TEMP/extracted/resources/runner" linux x64
          node scripts/check-virtual-store.mjs \
            "$RUNNER_TEMP/extracted/resources/runner" \
            "$RUNNER_TEMP/extracted/resources/server"

      - name: Keep the packaged Linux archive for the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-linux-x64
          path: apps/desktop/release/Cairn-${{ env.VERSION }}-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  publish:
    needs: [decide, package, package-win, package-linux, live-verify]
    runs-on: ubuntu-latest
    environment: desktop-release
    permissions:
      contents: write
      actions: read
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.decide.outputs.version }}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          merge-multiple: true
          path: apps/desktop/release

      - name: Check the packaged builds carry the decided version
        working-directory: apps/desktop/release
        run: |
          arm64=$(ls Cairn-*-arm64.zip | sed -n 's/^Cairn-\(.*\)-arm64\.zip$/\1/p')
          x64=$(ls Cairn-*-x64.zip | grep -v -- '-win-x64\.zip$' | sed -n 's/^Cairn-\(.*\)-x64\.zip$/\1/p')
          win=$(ls Cairn-*-win-x64.zip | sed -n 's/^Cairn-\(.*\)-win-x64\.zip$/\1/p')
          linux=$(ls Cairn-*-linux-x64.tar.gz | sed -n 's/^Cairn-\(.*\)-linux-x64\.tar\.gz$/\1/p')
          if [ "$arm64" != "$VERSION" ] || [ "$x64" != "$VERSION" ] || [ "$win" != "$VERSION" ] || [ "$linux" != "$VERSION" ]; then
            echo "the packaged archives carry arm64=${arm64:-none} x64=${x64:-none} win-x64=${win:-none} linux-x64=${linux:-none}, not the decided $VERSION" >&2
            exit 1
          fi

      - name: Write the update manifest
        working-directory: apps/desktop
        run: node scripts/release-manifest.mjs "$VERSION" release

      - name: Refuse to publish when the SHA's green evidence moved
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ needs.decide.outputs.sha }}
          GATE_REPO: ${{ github.repository }}
        run: node scripts/ops/release-gate.mjs "$RELEASE_SHA"

      - name: Publish only while the candidate is still on main
        id: tip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ needs.decide.outputs.sha }}
          GATE_REPO: ${{ github.repository }}
        run: node scripts/ops/release-tip.mjs "$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        if: steps.tip.outputs.on_main == 'true'
        working-directory: apps/desktop/release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_SHA: ${{ needs.decide.outputs.sha }}
        run: |
          tag="desktop-v$VERSION"
          bail() {
            echo "publish aborted: $1" >&2
            exit 1
          }
          require_free_tag() {
            local probe
            if probe=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" 2>&1); then
              bail "$tag already exists; an occupied tag is never adopted, the next poll allocates a fresh version"
            fi
            printf '%s' "$probe" | grep -qi 'not found' || \
              bail "the tag $tag could not be read: $probe"
          }
          require_free_tag
          body="Built from $RELEASE_SHA. Desktop builds for macOS (arm64, x64), Windows (x64), and Linux (x64). macOS builds are signed with Cairn's own certificate, not an Apple one: the first launch needs right-click, Open."
          release_id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
            -F draft=true \
            -f tag_name="$tag" \
            -f target_commitish="$RELEASE_SHA" \
            -f name="Cairn $VERSION" \
            -f body="$body" \
            --jq .id) || bail "the draft release $tag could not be created"
          case "$release_id" in
            ''|*[!0-9]*) bail "the draft $tag returned '$release_id', not a numeric release id" ;;
          esac
          for asset in \
            Cairn-"$VERSION"-arm64.dmg Cairn-"$VERSION"-x64.dmg \
            Cairn-"$VERSION"-arm64.zip Cairn-"$VERSION"-x64.zip \
            Cairn-"$VERSION"-win-x64.exe Cairn-"$VERSION"-win-x64.zip \
            Cairn-"$VERSION"-linux-x64.tar.gz \
            desktop-latest.json
          do
            gh api -X POST \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=$asset" \
              -H "Content-Type: application/octet-stream" \
              --input "$asset" --silent || bail "the asset $asset could not be uploaded"
          done
          tip=$(node "$GITHUB_WORKSPACE/scripts/ops/release-tip.mjs" "$RELEASE_SHA") || \
            bail "main ancestry could not be re-read"
          [ "$tip" = "on_main=true" ] || bail "$RELEASE_SHA is no longer on main"
          plan=$(node "$GITHUB_WORKSPACE/scripts/ops/release-plan.mjs" "$RELEASE_SHA") || \
            bail "the desktop-v* releases and tags could not be re-read"
          if [ "$(printf '%s\n' "$plan" | sed -n 's/^released=//p')" = "true" ]; then
            bail "a published desktop-v* release already covers $RELEASE_SHA"
          fi
          latest=$(node "$GITHUB_WORKSPACE/scripts/ops/release-version.mjs" "$VERSION") || \
            bail "the latest decision for $tag could not be read"
          [ "$latest" = "latest=true" ] || \
            bail "$tag is no longer above the highest published desktop-v* release"
          require_free_tag
          draft=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            --jq '[.draft, .tag_name, .target_commitish] | map(tostring) | join(" ")') || \
            bail "the draft $tag could not be re-read"
          [ "$draft" = "true $tag $RELEASE_SHA" ] || \
            bail "the draft no longer holds tag $tag at $RELEASE_SHA; it now reads '$draft'"
          node "$GITHUB_WORKSPACE/scripts/ops/release-gate.mjs" "$RELEASE_SHA" || \
            bail "the ci evidence for $RELEASE_SHA moved"
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false -f make_latest=true || \
            bail "the draft $tag could not be published"
