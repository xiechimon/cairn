name: desktop-release

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

env:
  CAIRN_HEAVY_GATE_BYPASS: '1'

jobs:
  decide:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    concurrency:
      group: desktop-release-reserve
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    outputs:
      release: ${{ steps.reserve.outputs.release }}
      release_id: ${{ steps.reserve.outputs.release_id }}
      sha: ${{ steps.decision.outputs.sha }}
      version: ${{ steps.decision.outputs.version }}
    steps:
      - name: Resolve main history for candidate selection
        id: sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GATE_REPO: ${{ github.repository }}
        run: |
          tip=$(gh api "repos/$GATE_REPO/branches/main" --jq .commit.sha)
          echo "this run releases the current main tip: $tip"
          echo "sha=$tip" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Ensure the resolved main tip is in the trusted checkout's history
        env:
          RELEASE_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          if ! git cat-file -e "$RELEASE_SHA^{commit}"; then
            git fetch --no-tags origin "$RELEASE_SHA"
          fi

      - name: Select the newest green changed unreleased commit on main
        id: decision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ steps.sha.outputs.sha }}
          GATE_REPO: ${{ github.repository }}
        run: node scripts/ops/release-decide.mjs "$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Reserve a fresh draft for this build
        id: reserve
        if: steps.decision.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ steps.decision.outputs.sha }}
          VERSION: ${{ steps.decision.outputs.version }}
        run: node scripts/ops/release-reservation.mjs reserve >> "$GITHUB_OUTPUT"

  live-verify:
    needs: decide
    if: needs.decide.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ needs.decide.outputs.sha }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium
        uses: ./.github/actions/playwright-chromium

      - name: Drive the new-task journey on an isolated stack
        env:
          VERIFY_EVIDENCE_DIR: ${{ runner.temp }}/verify-evidence
        run: |
          mkdir -p "$VERIFY_EVIDENCE_DIR"
          node .claude/skills/verify-cairn/scripts/launch.mjs > "$RUNNER_TEMP/launch.log" 2>&1 &
          launcher=$!
          finish() {
            node .claude/skills/verify-cairn/scripts/cleanup.mjs || kill "$launcher" 2>/dev/null || true
          }
          trap finish EXIT
          for _ in $(seq 1 360); do
            if grep -q 'verify stack ready' "$RUNNER_TEMP/launch.log"; then break; fi
            if ! kill -0 "$launcher" 2>/dev/null; then cat "$RUNNER_TEMP/launch.log"; exit 1; fi
            sleep 1
          done
          grep -q 'verify stack ready' "$RUNNER_TEMP/launch.log" || { cat "$RUNNER_TEMP/launch.log"; exit 1; }
          node .claude/skills/verify-cairn/scripts/vp.mjs drive board-new-task new-task

      - name: Require a passing new-task result
        env:
          VERIFY_EVIDENCE_DIR: ${{ runner.temp }}/verify-evidence
        run: node scripts/ops/require-verify-evidence.mjs "$VERIFY_EVIDENCE_DIR/result.json" new-task

      - name: Upload the live-verify evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-verify-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verify-evidence
          if-no-files-found: warn
          retention-days: 14

  package-arm64:
    needs: [decide]
    if: needs.decide.outputs.release == 'true'
    runs-on: macos-latest
    environment: desktop-release
    timeout-minutes: 60
    env:
      ARCH: arm64
      VERSION: ${{ needs.decide.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.decide.outputs.sha }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check that the host shell Seatbelt profile still reaches the network over TLS
        run: pnpm --filter @xiechimon/cairn-cli exec vitest run test/seatbelt-tls.test.ts

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/tsnet-sidecar/go.mod
          cache-dependency-path: apps/tsnet-sidecar/go.sum

      - name: Build the tsnet sidecar for this arch
        working-directory: apps/tsnet-sidecar
        env:
          CGO_ENABLED: '0'
          GOOS: darwin
          GOARCH: arm64
        run: |
          mkdir -p dist
          go build -trimpath -ldflags '-s -w' -o "dist/tsnet-sidecar-${GOOS}-${GOARCH}" .

      - name: Build the web UI, the server and the Runner
        env:
          CAIRN_DESKTOP_ARCH: arm64
        run: |
          pnpm --filter @cairn/web build
          pnpm --filter @xiechimon/cairn build
          pnpm --filter @xiechimon/cairn-cli build
          node apps/server/scripts/stage-web.mjs
          pnpm --filter @cairn/desktop stage-server
          pnpm --filter @cairn/desktop stage-runner
          pnpm --filter @cairn/desktop stage-agent-desktop
          pnpm --filter @cairn/desktop stage-agent-browser
          test -f "apps/desktop/server/tsnet-sidecar-darwin-arm64"

      - name: Import the release signing certificate
        env:
          P12_BASE64: ${{ secrets.MAC_SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MAC_SIGNING_P12_PASSWORD }}
        run: |
          umask 077
          trap 'rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/signing.password"' EXIT
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          printf '%s' "$P12_PASSWORD" > "$RUNNER_TEMP/signing.password"
          apps/desktop/scripts/import-signing-identity.sh "$RUNNER_TEMP/signing.p12" \
            "$RUNNER_TEMP/signing.password" apps/desktop/signing/cairn-mac-self-signed.crt

      - name: Package the app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ELECTRON_BUILDER_COMPRESSION_LEVEL: '1'
        working-directory: apps/desktop
        run: |
          node build.mjs
          pnpm exec electron-builder --mac dmg zip "--$ARCH" -c.extraMetadata.version="$VERSION"

      - name: Check that the update zip holds an app signed by the release certificate
        working-directory: apps/desktop
        run: |
          mkdir -p "$RUNNER_TEMP/unzipped"
          ditto -x -k "release/Cairn-$VERSION-mac-$ARCH.zip" "$RUNNER_TEMP/unzipped"
          node scripts/check-signature.mjs signing/cairn-mac-self-signed.crt \
            "$RUNNER_TEMP/unzipped/Cairn.app"

      - name: Check that the update zip's Runner resolves the Claude Code binary for its arch
        working-directory: apps/desktop
        run: |
          node scripts/check-runner-claude.mjs \
            "$RUNNER_TEMP/unzipped/Cairn.app/Contents/Resources/runner" darwin "$ARCH"
          node scripts/check-virtual-store.mjs \
            "$RUNNER_TEMP/unzipped/Cairn.app/Contents/Resources/runner" \
            "$RUNNER_TEMP/unzipped/Cairn.app/Contents/Resources/server"

      - name: Package the standalone Runner archive
        working-directory: apps/desktop
        run: |
          mkdir -p release
          tar --numeric-owner --owner=0 --group=0 -C runner -czf "release/cairn-runner-$VERSION-darwin-$ARCH.tar.gz" .

      - name: Keep the arm64 zip for verification and publish
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-arm64-zip
          path: apps/desktop/release/Cairn-${{ env.VERSION }}-mac-arm64.zip
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - name: Keep the arm64 runner archive for publish
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-runner-darwin-arm64
          path: apps/desktop/release/cairn-runner-${{ env.VERSION }}-darwin-arm64.tar.gz
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - name: Keep the arm64 dmg for the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-arm64-dmg
          path: apps/desktop/release/Cairn-${{ env.VERSION }}-mac-arm64.dmg
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - name: Remove the signing keychain
        if: always()
        run: |
          keychain="$RUNNER_TEMP/cairn-signing.keychain-db"
          if [ -e "$keychain" ]; then
            security delete-keychain "$keychain"
          fi

  package-x64:
    needs: [decide]
    if: needs.decide.outputs.release == 'true'
    runs-on: macos-latest
    environment: desktop-release
    timeout-minutes: 60
    env:
      ARCH: x64
      VERSION: ${{ needs.decide.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.decide.outputs.sha }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/tsnet-sidecar/go.mod
          cache-dependency-path: apps/tsnet-sidecar/go.sum

      - name: Build the tsnet sidecar for this arch
        working-directory: apps/tsnet-sidecar
        env:
          CGO_ENABLED: '0'
          GOOS: darwin
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath -ldflags '-s -w' -o "dist/tsnet-sidecar-${GOOS}-${GOARCH}" .

      - name: Build the web UI, the server and the Runner
        env:
          CAIRN_DESKTOP_ARCH: x64
        run: |
          pnpm --filter @cairn/web build
          pnpm --filter @xiechimon/cairn build
          pnpm --filter @xiechimon/cairn-cli build
          node apps/server/scripts/stage-web.mjs
          pnpm --filter @cairn/desktop stage-server
          pnpm --filter @cairn/desktop stage-runner
          pnpm --filter @cairn/desktop stage-agent-desktop
          pnpm --filter @cairn/desktop stage-agent-browser
          test -f "apps/desktop/server/tsnet-sidecar-darwin-amd64"

      - name: Import the release signing certificate
        env:
          P12_BASE64: ${{ secrets.MAC_SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MAC_SIGNING_P12_PASSWORD }}
        run: |
          umask 077
          trap 'rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/signing.password"' EXIT
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          printf '%s' "$P12_PASSWORD" > "$RUNNER_TEMP/signing.password"
          apps/desktop/scripts/import-signing-identity.sh "$RUNNER_TEMP/signing.p12" \
            "$RUNNER_TEMP/signing.password" apps/desktop/signing/cairn-mac-self-signed.crt

      - name: Package the app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ELECTRON_BUILDER_COMPRESSION_LEVEL: '1'
        working-directory: apps/desktop
        run: |
          node build.mjs
          pnpm exec electron-builder --mac dmg zip "--$ARCH" -c.extraMetadata.version="$VERSION"

      - name: Check that the update zip holds an app signed by the release certificate
        working-directory: apps/desktop
        run: |
          mkdir -p "$RUNNER_TEMP/unzipped"
          ditto -x -k "release/Cairn-$VERSION-mac-$ARCH.zip" "$RUNNER_TEMP/unzipped"
          node scripts/check-signature.mjs signing/cairn-mac-self-signed.crt \
            "$RUNNER_TEMP/unzipped/Cairn.app"

      - name: Check that the update zip's Runner resolves the Claude Code binary for its arch
        working-directory: apps/desktop
        run: |
          node scripts/check-runner-claude.mjs \
            "$RUNNER_TEMP/unzipped/Cairn.app/Contents/Resources/runner" darwin "$ARCH"
          node scripts/check-virtual-store.mjs \
            "$RUNNER_TEMP/unzipped/Cairn.app/Contents/Resources/runner" \
            "$RUNNER_TEMP/unzipped/Cairn.app/Contents/Resources/server"

      - name: Package the standalone Runner archive
        working-directory: apps/desktop
        run: |
          mkdir -p release
          tar --numeric-owner --owner=0 --group=0 -C runner -czf "release/cairn-runner-$VERSION-darwin-$ARCH.tar.gz" .

      - name: Keep the packaged x64 files for the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-x64
          path: |
            apps/desktop/release/Cairn-${{ env.VERSION }}-mac-x64.dmg
            apps/desktop/release/Cairn-${{ env.VERSION }}-mac-x64.zip
            apps/desktop/release/cairn-runner-${{ env.VERSION }}-darwin-x64.tar.gz
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - name: Remove the signing keychain
        if: always()
        run: |
          keychain="$RUNNER_TEMP/cairn-signing.keychain-db"
          if [ -e "$keychain" ]; then
            security delete-keychain "$keychain"
          fi

  package-win:
    needs: [decide]
    if: needs.decide.outputs.release == 'true'
    runs-on: windows-latest
    environment: desktop-release
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.decide.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.decide.outputs.sha }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/tsnet-sidecar/go.mod
          cache-dependency-path: apps/tsnet-sidecar/go.sum

      - name: Build the tsnet sidecar for windows-amd64
        working-directory: apps/tsnet-sidecar
        shell: pwsh
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          go build -trimpath -ldflags '-s -w' -o "dist/tsnet-sidecar-windows-amd64.exe" .

      - name: Build the web UI, the server and the Runner
        shell: pwsh
        env:
          CAIRN_DESKTOP_ARCH: x64
        run: |
          pnpm --filter @cairn/web build
          pnpm --filter @xiechimon/cairn build
          pnpm --filter @xiechimon/cairn-cli build
          node apps/server/scripts/stage-web.mjs
          pnpm --filter @cairn/desktop stage-server
          pnpm --filter @cairn/desktop stage-runner

      - name: Package the Windows x64 installer and zip
        working-directory: apps/desktop
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          node build.mjs
          pnpm exec electron-builder --win nsis zip --x64 "-c.extraMetadata.version=$env:VERSION" --publish never
          Compress-Archive -Path runner/* -DestinationPath "release/cairn-runner-$env:VERSION-win-x64.zip" -Force

      - name: Keep the packaged Windows files for the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-win-x64
          path: |
            apps/desktop/release/Cairn-${{ env.VERSION }}-win-x64.exe
            apps/desktop/release/Cairn-${{ env.VERSION }}-win-x64.zip
            apps/desktop/release/cairn-runner-${{ env.VERSION }}-win-x64.zip
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  package-linux:
    needs: [decide]
    if: needs.decide.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: desktop-release
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.decide.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.decide.outputs.sha }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/tsnet-sidecar/go.mod
          cache-dependency-path: apps/tsnet-sidecar/go.sum

      - name: Build the tsnet sidecar for linux-amd64
        working-directory: apps/tsnet-sidecar
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath -ldflags '-s -w' -o dist/tsnet-sidecar-linux-amd64 .

      - name: Build the web UI, the server and the Runner
        env:
          CAIRN_DESKTOP_ARCH: x64
          ARCH: x64
        run: |
          pnpm --filter @cairn/web build
          pnpm --filter @xiechimon/cairn build
          pnpm --filter @xiechimon/cairn-cli build
          node apps/server/scripts/stage-web.mjs
          pnpm --filter @cairn/desktop stage-server
          pnpm --filter @cairn/desktop stage-runner
          test -f apps/desktop/server/tsnet-sidecar-linux-amd64

      - name: Package the Linux x64 archive
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -o pipefail
          node build.mjs
          pnpm exec electron-builder --linux dir --x64 -c.extraMetadata.version="$VERSION" --publish never
          prefix="Cairn-$VERSION-linux-x64"
          rm -rf "release/$prefix"
          mv release/linux-unpacked "release/$prefix"
          if command -v pigz >/dev/null 2>&1; then
            compress="pigz -6"
          else
            compress="gzip -6"
          fi
          tar --numeric-owner --owner=0 --group=0 -C release -cf - "$prefix" | $compress > "release/$prefix.tar.gz"

      - name: Package the Linux Runner archive
        working-directory: apps/desktop
        run: |
          set -o pipefail
          if command -v pigz >/dev/null 2>&1; then
            compress="pigz -6"
          else
            compress="gzip -6"
          fi
          tar --numeric-owner --owner=0 --group=0 -C runner -cf - . | $compress > "release/cairn-runner-$VERSION-linux-x64.tar.gz"

      - name: Check that the Linux archive holds the Runner and sidecar
        working-directory: apps/desktop
        run: |
          mkdir -p "$RUNNER_TEMP/extracted"
          tar -xzf "release/Cairn-$VERSION-linux-x64.tar.gz" -C "$RUNNER_TEMP/extracted" --strip-components=1
          test -x "$RUNNER_TEMP/extracted/cairn"
          test -f "$RUNNER_TEMP/extracted/resources/server/tsnet-sidecar-linux-amd64"
          node scripts/check-runner-claude.mjs "$RUNNER_TEMP/extracted/resources/runner" linux x64
          node scripts/check-virtual-store.mjs \
            "$RUNNER_TEMP/extracted/resources/runner" \
            "$RUNNER_TEMP/extracted/resources/server"

      - name: Keep the packaged Linux archive for the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-linux-x64
          path: |
            apps/desktop/release/Cairn-${{ env.VERSION }}-linux-x64.tar.gz
            apps/desktop/release/cairn-runner-${{ env.VERSION }}-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  verify-arm64-smoke:
    needs: [decide, package-arm64]
    if: needs.decide.outputs.release == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.decide.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.decide.outputs.sha }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-arm64-zip
          path: apps/desktop/release

      - name: Unpack the arm64 app for smoke verification
        working-directory: apps/desktop
        run: |
          mkdir -p "$RUNNER_TEMP/unzipped"
          ditto -x -k "release/Cairn-$VERSION-mac-arm64.zip" "$RUNNER_TEMP/unzipped"

      - name: Launch the arm64 app before publishing it
        working-directory: apps/desktop
        env:
          CAIRN_SMOKE_ISOLATED_SESSION: '1'
        run: node scripts/smoke-mac.mjs "$RUNNER_TEMP/unzipped/Cairn.app" "$RUNNER_TEMP/smoke.png"

  verify-arm64-journeys:
    needs: [decide, package-arm64]
    if: needs.decide.outputs.release == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [local-server, remote-server]
    env:
      VERSION: ${{ needs.decide.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.decide.outputs.sha }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-arm64-zip
          path: apps/desktop/release

      - name: Unpack the arm64 app for journey verification
        working-directory: apps/desktop
        run: |
          mkdir -p "$RUNNER_TEMP/unzipped"
          ditto -x -k "release/Cairn-$VERSION-mac-arm64.zip" "$RUNNER_TEMP/unzipped"

      - name: Walk the packaged feature journeys in local and remote server modes
        if: hashFiles('apps/desktop/scripts/journeys/*.mjs') != ''
        timeout-minutes: 20
        working-directory: apps/desktop
        env:
          CAIRN_SMOKE_ISOLATED_SESSION: '1'
        run: node scripts/packaged-journey.mjs "$RUNNER_TEMP/unzipped/Cairn.app" "$RUNNER_TEMP/packaged-journeys" --mode "${{ matrix.mode }}"

      - name: Upload packaged journey evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packaged-journeys-${{ matrix.mode }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/packaged-journeys
          if-no-files-found: ignore
          retention-days: 14

  verify-arm64-post-install:
    needs: [decide, package-arm64]
    if: needs.decide.outputs.release == 'true'
    uses: ./.github/workflows/desktop-release-migration.yml
    with:
      sha: ${{ needs.decide.outputs.sha }}
      version: ${{ needs.decide.outputs.version }}

  finalize:
    needs:
      - decide
      - package-arm64
      - package-x64
      - package-win
      - package-linux
      - live-verify
      - verify-arm64-smoke
      - verify-arm64-journeys
      - verify-arm64-post-install
    if: github.run_attempt == 1 && needs.decide.outputs.release == 'true'
    concurrency:
      group: desktop-release
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/desktop-release-finalize.yml
    with:
      sha: ${{ needs.decide.outputs.sha }}
      version: ${{ needs.decide.outputs.version }}
      release_id: ${{ needs.decide.outputs.release_id }}
      migration_baseline: ${{ needs.verify-arm64-post-install.outputs.baseline }}
