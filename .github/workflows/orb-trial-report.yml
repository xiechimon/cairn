name: orb-trial-report

on:
  pull_request:
    paths:
      - scripts/ops/orb/trial-report.mjs
      - scripts/ops/orb/trial-report.test.mjs
      - scripts/test-tmpdir.mjs
      - .github/workflows/orb-trial-report.yml
  push:
    branches: [main]
    paths:
      - scripts/ops/orb/trial-report.mjs
      - scripts/ops/orb/trial-report.test.mjs
      - scripts/test-tmpdir.mjs
      - .github/workflows/orb-trial-report.yml

permissions:
  contents: read

concurrency:
  group: orb-trial-report-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trial-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          package-manager-cache: false
      - run: node --test scripts/ops/orb/trial-report.test.mjs
