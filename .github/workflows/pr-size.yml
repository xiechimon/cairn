name: pr-size

# pull_request_target so fork and Dependabot PRs get a token that can write
# labels and check runs. It is safe because the job checks out only main's
# script and reads the PR through the API, never running PR code, so a PR
# cannot edit the generated-path list that judges it. The script posts the
# `pr-size` check run on the PR head itself, so workflow_dispatch can report
# it for one PR or, with no input, for every open PR.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to size; empty sizes every open PR
        required: false

permissions:
  contents: read
  checks: write
  issues: write
  pull-requests: write

concurrency:
  group: pr-size-${{ github.event.pull_request.number || inputs.pr || 'all' }}
  cancel-in-progress: true

jobs:
  size:
    if: ${{ github.event_name == 'workflow_dispatch' || !startsWith(github.event.pull_request.head.ref, 'mergify/merge-queue/') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts/pr-size.mjs
          sparse-checkout-cone-mode: false

      - name: Label each PR and post its pr-size check on the head
        run: node scripts/pr-size.mjs report "$GITHUB_REPOSITORY" $PR_NUMBER
