name: pr-size

# A size:* label for context only (D68), as t3code does: it never blocks and
# no required check depends on it. pull_request_target so fork and Dependabot
# PRs get a token that can write labels; it is safe because the job checks out
# only main's script and reads the PR through the API, never running PR code.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-size-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts/pr-size.mjs
          sparse-checkout-cone-mode: false

      - name: Label the PR by changed lines
        run: |
          if [ ! -f scripts/pr-size.mjs ]; then
            echo "pr-size: main has no scripts/pr-size.mjs yet"
            exit 0
          fi
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" > "$RUNNER_TEMP/files.json"
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" > "$RUNNER_TEMP/labels.json"
          plan="$(node scripts/pr-size.mjs "$RUNNER_TEMP/files.json" "$RUNNER_TEMP/labels.json")"
          echo "pr-size: $plan"
          for name in $(jq -r '.remove[]' <<<"$plan"); do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels/$(jq -rn --arg n "$name" '$n|@uri')" > /dev/null
          done
          for name in $(jq -r '.add[]' <<<"$plan"); do
            gh label create "$name" --color "$(jq -r '.color' <<<"$plan")" --description "Changed lines, tests and generated files left out (context only)" --force > /dev/null
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" -f "labels[]=$name" > /dev/null
          done
