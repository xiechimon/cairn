name: desktop-mac

on:
  pull_request:
    paths:
      - apps/desktop/**
      - .github/workflows/desktop-mac.yml
  push:
    branches: [main]
    paths:
      - apps/desktop/**
      - .github/workflows/desktop-mac.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-mac-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the web UI, the server and the Runner
        run: |
          pnpm --filter @cairn/web build
          pnpm --filter @xiechimon/cairn build
          pnpm --filter @xiechimon/cairn-cli build
          node apps/server/scripts/stage-web.mjs

      - name: Stage the server and the Runner into the desktop app
        run: |
          pnpm --filter @cairn/desktop stage-server
          pnpm --filter @cairn/desktop stage-runner

      - name: Run the desktop unit tests
        run: node --test apps/desktop/scripts/check-signature.test.mjs apps/desktop/scripts/keep-awake.test.mjs apps/desktop/scripts/otel-config.test.mjs apps/desktop/scripts/app-menu.test.mjs apps/desktop/scripts/context-menu.test.mjs apps/desktop/scripts/restart-budget.test.mjs apps/desktop/scripts/server-log.test.mjs apps/desktop/scripts/own-computer.test.mjs apps/desktop/scripts/tray-popover.test.mjs

      - name: Import a throwaway signing certificate
        run: |
          apps/desktop/scripts/new-signing-certificate.sh "$RUNNER_TEMP/throwaway" "Cairn CI Throwaway" 2
          apps/desktop/scripts/import-signing-identity.sh "$RUNNER_TEMP/throwaway/signing.p12" \
            "$RUNNER_TEMP/throwaway/p12-password" "$RUNNER_TEMP/throwaway/signing.cert.pem"
          echo "SIGNING_CERT=$RUNNER_TEMP/throwaway/signing.cert.pem" >> "$GITHUB_ENV"

      - name: Package the arm64 DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_FOR_PULL_REQUEST: 'true'
        working-directory: apps/desktop
        run: |
          node build.mjs
          pnpm exec electron-builder --mac dmg --arm64

      - name: Check that the app is signed by the certificate, not ad-hoc
        working-directory: apps/desktop
        run: node scripts/check-signature.mjs "$SIGNING_CERT" release/mac-arm64/Cairn.app

      - name: Check that the packaged Runner resolves the Claude Code binary
        working-directory: apps/desktop
        run: node scripts/check-runner-claude.mjs release/mac-arm64/Cairn.app/Contents/Resources/runner darwin arm64

      - name: Launch the packaged app and check the owner sign-in
        working-directory: apps/desktop
        run: pnpm smoke

      - name: Upload the DMG unzipped
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: apps/desktop/release/*.dmg
          archive: false
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the smoke screenshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: apps/desktop/release/smoke.png
          archive: false
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the tray popover screenshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: apps/desktop/release/tray.png
          archive: false
          if-no-files-found: ignore
          retention-days: 7
