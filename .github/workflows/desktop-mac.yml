name: desktop-mac

on:
  pull_request:
    paths:
      - apps/desktop/**
      - .github/workflows/desktop-mac.yml
  push:
    branches: [main]
    paths:
      - apps/desktop/**
      - .github/workflows/desktop-mac.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-mac-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  update-signature:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          package-manager-cache: false

      - name: Restore failed-only CI state
        uses: ./.github/actions/failed-only-restore
        with:
          key: desktop-mac-signature

      - name: Import two throwaway signing certificates with the same name
        shell: bash
        run: |
          signing_dir=$(mktemp -d "$RUNNER_TEMP/updater-signing.XXXXXX")
          keychain="$signing_dir/updater.keychain-db"
          password=$(openssl rand -hex 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security list-keychains -d user -s "$keychain"
          echo "CAIRN_TEST_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          for signer in SIGNER OTHER_SIGNER; do
            dir="$signing_dir/$signer"
            apps/desktop/scripts/new-signing-certificate.sh "$dir" 'Cairn Updater CI' 2
            security import "$dir/signing.p12" -k "$keychain" -f pkcs12 \
              -P "$(<"$dir/p12-password")" -T /usr/bin/codesign
            fingerprint=$(openssl x509 -in "$dir/signing.cert.pem" -noout -fingerprint -sha1 | cut -d= -f2 | tr -d ':')
            echo "CAIRN_TEST_$signer=$fingerprint" >> "$GITHUB_ENV"
          done
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security find-identity -p codesigning "$keychain"

      - name: Test the updater with real macOS signatures
        env:
          CAIRN_REQUIRE_MAC_SIGNATURE_TESTS: '1'
        run: node scripts/ops/ci-failed-only.mjs node-test --key signature-mac -- node --test apps/desktop/scripts/signature-mac.test.mjs

      - name: Save failed-only CI state
        if: failure()
        uses: ./.github/actions/failed-only-save
        with:
          key: desktop-mac-signature

  package:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore failed-only CI state
        uses: ./.github/actions/failed-only-restore
        with:
          key: desktop-mac-package

      - name: Build the web UI, the server and the Runner
        run: |
          pnpm --filter @cairn/web build
          pnpm --filter @xiechimon/cairn build
          pnpm --filter @xiechimon/cairn-cli build
          node apps/server/scripts/stage-web.mjs

      - name: Stage the server and the Runner into the desktop app
        run: |
          pnpm --filter @cairn/desktop stage-server
          pnpm --filter @cairn/desktop stage-runner

      - name: Run the desktop unit tests
        run: node scripts/ops/ci-failed-only.mjs node-test --key desktop-unit-tests -- node --test apps/desktop/scripts/check-virtual-store.test.mjs apps/desktop/scripts/check-signature.test.mjs apps/desktop/scripts/keep-awake.test.mjs apps/desktop/scripts/otel-config.test.mjs apps/desktop/scripts/app-menu.test.mjs apps/desktop/scripts/context-menu.test.mjs apps/desktop/scripts/restart-budget.test.mjs apps/desktop/scripts/server-log.test.mjs apps/desktop/scripts/server-exit.test.mjs apps/desktop/scripts/runner-home.test.mjs apps/desktop/scripts/smoke-mac.test.mjs apps/desktop/scripts/own-computer.test.mjs apps/desktop/scripts/tray-popover.test.mjs apps/desktop/scripts/update-apply.test.mjs apps/desktop/scripts/update-staging.test.mjs apps/desktop/scripts/update-log.test.mjs apps/desktop/scripts/update-state.test.mjs apps/desktop/scripts/update-error.test.mjs apps/desktop/scripts/update-guard.test.mjs apps/desktop/scripts/update-swap.test.mjs apps/desktop/scripts/signature.test.mjs apps/desktop/scripts/desktop-copy.test.mjs apps/desktop/scripts/update-copy.test.mjs apps/desktop/scripts/page-capture.test.mjs apps/desktop/scripts/window-state.test.mjs apps/desktop/scripts/native-tray.test.mjs apps/desktop/scripts/tray-helper.test.mjs

      - name: Import a throwaway signing certificate
        run: |
          apps/desktop/scripts/new-signing-certificate.sh "$RUNNER_TEMP/throwaway" "Cairn CI Throwaway" 2
          apps/desktop/scripts/import-signing-identity.sh "$RUNNER_TEMP/throwaway/signing.p12" \
            "$RUNNER_TEMP/throwaway/p12-password" "$RUNNER_TEMP/throwaway/signing.cert.pem"
          echo "SIGNING_CERT=$RUNNER_TEMP/throwaway/signing.cert.pem" >> "$GITHUB_ENV"

      - name: Package the arm64 DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_FOR_PULL_REQUEST: 'true'
        working-directory: apps/desktop
        run: |
          node build.mjs
          pnpm exec electron-builder --mac dmg --arm64

      - name: Check that the app is signed by the certificate, not ad-hoc
        working-directory: apps/desktop
        run: node scripts/check-signature.mjs "$SIGNING_CERT" release/mac-arm64/Cairn.app

      - name: Check that the packaged Runner resolves the Claude Code binary
        working-directory: apps/desktop
        run: |
          node scripts/check-runner-claude.mjs release/mac-arm64/Cairn.app/Contents/Resources/runner darwin arm64
          node scripts/check-virtual-store.mjs release/mac-arm64/Cairn.app/Contents/Resources/runner release/mac-arm64/Cairn.app/Contents/Resources/server

      - name: Launch the packaged app and check the owner sign-in
        working-directory: apps/desktop
        env:
          CAIRN_SMOKE_ISOLATED_SESSION: '1'
        run: pnpm smoke

      - name: Upload the DMG unzipped
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: apps/desktop/release/*.dmg
          archive: false
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the smoke screenshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: apps/desktop/release/smoke.png
          archive: false
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the remote Antigravity smoke screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ag-remote-smoke
          path: apps/desktop/release/smoke-ag-*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the remote update smoke screenshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: apps/desktop/release/smoke-remote-update.png
          archive: false
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the tray popover screenshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: apps/desktop/release/tray.png
          archive: false
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the native tray menu screenshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: apps/desktop/release/tray-native.png
          archive: false
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the native tray menu walkthrough recording
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tray-native-walk
          path: apps/desktop/release/tray-native-walk*
          if-no-files-found: ignore
          retention-days: 7

      - name: Save failed-only CI state
        if: failure()
        uses: ./.github/actions/failed-only-save
        with:
          key: desktop-mac-package
