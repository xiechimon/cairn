name: pr-screens

# Non-blocking report for PRs that touch apps/web (D117): the audited pages this
# diff can reach (scripts/pr-screens-select.mjs; a shared surface selects all)
# are screenshotted on the merge base on main and on the PR head by the same
# runner image, the two sets are diffed with Playwright's snapshot comparison,
# and axe (WCAG 2.2 AA, D118 Q7) runs on the same pages. Changed pages show
# inline in a sticky PR comment; the images live on pr-assets/screens-<pr> and
# the branch is deleted when the PR closes. Nothing here is a required check,
# and every step that inspects the product is allowed to fail.
#
# Third-party actions are pinned to full commit SHAs with trailing version
# comments (#1076); keep the version comment, Dependabot parses it.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
    paths:
      - 'apps/web/**'
      - 'packages/**'

concurrency:
  group: pr-screens-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  select:
    if: ${{ github.event.action != 'closed' && !(github.event.pull_request.draft && github.event.pull_request.user.login == 'mergify[bot]' && startsWith(github.head_ref, 'mergify/merge-queue/')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pages: ${{ steps.select.outputs.pages }}
      count: ${{ steps.select.outputs.count }}
      selection: ${{ steps.select.outputs.selection }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Select the audited pages this diff can reach
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          merge_base="$(git merge-base "$BASE_SHA" HEAD)"
          result="$(node scripts/pr-screens-select.mjs --base "$merge_base" --head HEAD)"
          echo "$result"
          echo "pages=$(jq -r .pages <<< "$result")" >> "$GITHUB_OUTPUT"
          echo "count=$(jq -r .count <<< "$result")" >> "$GITHUB_OUTPUT"
          echo "selection=$(jq -c '{all, count, total}' <<< "$result")" >> "$GITHUB_OUTPUT"

  capture:
    needs: select
    if: ${{ needs.select.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        side: [base, head]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Use the merge base sources for the base side
        if: ${{ matrix.side == 'base' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          merge_base="$(git merge-base "$BASE_SHA" HEAD)"
          git checkout "$merge_base" -- apps/web/src apps/web/public apps/web/index.html apps/web/design.html apps/web/vite.config.ts apps/web/postcss.config.js packages

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Use the primary Ubuntu mirror with bounded apt retries
        run: |
          sudo sed -i 's#azure.archive.ubuntu.com#archive.ubuntu.com#g' /etc/apt/apt-mirrors.txt
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' | sudo tee /etc/apt/apt.conf.d/99-ci-bounded > /dev/null

      - name: Install Playwright chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Screenshot every audited page and run axe
        working-directory: apps/web
        continue-on-error: true
        env:
          PR_SCREENS_OUT: pr-screens-out
          PR_SCREENS_PAGES: ${{ needs.select.outputs.pages }}
        run: pnpm exec playwright test -c playwright.pr-screens.config.ts

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screens-${{ matrix.side }}
          path: apps/web/pr-screens-out/
          if-no-files-found: error
          retention-days: 7

  compare:
    needs: [select, capture]
    if: ${{ !cancelled() && needs.capture.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: screens-base
          path: apps/web/pr-screens-base

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: screens-head
          path: apps/web/pr-screens-head

      - name: Diff the two sets
        working-directory: apps/web
        env:
          PR_SCREENS_BASE: pr-screens-base
          PR_SCREENS_HEAD: pr-screens-head
        run: pnpm exec playwright test -c playwright.pr-screens-compare.config.ts || true

      - name: Read the capture job durations
        id: durations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --paginate \
            --jq '[.jobs[] | select(.name | startswith("capture")) | {key: (.name | capture("\\((?<side>[a-z]+)\\)").side), value: ((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601))}] | from_entries' > "$RUNNER_TEMP/durations.json"
          echo "json=$(jq -c . "$RUNNER_TEMP/durations.json")" >> "$GITHUB_OUTPUT"

      - name: Build the report images
        run: node scripts/pr-screens-report.mjs --head apps/web/pr-screens-head --base apps/web/pr-screens-base --results apps/web/pr-screens-results --out apps/web/pr-screens-report --selection '${{ needs.select.outputs.selection }}' --durations '${{ steps.durations.outputs.json }}' > /dev/null

      - name: Publish the changed pages for the comment
        id: assets
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          branch="pr-assets/screens-$PR_NUMBER"
          remote="https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          assets="$RUNNER_TEMP/assets"
          if git ls-remote --exit-code --heads "$remote" "$branch" > /dev/null; then
            git clone --quiet --depth 1 --branch "$branch" "$remote" "$assets"
          else
            git init -q "$assets"
            git -C "$assets" checkout -q --orphan "$branch"
            git -C "$assets" remote add origin "$remote"
          fi
          mkdir -p "$assets/$HEAD_SHA"
          cp apps/web/pr-screens-report/*.png "$assets/$HEAD_SHA/"
          git -C "$assets" config user.name 'github-actions[bot]'
          git -C "$assets" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$assets" add "$HEAD_SHA"
          git -C "$assets" commit -q -m "pr-screens: pages changed on $HEAD_SHA (#$PR_NUMBER)"
          git -C "$assets" push -q origin "HEAD:refs/heads/$branch"
          echo "base=https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$(git -C "$assets" rev-parse HEAD)/$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Build the report
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ASSET_BASE: ${{ steps.assets.outputs.base }}
        run: |
          node scripts/pr-screens-report.mjs --head apps/web/pr-screens-head --base apps/web/pr-screens-base --results apps/web/pr-screens-results --out apps/web/pr-screens-report --selection '${{ needs.select.outputs.selection }}' --durations '${{ steps.durations.outputs.json }}' | tee "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-screens-report
          path: apps/web/pr-screens-report/
          retention-days: 7

      - name: Upsert sticky comment
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          marker='<!-- pr-screens -->'
          body="$RUNNER_TEMP/comment.md"
          { printf '%s\n' "$marker"; head -c 60000 apps/web/pr-screens-report/report.md; } > "$body"
          comment_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -F "body=@$body"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -F "body=@$body"
          fi

  cleanup:
    if: ${{ github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Delete the screenshot branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/pr-assets/screens-$PR_NUMBER" || echo "no screenshot branch for #$PR_NUMBER"
