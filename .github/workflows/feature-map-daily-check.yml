name: feature-map-daily-check

on:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  feature-map-daily-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Check docs/feature-map.md against its sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/generate-feature-map.mjs --check
