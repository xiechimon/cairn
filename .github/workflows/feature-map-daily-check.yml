name: feature-map-daily-check

on:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: feature-map-daily-check
  cancel-in-progress: false

jobs:
  feature-map-daily-check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Feature-map maintain (feature registry + verify-cairn index)
        run: |
          set +e
          node scripts/feature-map-maintain.mjs --file-issue | tee maintain-report.md
          status=${PIPESTATUS[0]}
          set -e
          cat maintain-report.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::error::feature-map maintain failed; an issue should be opened or commented (see docs/ops/feature-map-maintain.md). Issue filing uses github.token + issues:write — no FEATURE_MAP_* secret required. If filing failed, check workflow permissions and that labels documentation, batch:next, by:cairn exist."
          fi
          exit "$status"
