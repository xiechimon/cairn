        run: node --test scripts/ops/cairn-ops/run.test.mjs scripts/ops/cairn-ops/install.test.mjs

  ops-backup-test:
    needs: changes
    if: needs.changes.outputs.has-code != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Server backup script against an rrsync receiver (#2163)
        run: |
          command -v sqlite3 >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q sqlite3; }
          curl -fsSL -o "$RUNNER_TEMP/rrsync" https://raw.githubusercontent.com/RsyncProject/rsync/v3.4.1/support/rrsync
          echo "0bb743f8155907ed2a337c12a4672c67269e372803939ec98dac497edc714c9b  $RUNNER_TEMP/rrsync" | sha256sum -c -
          RRSYNC="$RUNNER_TEMP/rrsync" node --test scripts/ops/backup-server-db.test.mjs scripts/ops/push-test.test.mjs scripts/ops/push-worker.test.mjs
      - name: Self-deploy and deploy-lag watch fixtures (#2288)
        if: ${{ !cancelled() && needs.changes.outputs.ops-selftests == 'true' }}
        run: node --test scripts/ops/deploy-self.test.mjs scripts/ops/control-plane-units.test.mjs
