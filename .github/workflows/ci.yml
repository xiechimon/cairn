name: ci

# Third-party actions are pinned to full commit SHAs (#1076); the trailing version is Dependabot's anchor.
on:
  push:
    branches: [main, 'queue/**', 'preflight/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && format('ci-push-{0}-{1}', github.ref, github.sha) || format('ci-ref-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # A GitHub runner is one job's machine; the flag keeps that bypass visible in the log.
  CAIRN_HEAVY_GATE_BYPASS: '1'

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    outputs:
      has-code: ${{ steps.classify.outputs.has-code }}
      has-sidecar: ${{ steps.classify.outputs.has-sidecar }}
      gates-needed: ${{ steps.classify.outputs.gates-needed }}
      ops-selftests: ${{ steps.classify.outputs.ops-selftests }}
      needs-integration: ${{ steps.classify.outputs.needs-integration }}
      eval-needed: ${{ steps.classify.outputs.eval-needed }}
      base-sha: ${{ steps.classify.outputs.base-sha }}
      e2e-tier: ${{ (github.event_name == 'pull_request' && github.event.pull_request.draft) && 'none' || steps.classify.outputs.e2e-tier }}
      reused-sha: ${{ steps.reuse.outputs.reused-sha }}
      reused-run-id: ${{ steps.reuse.outputs.reused-run-id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Classify changes
        id: classify
        env:
          PREPUSH_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          has_code=true
          has_sidecar=true
          gates_needed=true
          ops_selftests=true
          needs_integration=true
          eval_needed=true
          e2e_tier=full
          base_ref=""
          case "$GITHUB_REF" in
            refs/heads/queue/* | refs/heads/preflight/*)
              base_ref=$(git merge-base origin/main HEAD 2>/dev/null || true)
              ;;
            *)
              if [ -n "${PREPUSH_BASE_SHA:-}" ] && ! printf '%s\n' "$PREPUSH_BASE_SHA" | grep -qE '^0+$' && git cat-file -e "${PREPUSH_BASE_SHA}^{commit}" 2>/dev/null; then
                base_ref=$(git merge-base "$PREPUSH_BASE_SHA" HEAD 2>/dev/null || printf '%s' "$PREPUSH_BASE_SHA")
              fi
              ;;
          esac
          if [ -n "$base_ref" ]; then
            changed=$(git diff --name-only -z "$base_ref" HEAD | tr '\0' '\n')
            if ! printf '%s\n' "$changed" | grep -qE '^(scripts/|\.github/|\.claude/skills/verify-cairn/scripts/|ops/langfuse/|packages/shared/|package\.json$|pnpm-lock\.yaml$)'; then
              ops_selftests=false
            fi
            if ! printf '%s\n' "$changed" | grep -qE '^(apps/server/|apps/daemon/|integration/|packages/shared/|scripts/|\.github/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$)'; then
              needs_integration=false
            fi
            if ! printf '%s\n' "$changed" | grep -qE '^(apps/server/src/coordinator/|apps/server/src/services/(chief|coordinator-|project-instructions|memory|team-memory|routing-|step-route|machine-routing|model-routing|dispatch-|schedules|schedule-run|thread-schedule)|packages/shared/src/(protocol/chief-tools|skill-)|eval/|\.github/workflows/(ci|eval-weekly)\.yml$|docs/agent-dispatch-prompts\.md|scripts/dispatch-agent\.m?js)'; then
              eval_needed=false
            fi
            has_code=$(PREPUSH_BASE_SHA="$base_ref" node scripts/prepush.mjs --has-code) || has_code=true
            has_sidecar=$(PREPUSH_BASE_SHA="$base_ref" node scripts/prepush.mjs --has-sidecar) || has_sidecar=true
            gates_needed=$(PREPUSH_BASE_SHA="$base_ref" node scripts/prepush.mjs --needs-gates) || gates_needed=true
            if [ "$has_code" = "false" ]; then
              e2e_tier=none
            elif printf '%s\n' "$changed" | grep -qE '^(apps/web/(package\.json|index\.html|vite\.config|playwright\.config)|apps/web/src/(components/|styles/|main\.tsx$|App\.tsx$)|packages/shared/|package\.json$|pnpm-lock\.yaml$|\.github/actions/playwright-chromium/)'; then
              e2e_tier=full
            elif printf '%s\n' "$changed" | grep -vE '\.test\.tsx?$' | grep -qE '^(apps/web/src/|apps/web/e2e/|apps/server/(src/|drizzle/|package\.json$))'; then
              e2e_tier=affected
            else
              e2e_tier=none
            fi
          fi
          echo "has-code=$has_code" >> "$GITHUB_OUTPUT"
          echo "has-sidecar=$has_sidecar" >> "$GITHUB_OUTPUT"
          echo "gates-needed=$gates_needed" >> "$GITHUB_OUTPUT"
          echo "ops-selftests=$ops_selftests" >> "$GITHUB_OUTPUT"
          echo "needs-integration=$needs_integration" >> "$GITHUB_OUTPUT"
          echo "eval-needed=$eval_needed" >> "$GITHUB_OUTPUT"
          echo "base-sha=$base_ref" >> "$GITHUB_OUTPUT"
          echo "e2e-tier=$e2e_tier" >> "$GITHUB_OUTPUT"

      - name: Reuse verified CI
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_SIDECAR: ${{ steps.classify.outputs.has-sidecar }}
          EVAL_REQUIRED: ${{ steps.classify.outputs.eval-needed == 'true' && vars.EVAL_ENABLED == 'true' && 'true' || 'false' }}
        run: node scripts/ops/ci-reuse-verified.mjs >> "$GITHUB_OUTPUT"

  # #762: branch protection treats skipped jobs as success; always() ensures aggregates report failures.
  check:
    needs: [changes, check-core, vitest-light, vitest-integration, tsnet-sidecar, gates, eval]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate check parts
        run: |
          [ "${{ needs.changes.result }}" = "success" ]
          if [ "${{ needs.changes.outputs.reused-sha }}" = "true" ]; then
            [ "$GITHUB_REF" = "refs/heads/main" ] || [ "${GITHUB_REF#refs/heads/queue/try/}" != "$GITHUB_REF" ]
            [ "${{ github.event_name }}" = "push" ]
            [ -n "${{ needs.changes.outputs.reused-run-id }}" ]
            exit 0
          fi
          ev_result="${{ needs.eval.result }}"
          if [ "$ev_result" != "success" ]; then
            if [ "$ev_result" = "skipped" ]; then
              case "$GITHUB_REF" in
                refs/heads/queue/* | refs/heads/preflight/*)
                  if [ "${{ needs.changes.outputs.eval-needed }}" = "true" ] && \
                     [ "${{ vars.EVAL_ENABLED }}" = "true" ]; then
                    exit 1
                  fi
                  ;;
              esac
            else
              exit 1
            fi
          fi
          for result in "${{ needs.check-core.result }}" "${{ needs.vitest-light.result }}"; do
            if [ "$result" = "success" ]; then
              continue
            fi
            [ "${{ needs.changes.outputs.has-code }}" = "false" ] && [ "$result" = "skipped" ] || exit 1
          done
          gates_result="${{ needs.gates.result }}"
          if [ "$gates_result" != "success" ]; then
            [ "$gates_result" = "skipped" ] && [ "${{ needs.changes.outputs.gates-needed }}" = "false" ] || exit 1
          fi
          vi_result="${{ needs.vitest-integration.result }}"
          if [ "$vi_result" != "success" ]; then
            [ "$vi_result" = "skipped" ] &&
              { [ "${{ needs.changes.outputs.has-code }}" = "false" ] ||
                [ "${{ needs.changes.outputs.needs-integration }}" = "false" ]; } ||
              exit 1
          fi
          for result in "${{ needs.tsnet-sidecar.result }}"; do
            if [ "$result" = "success" ]; then
              continue
            fi
            [ "${{ needs.changes.outputs.has-sidecar }}" = "false" ] && [ "$result" = "skipped" ] || exit 1
          done

  check-core:
    needs: changes
    if: needs.changes.outputs.reused-sha != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Restore failed-only CI state
        uses: ./.github/actions/failed-only-restore
        with:
          key: check-core

      - name: Conflict markers
        run: |
          if git grep -nE '^(<<<<<<< |>>>>>>> )' -- . ; then
            echo "::error::committed conflict markers — resolve the merge, do not commit the markers"
            exit 1
          fi

      - name: CI runner capacity gate
        run: node scripts/ops/ci-capacity-gate.mjs

      - name: UI registry gate (#989)
        env:
          UI_REGISTRY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ops/ci-failed-only.mjs step --key ui-registry-gate -- node scripts/ui-registry-gate.mjs

      - name: UI consumer shape gate (#1054)
        run: node scripts/ops/ci-failed-only.mjs step --key ui-consumer-shape-gate -- node scripts/ui-consumer-shape-gate.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regression inversion gate (light tests)
        env:
          PREPUSH_BASE_SHA: ${{ needs.changes.outputs.base-sha || github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/ops/ci-failed-only.mjs step --key regression-inversion-light -- node scripts/regression-inversion-gate.mjs --mode light

      - name: Prepush checks (#1533)
        env:
          PREPUSH_BASE_SHA: ${{ needs.changes.outputs.base-sha || github.event.pull_request.base.sha || github.event.before }}
          ENGLISH_ONLY_BASE_SHA: ${{ needs.changes.outputs.base-sha || github.event.pull_request.base.sha || github.event.before }}
          UI_DEBT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pnpm prepush --ci

      - name: Install gitleaks for the secret scan self-test (sha256-verified)
        if: needs.changes.outputs.ops-selftests == 'true'
        run: |
          bash scripts/ci-retry.sh curl -fsSL --connect-timeout 15 --max-time 60 -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"

      - name: Prepush self-test
        if: needs.changes.outputs.ops-selftests == 'true'
        run: pnpm prepush --self-test

      - name: verify-cairn CLI self-test (#1402)
        if: needs.changes.outputs.ops-selftests == 'true'
        run: node scripts/ops/ci-failed-only.mjs step --key vp-selftest -- node .claude/skills/verify-cairn/scripts/vp-selftest.mjs

      - name: Drizzle snapshot chain guard
        if: needs.changes.outputs.has-code != 'false'
        run: node scripts/ops/ci-failed-only.mjs step --key db-check -- pnpm --filter @xiechimon/cairn db:check

      - name: Drizzle migration drift check
        if: needs.changes.outputs.has-code != 'false'
        run: node scripts/ops/ci-failed-only.mjs step --key db-drift -- sh -c 'pnpm --filter @xiechimon/cairn db:generate && git add -N apps/server/drizzle && git diff --exit-code apps/server/drizzle'

      - name: Save failed-only CI state
        if: failure()
        uses: ./.github/actions/failed-only-save
        with:
          key: check-core

  vitest-light:
    needs: changes
    if: needs.changes.outputs.has-code != 'false' && needs.changes.outputs.reused-sha != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Restore failed-only CI state
        uses: ./.github/actions/failed-only-restore
        with:
          key: vitest-light-${{ matrix.shard }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install fish and zsh for the login shell tests
        run: command -v fish zsh >/dev/null || { bash scripts/ci-retry.sh sudo apt-get update -q && bash scripts/ci-retry.sh sudo apt-get install -y -q --no-install-recommends fish zsh; }

      - name: Test (vitest, light project)
        run: VITEST_PROJECT_SET=light node scripts/test-temp-run.mjs -- pnpm test --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Save failed-only CI state
        if: failure()
        uses: ./.github/actions/failed-only-save
        with:
          key: vitest-light-${{ matrix.shard }}

  vitest-integration:
    needs: changes
    if: needs.changes.outputs.has-code != 'false' && needs.changes.outputs.needs-integration != 'false' && needs.changes.outputs.reused-sha != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Restore failed-only CI state
        uses: ./.github/actions/failed-only-restore
        with:
          key: vitest-integration-${{ matrix.shard }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The integration vitest suites launch real Chromium; a missing executable fails browserType.launch.
      - name: Install Playwright chromium
        uses: ./.github/actions/playwright-chromium

      - name: Regression inversion gate (integration tests)
        if: matrix.shard == 1
        env:
          PREPUSH_BASE_SHA: ${{ needs.changes.outputs.base-sha || github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/ops/ci-failed-only.mjs step --key regression-inversion-integration -- node scripts/regression-inversion-gate.mjs --mode integration

      - name: Test (vitest, integration stack)
        run: VITEST_PROJECT_SET=integration node scripts/test-temp-run.mjs -- pnpm test --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Save failed-only CI state
        if: failure()
        uses: ./.github/actions/failed-only-save
        with:
          key: vitest-integration-${{ matrix.shard }}

  e2e:
    needs: changes
    if: needs.changes.outputs.e2e-tier == 'full' && needs.changes.outputs.has-code != 'false' && needs.changes.outputs.reused-sha != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Restore failed-only CI state
        uses: ./.github/actions/failed-only-restore
        with:
          key: e2e-${{ matrix.shard }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium
        uses: ./.github/actions/playwright-chromium

      # #765: pnpm forwards `--` to the script, so `e2e -- --shard=...` makes Playwright ignore sharding.
      # Flags after the script name are forwarded without the extra positional `--`.
      - name: "E2E (shard ${{ matrix.shard }}/6, #693)"
        run: pnpm prepush --e2e-shard ${{ matrix.shard }}/6

      - name: CSS mechanism gate (#747)
        run: node scripts/css-mechanism-gate.mjs

      - name: Save failed-only CI state
        if: failure()
        uses: ./.github/actions/failed-only-save
        with:
          key: e2e-${{ matrix.shard }}

      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-playwright-evidence-shard-${{ matrix.shard }}
          path: apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore

  e2e-affected:
    needs: changes
    if: needs.changes.outputs.e2e-tier == 'affected' && needs.changes.outputs.has-code != 'false' && needs.changes.outputs.reused-sha != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Restore failed-only CI state
        uses: ./.github/actions/failed-only-restore
        with:
          key: e2e-affected-${{ matrix.shard }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium
        uses: ./.github/actions/playwright-chromium

      - name: E2E (specs affected by this PR, split by recorded spec times)
        env:
          PREPUSH_BASE_SHA: ${{ needs.changes.outputs.base-sha || github.event.pull_request.base.sha || github.event.before }}
        run: pnpm --filter @cairn/web e2e:affected --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Fixture build for the CSS mechanism gate
        if: ${{ !cancelled() && matrix.shard == 1 }}
        working-directory: apps/web
        run: pnpm exec vite build --mode fixture

      - name: CSS mechanism gate (#747)
        if: ${{ !cancelled() && matrix.shard == 1 }}
        run: node scripts/css-mechanism-gate.mjs

      - name: Save failed-only CI state
        if: ${{ !cancelled() && failure() }}
        uses: ./.github/actions/failed-only-save
        with:
          key: e2e-affected-${{ matrix.shard }}

      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-affected-playwright-evidence-shard-${{ matrix.shard }}
          path: apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore

  e2e-gate:
    needs: [changes, e2e, e2e-affected]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate the e2e tier
        run: |
          [ "${{ needs.changes.result }}" = "success" ]
          if [ "${{ needs.changes.outputs.reused-sha }}" = "true" ]; then
            if [ "$GITHUB_REF" = "refs/heads/main" ] || [ "${GITHUB_REF#refs/heads/queue/try/}" != "$GITHUB_REF" ]; then
              exit 0
            fi
          fi
          case "${{ needs.changes.outputs.e2e-tier }}" in
            full) ran="${{ needs.e2e.result }}" idle="${{ needs.e2e-affected.result }}" ;;
            affected) ran="${{ needs.e2e-affected.result }}" idle="${{ needs.e2e.result }}" ;;
            none)
              [ "${{ needs.e2e.result }}" = "skipped" ]
              [ "${{ needs.e2e-affected.result }}" = "skipped" ]
              exit 0
              ;;
            *) exit 1 ;;
          esac
          [ "$idle" = "skipped" ]
          [ "$ran" = "success" ] || { [ "${{ needs.changes.outputs.has-code }}" = "false" ] && [ "$ran" = "skipped" ]; }

  tsnet-sidecar:
    needs: changes
    if: needs.changes.outputs.has-sidecar != 'false'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/tsnet-sidecar
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/tsnet-sidecar/go.mod
          cache-dependency-path: apps/tsnet-sidecar/go.sum

      - name: Restore failed-only CI state
        uses: ./.github/actions/failed-only-restore
        with:
          key: tsnet-sidecar

      - name: Verify module files are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Format
        run: node ../../scripts/ops/ci-failed-only.mjs step --key gofmt -- test -z "$(gofmt -l .)"

      - name: Test
        run: node ../../scripts/ops/ci-failed-only.mjs go-test --key go-test -- go test ./...

      - name: Vet
        run: node ../../scripts/ops/ci-failed-only.mjs step --key govet -- go vet ./...

      - name: Save failed-only CI state
        if: failure()
        uses: ./.github/actions/failed-only-save
        with:
          key: tsnet-sidecar

      - name: Build all targets
        run: |
          mkdir -p "$RUNNER_TEMP/tsnet-sidecar-bins"
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            out="$RUNNER_TEMP/tsnet-sidecar-bins/tsnet-sidecar-${goos}-${goarch}"
            [ "$goos" = windows ] && out="$out.exe"
            GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags '-s -w' -o "$out" .
            size=$(stat -c %s "$out")
            echo "tsnet-sidecar ${goos}/${goarch}: ${size} bytes"
            [ "$size" -le 41943040 ] || { echo "::error::binary exceeds 40 MiB"; exit 1; }
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tsnet-sidecar-binaries
          path: ${{ runner.temp }}/tsnet-sidecar-bins
          retention-days: 7
          if-no-files-found: error

  pack-smoke:
    needs: changes
    if: needs.changes.outputs.has-code != 'false' && needs.changes.outputs.reused-sha != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pack smoke (main package tarball, bare node)
        run: scripts/pack-smoke.sh

  gates:
    timeout-minutes: 10
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.gates-needed != 'false' && needs.changes.outputs.reused-sha != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Restore failed-only CI state
        uses: ./.github/actions/failed-only-restore
        with:
          key: gates

      - name: Migration additions stay ahead of current main (#3692)
        if: ${{ !cancelled() }}
        run: |
          bash scripts/ci-retry.sh git fetch origin +refs/heads/main:refs/remotes/origin/main
          node scripts/ops/ci-failed-only.mjs node-test --key gates-migration-test -- node --test scripts/migration-main-gate.test.mjs
          node scripts/ops/ci-failed-only.mjs step --key gates-migration-check -- node scripts/migration-main-gate.mjs

      - name: "Comment discipline gate (advisory, #1520)"
        timeout-minutes: 2
        continue-on-error: true
        if: ${{ !cancelled() }}
        env:
          COMMENT_DISCIPLINE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch origin "${COMMENT_DISCIPLINE_BASE_SHA:-main}"
          node scripts/ops/ci-failed-only.mjs node-test --key gates-comment-test -- node --test scripts/comment-discipline-gate.test.mjs
          node scripts/ops/ci-failed-only.mjs step --key gates-comment-check -- node scripts/comment-discipline-gate.mjs

      - name: "Probe reach gate (advisory, #1542)"
        timeout-minutes: 2
        continue-on-error: true
        if: ${{ !cancelled() }}
        env:
          VP_REACH_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch origin "${VP_REACH_BASE_SHA:-main}"
          node scripts/ops/ci-failed-only.mjs node-test --key gates-probe-test -- node --test scripts/probe-reach.test.mjs
          node scripts/ops/ci-failed-only.mjs step --key gates-probe-check -- node .claude/skills/verify-cairn/scripts/vp-registry-gate.mjs --check-reach

      - name: Dispatch agent start/check round trip (#1556)
        if: ${{ !cancelled() && needs.changes.outputs.ops-selftests == 'true' }}
        run: node scripts/ops/ci-failed-only.mjs node-test --key gates-dispatch -- node --test scripts/dispatch-agent.test.mjs scripts/dispatch-dedupe.test.mjs

      - name: Workflow concurrency, scalars and queue promotion
        if: ${{ !cancelled() && needs.changes.outputs.ops-selftests == 'true' }}
        run: node scripts/ops/ci-failed-only.mjs node-test --key gates-workflows -- node --test scripts/workflow-concurrency.test.mjs scripts/workflow-scalars.test.mjs scripts/ops/speculative-queue.test.mjs scripts/ops/promote-queue.test.mjs scripts/ops/push-queue.test.mjs scripts/ops/ci-reuse-verified.test.mjs scripts/ops/ci-failed-only.test.mjs scripts/ops/ci-capacity-gate.test.mjs scripts/ops/merge-queue-invariants.test.mjs scripts/ops/release-gate.test.mjs scripts/ops/release-plan.test.mjs scripts/desktop-release.test.mjs

      - name: Commit identity allowlist and hooks (#2289)
        if: ${{ !cancelled() && needs.changes.outputs.ops-selftests == 'true' }}
        run: node scripts/ops/ci-failed-only.mjs node-test --key gates-identity -- node --test scripts/commit-identity.test.mjs

      - name: UI debt ledger only shrinks against main
        if: ${{ !cancelled() && needs.changes.outputs.ops-selftests == 'true' }}
        run: node scripts/ops/ci-failed-only.mjs node-test --key gates-ui-debt -- node --test scripts/ui-debt-gate.test.mjs

      - name: Vitest shards split by recorded file times
        if: ${{ !cancelled() && needs.changes.outputs.ops-selftests == 'true' }}
        run: node scripts/ops/ci-failed-only.mjs node-test --key gates-vitest-shard -- node --test scripts/vitest-timed-shard.test.mjs

      - name: E2E selection and timed shards
        if: ${{ !cancelled() && needs.changes.outputs.ops-selftests == 'true' }}
        run: node scripts/ops/ci-failed-only.mjs node-test --key gates-e2e-affected -- node --test scripts/e2e-affected.test.mjs

      - name: Packaged journey and visual baseline gates stay red on the real misses
        if: ${{ !cancelled() && needs.changes.outputs.ops-selftests == 'true' }}
        run: node scripts/ops/ci-failed-only.mjs node-test --key gates-journey-visual -- node --test scripts/packaged-journey-gate.test.mjs scripts/visual-baseline-gate.test.mjs

      - name: Pages keep to tokens
        if: ${{ !cancelled() && needs.changes.outputs.ops-selftests == 'true' }}
        run: node scripts/ops/ci-failed-only.mjs node-test --key gates-page-style -- node --test scripts/ui-page-style-gate.test.mjs

      - name: Feature map covers every route and stays in step with the code
        if: ${{ !cancelled() }}
        env:
          FEATURE_REGISTRY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$FEATURE_REGISTRY_BASE_SHA" ]; then bash scripts/ci-retry.sh git fetch origin "$FEATURE_REGISTRY_BASE_SHA"; fi
          node scripts/ops/ci-failed-only.mjs step --key gates-feature-map -- node scripts/generate-feature-map.mjs --check

      - name: Canon digest stays in step with the marked ruling sentences
        if: ${{ !cancelled() }}
        run: node scripts/ops/ci-failed-only.mjs step --key gates-canon -- node scripts/generate-canon.mjs --check

      - name: Gardener sweep self-test (#1617)
        if: ${{ !cancelled() && needs.changes.outputs.ops-selftests == 'true' }}
        run: node scripts/ops/ci-failed-only.mjs node-test --key gates-gardener -- node --test scripts/gardener-weekly.test.mjs scripts/evidence-prune.test.mjs scripts/delivery-metrics.test.mjs scripts/issue-coverage.test.mjs scripts/feature-map-maintain.test.mjs scripts/generate-feature-map.test.mjs scripts/generate-canon.test.mjs scripts/ops/repo-hygiene.test.mjs

      - name: Nightly scan self-test (§11.1)
        if: ${{ !cancelled() && needs.changes.outputs.ops-selftests == 'true' }}
        run: node scripts/ops/ci-failed-only.mjs node-test --key gates-nightly -- node --test scripts/nightly-scan/nightly-scan.test.mjs

      - name: CI tier conditions
        if: ${{ !cancelled() && needs.changes.outputs.ops-selftests == 'true' }}
        run: node scripts/ops/ci-failed-only.mjs node-test --key gates-ci-tiers -- node --test scripts/ci-tiers.test.mjs

      - name: Real smoke runner and checker fixtures (#2283)
        if: ${{ !cancelled() && needs.changes.outputs.ops-selftests == 'true' }}
        run: node scripts/ops/ci-failed-only.mjs node-test --key gates-real-smoke -- node --test scripts/ops/real-smoke.test.mjs scripts/smoke/post-install.test.mjs

      - name: Host control script fixtures (#2380)
        if: ${{ !cancelled() && needs.changes.outputs.ops-selftests == 'true' }}
        run: node scripts/ops/ci-failed-only.mjs node-test --key gates-host -- node --test scripts/ops/host/brake.test.mjs scripts/ops/host/surface-stuck-rebase.test.mjs scripts/ops/host/lane-replaced.test.mjs scripts/ops/host/as-bot.test.mjs scripts/ops/host/dispatch-issue.test.mjs scripts/ops/host/main-watch.test.mjs scripts/ops/host/identity-compat.test.mjs

      - name: Test temp guard fixtures (#1954)
        if: ${{ !cancelled() && needs.changes.outputs.ops-selftests == 'true' }}
        run: node scripts/ops/ci-failed-only.mjs node-test --key gates-temp-guard -- node --test scripts/ops/host/test-temp-guard.test.mjs

      - name: Runner secret isolation fixtures (#2189)
        if: ${{ !cancelled() && needs.changes.outputs.ops-selftests == 'true' }}
        run: node scripts/ops/ci-failed-only.mjs node-test --key gates-secret-reach -- node --test scripts/ops/secret-reach/canary.test.mjs scripts/ops/secret-reach/broker.test.mjs scripts/ops/secret-reach/setup-runner-user.test.mjs scripts/ops/secret-reach/batch-sandbox.test.mjs

      - name: Scoped root runner for ops scripts (#2362)
        if: ${{ !cancelled() && needs.changes.outputs.ops-selftests == 'true' }}
        run: node scripts/ops/ci-failed-only.mjs node-test --key gates-cairn-ops -- node --test scripts/ops/cairn-ops/run.test.mjs scripts/ops/cairn-ops/install.test.mjs

      - name: Langfuse code evaluator isolation
        if: ${{ !cancelled() && needs.changes.outputs.ops-selftests == 'true' }}
        run: node scripts/ops/ci-failed-only.mjs node-test --key gates-langfuse -- node --test scripts/ops/langfuse-code-eval.test.mjs

      - name: Server backup script against an rrsync receiver (#2163)
        if: ${{ !cancelled() && needs.changes.outputs.ops-selftests == 'true' }}
        run: |
          command -v sqlite3 >/dev/null || { bash scripts/ci-retry.sh sudo apt-get update -q && bash scripts/ci-retry.sh sudo apt-get install -y -q sqlite3; }
          bash scripts/ci-retry.sh curl -fsSL --connect-timeout 15 --max-time 60 -o "$RUNNER_TEMP/rrsync" https://raw.githubusercontent.com/RsyncProject/rsync/v3.4.1/support/rrsync
          echo "0bb743f8155907ed2a337c12a4672c67269e372803939ec98dac497edc714c9b  $RUNNER_TEMP/rrsync" | sha256sum -c -
          RRSYNC="$RUNNER_TEMP/rrsync" node scripts/ops/ci-failed-only.mjs node-test --key gates-server-backup -- node --test scripts/ops/backup-server-db.test.mjs scripts/ops/push-test.test.mjs scripts/ops/push-worker.test.mjs

      - name: Self-deploy and deploy-lag watch fixtures (#2288)
        if: ${{ !cancelled() && needs.changes.outputs.ops-selftests == 'true' }}
        run: node scripts/ops/ci-failed-only.mjs node-test --key gates-self-deploy -- node --test scripts/ops/deploy-self.test.mjs scripts/ops/control-plane-units.test.mjs

      - name: Save failed-only CI state
        if: ${{ !cancelled() && failure() }}
        uses: ./.github/actions/failed-only-save
        with:
          key: gates

  eval:
    needs: [changes, check-core]
    if: >-
      needs.changes.outputs.eval-needed == 'true' &&
      vars.EVAL_ENABLED == 'true' &&
      (startsWith(github.ref, 'refs/heads/queue/') || startsWith(github.ref, 'refs/heads/preflight/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    environment: eval
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: cand
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: base
          ref: ${{ needs.changes.outputs.base-sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: cand/package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install both checkouts
        run: |
          (cd base && pnpm install --frozen-lockfile --ignore-scripts)
          (cd cand && pnpm install --frozen-lockfile --ignore-scripts)
      - name: Install devin CLI (manifest-pinned, sha256-verified)
        working-directory: cand
        run: |
          node eval/install-devin.mjs "$RUNNER_TEMP/devin-cli"
          echo "$RUNNER_TEMP/devin-cli/bin" >> "$GITHUB_PATH"
      - name: Restore Devin CLI credentials
        env:
          DEVIN_CREDENTIALS_TOML: ${{ secrets.DEVIN_CREDENTIALS_TOML }}
        run: |
          if [ -n "$DEVIN_CREDENTIALS_TOML" ]; then
            mkdir -p ~/.local/share/devin
            printf '%s' "$DEVIN_CREDENTIALS_TOML" > ~/.local/share/devin/credentials.toml
            chmod 600 ~/.local/share/devin/credentials.toml
          fi
      - name: Exam source selection (base checkout wins when it has eval/)
        id: exam
        run: |
          if [ -d "$GITHUB_WORKSPACE/base/eval" ]; then echo "dir=$GITHUB_WORKSPACE/base/eval" >> "$GITHUB_OUTPUT"; else echo "dir=$GITHUB_WORKSPACE/cand/eval" >> "$GITHUB_OUTPUT"; fi
      - name: Baseline arm requires the suite on the merge base
        env:
          BASE_SHA: ${{ needs.changes.outputs.base-sha }}
        run: |
          test -n "$BASE_SHA" || {
            echo "eval: no merge base against origin/main, so there is no commit to compare against" >&2
            exit 1
          }
          git -C "$GITHUB_WORKSPACE/base" merge-base --is-ancestor "$BASE_SHA" origin/main || {
            echo "eval: base-sha $BASE_SHA is not an ancestor of origin/main" >&2
            exit 1
          }
          test -f "$GITHUB_WORKSPACE/base/eval/run.ts" || {
            echo "eval: the merge-base checkout has no eval/ suite, so there is no baseline arm to compare against; land the suite on main before setting EVAL_ENABLED" >&2
            exit 1
          }
      - name: Run baseline arm
        id: base-run
        working-directory: base
        env:
          EVAL_MAX_DEVIN_RUNS: ${{ vars.EVAL_MAX_DEVIN_RUNS }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_BASE_URL: ${{ vars.LANGFUSE_BASE_URL }}
        run: node --import tsx eval/run.ts --arm base --exam "${{ steps.exam.outputs.dir }}" --out "$RUNNER_TEMP/base.json" --require-langfuse
      - name: Run candidate arm
        id: cand-run
        working-directory: cand
        env:
          EVAL_MAX_DEVIN_RUNS: ${{ vars.EVAL_MAX_DEVIN_RUNS }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_BASE_URL: ${{ vars.LANGFUSE_BASE_URL }}
        run: node --import tsx eval/run.ts --arm candidate --exam "${{ steps.exam.outputs.dir }}" --out "$RUNNER_TEMP/cand.json" --require-langfuse
      - name: Compare arms
        id: verdict
        working-directory: base
        run: |
          set +e
          node --import tsx eval/compare.ts "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/cand.json" "${{ needs.changes.outputs.base-sha }}" "${{ github.sha }}" | tee "$RUNNER_TEMP/eval-report.md"
          echo "verdict-exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          set -e
      - name: Comment score diff on the candidate commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -f body="$(cat "$RUNNER_TEMP/eval-report.md")" || true
      - name: Gate on the verdict
        run: test "${{ steps.verdict.outputs.verdict-exit }}" = "0"
