name: ci

# push only on main and prototype/** (#500). `web/**` used to be listed, so each lane branch
# push fired two workflow runs (push + pull_request) on the same head sha. In the last 30 runs,
# all five `web/**` branches double-ran 1:1 and conclusions diverged — e.g. web/sidebar-head-polish
# push run red, pull_request run green (m5 flake), pinning commit status UNSTABLE and misleading blame.
#
# No concurrency dedupe by sha: push github.sha and pull_request head sha are identical, so both
# land in one group and cancel-in-progress drops whichever registered second — survivor is
# nondeterministic; if the push run survives, the PR shows only cancelled runs and merge gating
# gets worse. Narrowing the trigger surface is the deterministic fix.
#
# Keep prototype/**: those two branches (42-pixel-replica / shadcn-visual-tokens) never open PRs;
# push runs are their only CI. web/** lanes always open PRs, covered by unconditional pull_request
# (lane/** docs/** were never listed — same rule). Side effect: web/** has no CI between push and
# PR — open a draft PR early; pull_request fires for drafts too.
#
# Third-party actions pinned to full commit SHA + trailing version (#1076): floating tags can be
# retargeted upstream; trailing version is Dependabot's anchor — do not delete.
on:
  push:
    branches: [main, 'prototype/**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      # reads packageManager from package.json
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      # Conflict marker gate (2026-10-08): merge conflict markers landed on main once
      # (nested `<<<<<<<` in `.claude/skills/verify-cairn/SKILL.md` — resolver only handled
      # the outermost layer). Breakage does not fail build and is easy to miss — machine catch.
      # Only `<<<<<<< ` / `>>>>>>> ` with ref names at line start + space; not bare `=======`
      # (markdown setext headings). Zero deps, before install: red within a minute.
      - name: Conflict markers
        run: |
          if git grep -nE '^(<<<<<<< |>>>>>>> )' -- . ; then
            echo "::error::committed conflict markers — resolve the merge, do not commit the markers"
            exit 1
          fi

      # Lane file gate (#1199): herdr lane threads draft PROGRESS.md /
      # BLOCKED.md at the worktree root and the files keep riding PR
      # branches into main (#1189 merged BLOCKED.md in; #1153's PROGRESS.md
      # was caught in review). Zero-dependency, pre-install, one-minute red
      # for the offending lane. Takes the PR base sha the same way the
      # #851 ui-debt-gate takes UI_DEBT_BASE_SHA: the added-only diff leg
      # runs on pull_request; push runs self-check the tracked set.
      - name: Lane file gate (#1199)
        env:
          LANE_FILE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$LANE_FILE_BASE_SHA" ]; then
            git fetch origin "$LANE_FILE_BASE_SHA"
          fi
          node scripts/lane-file-gate.mjs

      # Test spawn gate: corepack's pnpm/npx shim swallows SIGTERM, so a test
      # that spawns through it leaves the real process tree under PID 1.
      # Zero-dependency, pre-install.
      - name: Test spawn gate
        run: node scripts/test-spawn-gate.mjs

      # pr-evidence is a required status check on main and carries the
      # needs-decision guard (2026-10-21, after #1435); this pins the shape
      # that keeps it load-bearing (no job-level if/name, no paths filter,
      # label and auto-merge triggers present). Zero-dependency, pre-install.
      - name: PR evidence workflow shape gate
        run: node scripts/pr-evidence-workflow-gate.mjs

      - name: CI job structure gate (#1557)
        run: |
          node --test scripts/ci-job-structure-gate.test.mjs
          node scripts/ci-job-structure-gate.mjs

      # components/ui registry gate (#989, map #980): allowlist + content-hash ledger +
      # pristine files vs vendored upstream snapshot + state ratchet (S5 vs base manifest,
      # reuses fetched base sha). Hand-written primitives in components/ui fail; registered
      # file overwritten without ledger refresh in the same PR fails. Zero network/deps
      # (shadcn CLI only in scripts/ui-registry-refresh.mjs; live diff rejected in #985),
      # before install.
      - name: UI registry gate (#989)
        env:
          UI_REGISTRY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ui-registry-gate.mjs

      # UI consumer square-box gate (#1054, ADR 0012 D1): registry gate stops at components/ui;
      # visible square-box geometry at consumers had no gate — this gate requires each visible
      # box line to cite registry basis / component default / deviation registered in
      # scripts/ui-consumer-registry.json; ledger diff is the review surface. Zero deps, before install.
      - name: UI consumer shape gate (#1054)
        run: node scripts/ui-consumer-shape-gate.mjs

      # After e2e moved to sharded jobs (#693), ffmpeg followed; chromium stays here —
      # integration vitest's four e2e suites (m5-web-e2e etc.) launch real Chromium in-job
      # (2026-10-03: removing it fails browserType.launch executable doesn't exist).
      # "check no longer needs a browser" was wrong — two browser layers exist.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepush checks (#1533)
        env:
          PREPUSH_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          UI_DEBT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pnpm prepush --ci

      - name: PR evidence regression tests
        run: python3 scripts/pr-evidence-gate.test.py

      - name: Prepush self-test
        run: node --test scripts/prepush.test.mjs scripts/heavy-slots.test.mjs scripts/english-only-gate.test.mjs scripts/doc-reader-tests.test.mjs scripts/lessons-ledger-gate.test.mjs

      # verify-cairn CLI self-test (#1402): vp.mjs dispatch, evidence, capture, links, archive rules.
      # Most drives use --dry-run; live ones use stub probes in a copied skill tree; archive/links
      # run in an empty temp root without starting the stack. capture hits a closed port — records
      # navigation failure with a browser, startup failure without (chromium not installed yet);
      # both write result.json. One leg runs vp-registry-gate.mjs: unlisted scripts/, new drive-<ticket>
      # scripts, feature map missing vp.mjs drive rows.
      - name: verify-cairn CLI self-test (#1402)
        run: node .claude/skills/verify-cairn/scripts/vp-selftest.mjs

      - name: Install Playwright chromium
        run: pnpm exec playwright install chromium --with-deps

      # Migration discipline (01 §6): drizzle-kit generate, commit, CI drift check —
      # schema change without regenerated migration fails.
      # Guard: broken snapshot chain prints only, exit 0, generates nothing — git diff below stays
      # empty and the gate silently passes. db:check enforces chain invariants as a hard fail.
      - name: Drizzle snapshot chain guard
        run: pnpm --filter @xiechimon/cairn db:check

      - name: Drizzle migration drift check
        run: |
          pnpm --filter @xiechimon/cairn db:generate
          git add -N apps/server/drizzle
          git diff --exit-code apps/server/drizzle

      # Integration stack runs alone (2026-09-30): real server + daemon + Chromium in-process;
      # with light projects on a 2 vCPU runner it false-reds — same sha twice same fail, docs-only
      # red, local same test 10.9s pass. Project split in root vitest.config.ts (light +
      # integration = full set, no leak).
      - name: Test (vitest, light project)
        run: VITEST_PROJECT_SET=light pnpm test

      - name: Test (vitest, integration stack)
        run: VITEST_PROJECT_SET=integration pnpm test

      # pr-gate self-check (#1401): .claude/workflows/pr-gate.js decides ADR
      # 0021 D4 routing and go / no-go in plain code; this runs that code with
      # stub agents. Pure node, no install needed.
      - name: pr-gate self-check (#1401)
        run: node scripts/pr-gate-selfcheck.mjs

      # Lint warning cap ratchet (#1192): biome ci surfaces warnings in its
      # summary but only exits non-zero on errors, so the warning count grows
      # silently with each new code drop (#1180 alone shipped 7). This gate
      # parses the "Found N warnings" summary line and compares to a frozen
      # cap; over the cap is red, and the in-tree baseline cannot sit higher
      # than the base's baseline (so a PR can't lift its own ceiling — same
      # D3 mechanism as ui-debt-gate.mjs). Cap is pinned in
      # scripts/lint-warning-baseline.json and may only move down; re-freeze
      # with `node scripts/lint-warning-cap.mjs --write` after clearing debt
      # in a PR. Needs npx + node_modules for biome itself.
      - name: Lint warning cap gate (#1192)
        env:
          LINT_WARNING_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$LINT_WARNING_BASE_SHA" ]; then
            git fetch origin "$LINT_WARNING_BASE_SHA"
          fi
          node scripts/lint-warning-cap.mjs


  # Full e2e only in CI (#693): local dev uses e2e:affected; this is the sole full run.
  # Four parallel shards (playwright --shard; union = full 83 specs, coverage unchanged):
  # ~2 min/shard vs 223s serial e2e in old check job. Separate jobs/runners avoid
  # check job clobbering apps/web/dist. fail-fast off so one red shard does not hide others.
  e2e:
    runs-on: ubuntu-latest
    # Shards normally 5–10 minutes; job timeout stops install hangs from blocking merges forever
    # (whole-job backstop, not a per-test cap).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # reads packageManager from root package.json
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      # No apt ffmpeg (2026-10-22): no e2e spec/script calls system ffmpeg (grep zero hits);
      # only local verify-cairn drivers use it; playwright install chromium bundles ffmpeg.
      # apt-get install was the slowdown — run 39808252360 e2e (3) stuck 42m on apt, tests 2–3m.
      # Removing apt-get update (2026-10-07) fixed half the same issue.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium
        run: pnpm exec playwright install chromium --with-deps

      # `--` placement matters (#765): pnpm forwards `--` to the script, so `e2e -- --shard=…`
      # made playwright see `--` as a positional arg and ignore --shard — four shards each ran
      # all 688 cases. Without `--`, pnpm forwards flags after the script name; union = full set.
      - name: E2E (shard ${{ matrix.shard }}/4, #693)
        run: pnpm prepush --e2e-shard ${{ matrix.shard }}/4

      # CSS mechanism gate (#747): E2E step already wrote apps/web/dist via webServer fixture-build;
      # this step grep-asserts only. Catches #656/#677: tw-animate-css installed, classes present,
      # but no @import — animations compile empty.
      - name: CSS mechanism gate (#747)
        run: node scripts/css-mechanism-gate.mjs

  # Shard aggregate gate (#693): branch protection required contexts do not encode matrix size —
  # hard-coding e2e (1..4) silently mismatches when shard count changes. Fixed job e2e-gate
  # needs all shards; protection lists only this job.
  #
  # `if: always()` and explicit result check are required (#762): with only `needs`, a failed shard
  # skips this job entirely, and branch protection treats `skipped` like success. always() always
  # reports; fail unless needs.e2e.result is success (fail-closed). Future paths-filter skip on e2e
  # fails loudly here instead of silently dropping coverage.
  e2e-gate:
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate e2e shards
        run: |
          echo "e2e result: ${{ needs.e2e.result }}"
          [ "${{ needs.e2e.result }}" = "success" ]

  # Pack smoke (#264, spec #260 failure-mode CI guard): separate job/runner from e2e shards
  # (each writes its own dist).
  pack-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # reads packageManager from root package.json
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pack smoke (main package tarball, bare node)
        run: scripts/pack-smoke.sh

  # Dead class gate (#1036, advisory): TSX class names minus live stylesheets (Tailwind output +
  # src/**/*.css selectors); zero hits and zero spec/verify refs fails — #950 chief.css retirement
  # left dead classes that silently break layout. Intentionally not a required context: visible red,
  # does not block merge until user tightens. Needs node_modules (@tailwindcss/postcss ~0.5s compile).
  dead-class-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      # reads packageManager from root package.json
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dead class gate (#1036)
        env:
          PREPUSH_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm prepush --advisory

  # Issue label gate (advisory): each open issue needs one category + one status label
  # (bug|enhancement + needs-triage|needs-info|ready-for-agent|ready-for-human|wontfix).
  # Agent discipline missed (#1056/#1067); machine enforced. wayfinder:* lanes excluded.
  # Not a required context (same as dead-class-gate). gh api only, no node_modules.
  issue-label-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Issue label gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/issue-label-gate.mjs

  # Feature map staleness gate (#1160, advisory): verify-cairn feature map paths / .class /
  # [data-*] / CSS declarations must resolve in the tree. Stale avatars.md hid #1156.
  # Baseline frozen in scripts/feature-map-staleness-baseline.json — new stale only;
  # baseline entry going green fails until removed. Advisory, not required context.
  # Node stdlib only, read-only repo files.
  feature-map-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Feature map staleness gate (#1160)
        run: node scripts/feature-map-staleness-gate.mjs

  comment-discipline-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Comment discipline gate (advisory, #1520)
        env:
          COMMENT_DISCIPLINE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=1 origin "${COMMENT_DISCIPLINE_BASE_SHA:-main}"
          node --test scripts/comment-discipline-gate.test.mjs
          node scripts/comment-discipline-gate.mjs

  probe-reach-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Probe reach gate (advisory, #1542)
        env:
          VP_REACH_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=1 origin "${VP_REACH_BASE_SHA:-main}"
          node --test docs/verify/1542/reach.test.mjs
          node .claude/skills/verify-cairn/scripts/vp-registry-gate.mjs --check-reach

  single-use-helper-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Single-use helper gate (advisory, #1543)
        env:
          SINGLE_USE_HELPER_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=1 origin "${SINGLE_USE_HELPER_BASE_SHA:-main}"
          node --test scripts/single-use-helper-gate.test.mjs
          node scripts/single-use-helper-gate.mjs

  npm-command-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Package names in install commands exist on npm
        run: |
          node --test scripts/npm-command-gate.test.mjs
          node scripts/npm-command-gate.mjs

  dispatch-agent-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Dispatch agent start/check round trip (#1556)
        run: node --test scripts/dispatch-agent.test.mjs scripts/dispatch-dedupe.test.mjs

  closing-keyword-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Closing keyword gate (advisory, #1541)
        run: |
          node --test scripts/check-closing-keyword.test.mjs
          node scripts/check-closing-keyword.mjs

  baseline-ratchet-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Baseline ratchet gate and gardener sweep self-test (#1617)
        env:
          BASELINE_RATCHET_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=1 origin "$BASELINE_RATCHET_BASE_SHA"
          node --test scripts/baseline-ratchet-gate.test.mjs scripts/gardener-weekly.test.mjs scripts/evidence-prune.test.mjs
          node scripts/baseline-ratchet-gate.mjs
