name: ci

# Third-party actions are pinned to full commit SHAs (#1076); the trailing version is Dependabot's anchor.
on:
  push:
    branches: [main, 'prototype/**']
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      has-code: ${{ steps.classify.outputs.has-code }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Classify changes
        id: classify
        env:
          PREPUSH_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          has_code=true
          if [ "$EVENT_NAME" = "pull_request" ]; then
            has_code=$(node scripts/prepush.mjs --has-code) || has_code=true
          fi
          echo "has-code=$has_code" >> "$GITHUB_OUTPUT"

  # #762: branch protection treats skipped jobs as success; always() ensures aggregates report failures.
  check:
    needs: [changes, check-core, vitest-light, vitest-integration]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate check parts
        run: |
          [ "${{ needs.changes.result }}" = "success" ]
          for result in "${{ needs.check-core.result }}" "${{ needs.vitest-light.result }}" "${{ needs.vitest-integration.result }}"; do
            if [ "$result" = "success" ]; then
              continue
            fi
            [ "${{ needs.changes.outputs.has-code }}" = "false" ] && [ "$result" = "skipped" ] || exit 1
          done

  check-core:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Conflict markers
        run: |
          if git grep -nE '^(<<<<<<< |>>>>>>> )' -- . ; then
            echo "::error::committed conflict markers — resolve the merge, do not commit the markers"
            exit 1
          fi

      - name: UI registry gate (#989)
        env:
          UI_REGISTRY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ui-registry-gate.mjs

      - name: UI consumer shape gate (#1054)
        run: node scripts/ui-consumer-shape-gate.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepush checks (#1533)
        env:
          PREPUSH_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          ENGLISH_ONLY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PREPUSH_FORCE_FULL: ${{ github.event_name == 'push' }}
          UI_DEBT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pnpm prepush --ci

      - name: PR evidence regression tests
        run: python3 scripts/pr-evidence-gate.test.py

      - name: Prepush self-test
        run: pnpm prepush --self-test

      - name: verify-cairn CLI self-test (#1402)
        if: github.event_name != 'pull_request' || needs.changes.outputs.has-code != 'false'
        run: node .claude/skills/verify-cairn/scripts/vp-selftest.mjs

      - name: Drizzle snapshot chain guard
        if: github.event_name != 'pull_request' || needs.changes.outputs.has-code != 'false'
        run: pnpm --filter @xiechimon/cairn db:check

      - name: Drizzle migration drift check
        if: github.event_name != 'pull_request' || needs.changes.outputs.has-code != 'false'
        run: |
          pnpm --filter @xiechimon/cairn db:generate
          git add -N apps/server/drizzle
          git diff --exit-code apps/server/drizzle

      - name: Lint warning cap gate (#1192)
        if: github.event_name != 'pull_request' || needs.changes.outputs.has-code != 'false'
        env:
          LINT_WARNING_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$LINT_WARNING_BASE_SHA" ]; then
            git fetch origin "$LINT_WARNING_BASE_SHA"
          fi
          node scripts/lint-warning-cap.mjs

  vitest-light:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.has-code != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test (vitest, light project)
        run: VITEST_PROJECT_SET=light pnpm test

  vitest-integration:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.has-code != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The integration vitest suites launch real Chromium; a missing executable fails browserType.launch.
      - name: Install Playwright chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Test (vitest, integration stack)
        run: VITEST_PROJECT_SET=integration pnpm test

  e2e:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.has-code != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium
        run: pnpm exec playwright install chromium --with-deps

      # #765: pnpm forwards `--` to the script, so `e2e -- --shard=...` makes Playwright ignore sharding.
      # Flags after the script name are forwarded without the extra positional `--`.
      - name: E2E (shard ${{ matrix.shard }}/4, #693)
        run: pnpm prepush --e2e-shard ${{ matrix.shard }}/4

      - name: CSS mechanism gate (#747)
        run: node scripts/css-mechanism-gate.mjs

  e2e-gate:
    needs: [changes, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate e2e shards
        run: |
          [ "${{ needs.changes.result }}" = "success" ]
          for result in "${{ needs.e2e.result }}"; do
            if [ "$result" = "success" ]; then
              continue
            fi
            [ "${{ needs.changes.outputs.has-code }}" = "false" ] && [ "$result" = "skipped" ] || exit 1
          done

  pack-smoke:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.has-code != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pack smoke (main package tarball, bare node)
        run: scripts/pack-smoke.sh

  dead-class-gate:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.has-code != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dead class gate (#1036)
        env:
          PREPUSH_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm prepush --advisory

  gates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Comment discipline gate (advisory, #1520)
        continue-on-error: true
        if: ${{ !cancelled() }}
        env:
          COMMENT_DISCIPLINE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch origin "${COMMENT_DISCIPLINE_BASE_SHA:-main}"
          node --test scripts/comment-discipline-gate.test.mjs
          node scripts/comment-discipline-gate.mjs

      - name: Probe reach gate (advisory, #1542)
        if: ${{ !cancelled() }}
        env:
          VP_REACH_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch origin "${VP_REACH_BASE_SHA:-main}"
          node --test docs/verify/1542/reach.test.mjs
          node .claude/skills/verify-cairn/scripts/vp-registry-gate.mjs --check-reach

      - name: Dispatch agent start/check round trip (#1556)
        if: ${{ !cancelled() }}
        run: node --test scripts/dispatch-agent.test.mjs scripts/dispatch-dedupe.test.mjs scripts/lane-model-policy.test.mjs

      - name: Gardener sweep self-test (#1617)
        if: ${{ !cancelled() }}
        run: node --test scripts/gardener-weekly.test.mjs scripts/doc-drift.test.mjs scripts/evidence-prune.test.mjs scripts/delivery-metrics.test.mjs

  ops-backup-test:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.has-code != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Server backup script against an rrsync receiver (#2163)
        run: |
          command -v sqlite3 >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q sqlite3; }
          curl -fsSL -o "$RUNNER_TEMP/rrsync" https://raw.githubusercontent.com/RsyncProject/rsync/v3.4.1/support/rrsync
          echo "0bb743f8155907ed2a337c12a4672c67269e372803939ec98dac497edc714c9b  $RUNNER_TEMP/rrsync" | sha256sum -c -
          RRSYNC="$RUNNER_TEMP/rrsync" node --test scripts/ops/backup-server-db.test.mjs
