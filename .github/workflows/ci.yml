name: ci

# Third-party actions are pinned to full commit SHAs (#1076); the trailing version is Dependabot's anchor.
on:
  push:
    branches: [main, 'queue/**']
  pull_request:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && format('ci-push-{0}-{1}', github.ref, github.sha) || format('ci-ref-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      has-code: ${{ steps.classify.outputs.has-code }}
      has-sidecar: ${{ steps.classify.outputs.has-sidecar }}
      gates-needed: ${{ steps.classify.outputs.gates-needed }}
      ops-selftests: ${{ steps.classify.outputs.ops-selftests }}
      needs-integration: ${{ steps.classify.outputs.needs-integration }}
      base-sha: ${{ steps.classify.outputs.base-sha }}
      e2e-tier: ${{ (github.event_name == 'pull_request' && github.event.pull_request.draft) && 'none' || steps.classify.outputs.e2e-tier }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Classify changes
        id: classify
        env:
          PREPUSH_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          has_code=true
          has_sidecar=true
          gates_needed=true
          ops_selftests=true
          needs_integration=true
          e2e_tier=full
          base_ref=""
          case "$GITHUB_REF" in
            refs/heads/queue/*)
              base_ref=$(git merge-base origin/main HEAD 2>/dev/null || true)
              ;;
            *)
              if [ -n "${PREPUSH_BASE_SHA:-}" ] && ! printf '%s\n' "$PREPUSH_BASE_SHA" | grep -qE '^0+$' && git cat-file -e "${PREPUSH_BASE_SHA}^{commit}" 2>/dev/null; then
                base_ref=$(git merge-base "$PREPUSH_BASE_SHA" HEAD 2>/dev/null || printf '%s' "$PREPUSH_BASE_SHA")
              fi
              ;;
          esac
          if [ -n "$base_ref" ]; then
            changed=$(git diff --name-only "$base_ref" HEAD)
            if ! printf '%s\n' "$changed" | grep -qE '^(scripts/|\.github/|\.claude/skills/verify-cairn/scripts/|ops/langfuse/|packages/shared/|package\.json$|pnpm-lock\.yaml$)'; then
              ops_selftests=false
            fi
            if ! printf '%s\n' "$changed" | grep -qE '^(apps/server/|apps/daemon/|integration/|packages/shared/|scripts/|\.github/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$)'; then
              needs_integration=false
            fi
            has_code=$(PREPUSH_BASE_SHA="$base_ref" node scripts/prepush.mjs --has-code) || has_code=true
            has_sidecar=$(PREPUSH_BASE_SHA="$base_ref" node scripts/prepush.mjs --has-sidecar) || has_sidecar=true
            gates_needed=$(PREPUSH_BASE_SHA="$base_ref" node scripts/prepush.mjs --needs-gates) || gates_needed=true
            if [ "$has_code" = "false" ]; then
              e2e_tier=none
            elif printf '%s\n' "$changed" | grep -qE '^(apps/web/(package\.json|index\.html|vite\.config|playwright\.config)|apps/web/src/(components/|styles/|main\.tsx$|App\.tsx$)|packages/shared/|package\.json$|pnpm-lock\.yaml$|\.github/actions/playwright-chromium/|\.github/workflows/ci\.yml$)'; then
              e2e_tier=full
            elif printf '%s\n' "$changed" | grep -vE '\.test\.tsx?$' | grep -qE '^(apps/web/src/|apps/web/e2e/|apps/server/(src/|drizzle/|package\.json$))'; then
              e2e_tier=affected
            else
              e2e_tier=none
            fi
          fi
          echo "has-code=$has_code" >> "$GITHUB_OUTPUT"
          echo "has-sidecar=$has_sidecar" >> "$GITHUB_OUTPUT"
          echo "gates-needed=$gates_needed" >> "$GITHUB_OUTPUT"
          echo "ops-selftests=$ops_selftests" >> "$GITHUB_OUTPUT"
          echo "needs-integration=$needs_integration" >> "$GITHUB_OUTPUT"
          echo "base-sha=$base_ref" >> "$GITHUB_OUTPUT"
          echo "e2e-tier=$e2e_tier" >> "$GITHUB_OUTPUT"

  # #762: branch protection treats skipped jobs as success; always() ensures aggregates report failures.
  check:
    needs: [changes, check-core, vitest-light, vitest-integration, tsnet-sidecar-test, tsnet-sidecar-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate check parts
        run: |
          [ "${{ needs.changes.result }}" = "success" ]
          for result in "${{ needs.check-core.result }}" "${{ needs.vitest-light.result }}"; do
            if [ "$result" = "success" ]; then
              continue
            fi
            [ "${{ needs.changes.outputs.has-code }}" = "false" ] && [ "$result" = "skipped" ] || exit 1
          done
          vi_result="${{ needs.vitest-integration.result }}"
          if [ "$vi_result" != "success" ]; then
            [ "$vi_result" = "skipped" ] &&
              { [ "${{ needs.changes.outputs.has-code }}" = "false" ] ||
                [ "${{ needs.changes.outputs.needs-integration }}" = "false" ]; } ||
              exit 1
          fi
          for result in "${{ needs.tsnet-sidecar-test.result }}" "${{ needs.tsnet-sidecar-build.result }}"; do
            if [ "$result" = "success" ]; then
              continue
            fi
            [ "${{ needs.changes.outputs.has-sidecar }}" = "false" ] && [ "$result" = "skipped" ] || exit 1
          done

  check-core:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Conflict markers
        run: |
          if git grep -nE '^(<<<<<<< |>>>>>>> )' -- . ; then
            echo "::error::committed conflict markers — resolve the merge, do not commit the markers"
            exit 1
          fi

      - name: UI registry gate (#989)
        env:
          UI_REGISTRY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ui-registry-gate.mjs

      - name: UI consumer shape gate (#1054)
        run: node scripts/ui-consumer-shape-gate.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepush checks (#1533)
        env:
          PREPUSH_BASE_SHA: ${{ needs.changes.outputs.base-sha || github.event.pull_request.base.sha || github.event.before }}
          ENGLISH_ONLY_BASE_SHA: ${{ needs.changes.outputs.base-sha || github.event.pull_request.base.sha || github.event.before }}
          UI_DEBT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pnpm prepush --ci

      - name: Orb canary scratch runner (#2277)
        if: needs.changes.outputs.ops-selftests == 'true'
        run: node --test scripts/ops/orb/canary-stack.test.mjs

      - name: Prepush self-test
        if: needs.changes.outputs.ops-selftests == 'true'
        run: pnpm prepush --self-test

      - name: verify-cairn CLI self-test (#1402)
        if: needs.changes.outputs.ops-selftests == 'true'
        run: node .claude/skills/verify-cairn/scripts/vp-selftest.mjs

      - name: Drizzle snapshot chain guard
        if: needs.changes.outputs.has-code != 'false'
        run: pnpm --filter @xiechimon/cairn db:check

      - name: Drizzle migration drift check
        if: needs.changes.outputs.has-code != 'false'
        run: |
          pnpm --filter @xiechimon/cairn db:generate
          git add -N apps/server/drizzle
          git diff --exit-code apps/server/drizzle

  vitest-light:
    needs: changes
    if: needs.changes.outputs.has-code != 'false'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test (vitest, light project)
        run: VITEST_PROJECT_SET=light node scripts/test-temp-run.mjs -- pnpm test --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  vitest-integration:
    needs: changes
    if: needs.changes.outputs.has-code != 'false' && needs.changes.outputs.needs-integration != 'false'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The integration vitest suites launch real Chromium; a missing executable fails browserType.launch.
      - name: Install Playwright chromium
        uses: ./.github/actions/playwright-chromium

      - name: Test (vitest, integration stack)
        run: VITEST_PROJECT_SET=integration node scripts/test-temp-run.mjs -- pnpm test --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  e2e:
    needs: changes
    if: needs.changes.outputs.e2e-tier == 'full' && needs.changes.outputs.has-code != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium
        uses: ./.github/actions/playwright-chromium

      # #765: pnpm forwards `--` to the script, so `e2e -- --shard=...` makes Playwright ignore sharding.
      # Flags after the script name are forwarded without the extra positional `--`.
      - name: "E2E (shard ${{ matrix.shard }}/4, #693)"
        run: pnpm prepush --e2e-shard ${{ matrix.shard }}/4

      - name: CSS mechanism gate (#747)
        run: node scripts/css-mechanism-gate.mjs

  e2e-affected:
    needs: changes
    if: needs.changes.outputs.e2e-tier == 'affected' && needs.changes.outputs.has-code != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium
        uses: ./.github/actions/playwright-chromium

      - name: E2E (specs affected by this PR, split by recorded spec times)
        env:
          PREPUSH_BASE_SHA: ${{ needs.changes.outputs.base-sha || github.event.pull_request.base.sha || github.event.before }}
        run: pnpm --filter @cairn/web e2e:affected --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Fixture build for the CSS mechanism gate
        if: ${{ !cancelled() && matrix.shard == 1 }}
        working-directory: apps/web
        run: pnpm exec vite build --mode fixture

      - name: CSS mechanism gate (#747)
        if: ${{ !cancelled() && matrix.shard == 1 }}
        run: node scripts/css-mechanism-gate.mjs

  e2e-gate:
    needs: [changes, e2e, e2e-affected]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate the e2e tier
        run: |
          [ "${{ needs.changes.result }}" = "success" ]
          case "${{ needs.changes.outputs.e2e-tier }}" in
            full) ran="${{ needs.e2e.result }}" idle="${{ needs.e2e-affected.result }}" ;;
            affected) ran="${{ needs.e2e-affected.result }}" idle="${{ needs.e2e.result }}" ;;
            none)
              [ "${{ needs.e2e.result }}" = "skipped" ]
              [ "${{ needs.e2e-affected.result }}" = "skipped" ]
              exit 0
              ;;
            *) exit 1 ;;
          esac
          [ "$idle" = "skipped" ]
          [ "$ran" = "success" ] || { [ "${{ needs.changes.outputs.has-code }}" = "false" ] && [ "$ran" = "skipped" ]; }

  tsnet-sidecar-test:
    needs: changes
    if: needs.changes.outputs.has-sidecar != 'false'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/tsnet-sidecar
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/tsnet-sidecar/go.mod
          cache-dependency-path: apps/tsnet-sidecar/go.sum

      - name: Verify module files are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Format
        run: test -z "$(gofmt -l .)"

      - name: Test
        run: go test ./...

  tsnet-sidecar-build:
    needs: changes
    if: needs.changes.outputs.has-sidecar != 'false'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    defaults:
      run:
        working-directory: apps/tsnet-sidecar
    env:
      CGO_ENABLED: '0'
      GOOS: ${{ matrix.target.goos }}
      GOARCH: ${{ matrix.target.goarch }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/tsnet-sidecar/go.mod
          cache-dependency-path: apps/tsnet-sidecar/go.sum

      - name: Vet
        run: go vet ./...

      - name: Build
        run: |
          out="$RUNNER_TEMP/tsnet-sidecar-${GOOS}-${GOARCH}"
          [ "$GOOS" = windows ] && out="$out.exe"
          go build -trimpath -ldflags '-s -w' -o "$out" .
          size=$(stat -c %s "$out")
          echo "tsnet-sidecar ${GOOS}/${GOARCH}: ${size} bytes"
          [ "$size" -le 41943040 ] || { echo "::error::binary exceeds 40 MiB"; exit 1; }
          echo "BINARY_PATH=$out" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tsnet-sidecar-${{ matrix.target.goos }}-${{ matrix.target.goarch }}
          path: ${{ env.BINARY_PATH }}
          retention-days: 7
          if-no-files-found: error

  pack-smoke:
    needs: changes
    if: needs.changes.outputs.has-code != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pack smoke (main package tarball, bare node)
        run: scripts/pack-smoke.sh

  gates:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.gates-needed != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Migration additions stay ahead of current main (#3692)
        if: ${{ !cancelled() }}
        run: |
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          node --test scripts/migration-main-gate.test.mjs
          node scripts/migration-main-gate.mjs

      - name: "Comment discipline gate (advisory, #1520)"
        continue-on-error: true
        if: ${{ !cancelled() }}
        env:
          COMMENT_DISCIPLINE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch origin "${COMMENT_DISCIPLINE_BASE_SHA:-main}"
          node --test scripts/comment-discipline-gate.test.mjs
          node scripts/comment-discipline-gate.mjs

      - name: "Probe reach gate (advisory, #1542)"
        if: ${{ !cancelled() }}
        env:
          VP_REACH_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch origin "${VP_REACH_BASE_SHA:-main}"
          node --test scripts/probe-reach.test.mjs
          node .claude/skills/verify-cairn/scripts/vp-registry-gate.mjs --check-reach

      - name: Dispatch agent start/check round trip (#1556)
        if: ${{ !cancelled() && needs.changes.outputs.ops-selftests == 'true' }}
        run: node --test scripts/dispatch-agent.test.mjs scripts/dispatch-dedupe.test.mjs scripts/lane-model-policy.test.mjs

      - name: Workflow concurrency, scalars and queue promotion
        if: ${{ !cancelled() && needs.changes.outputs.ops-selftests == 'true' }}
        run: node --test scripts/workflow-concurrency.test.mjs scripts/workflow-scalars.test.mjs scripts/ops/promote-queue.test.mjs scripts/ops/guard-queue.test.mjs scripts/ops/push-queue.test.mjs

      - name: Commit identity allowlist and hooks (#2289)
        if: ${{ !cancelled() && needs.changes.outputs.ops-selftests == 'true' }}
        run: node --test scripts/commit-identity.test.mjs

      - name: UI debt ledger only shrinks against main
        if: ${{ !cancelled() && needs.changes.outputs.ops-selftests == 'true' }}
        run: node --test scripts/ui-debt-gate.test.mjs

      - name: Vitest shards split by recorded file times
        if: ${{ !cancelled() && needs.changes.outputs.ops-selftests == 'true' }}
        run: node --test scripts/vitest-timed-shard.test.mjs

      - name: E2E selection and timed shards
        if: ${{ !cancelled() && needs.changes.outputs.ops-selftests == 'true' }}
        run: node --test scripts/e2e-affected.test.mjs

      - name: Pages keep to tokens
        if: ${{ !cancelled() && needs.changes.outputs.ops-selftests == 'true' }}
        run: node --test scripts/ui-page-style-gate.test.mjs

      - name: Feature map covers every route and stays in step with the code
        if: ${{ !cancelled() }}
        env:
          FEATURE_REGISTRY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$FEATURE_REGISTRY_BASE_SHA" ]; then git fetch origin "$FEATURE_REGISTRY_BASE_SHA"; fi
          node scripts/generate-feature-map.mjs --check

      - name: Canon digest stays in step with the rulings registry
        if: ${{ !cancelled() }}
        run: node scripts/generate-canon.mjs --check

      - name: Gardener sweep self-test (#1617)
        if: ${{ !cancelled() && needs.changes.outputs.ops-selftests == 'true' }}
        run: node --test scripts/gardener-weekly.test.mjs scripts/doc-drift.test.mjs scripts/evidence-prune.test.mjs scripts/delivery-metrics.test.mjs scripts/issue-coverage.test.mjs scripts/feature-map-maintain.test.mjs scripts/generate-feature-map.test.mjs scripts/generate-canon.test.mjs

      - name: Nightly scan self-test (§11.1)
        if: ${{ !cancelled() && needs.changes.outputs.ops-selftests == 'true' }}
        run: node --test scripts/nightly-scan/nightly-scan.test.mjs

      - name: CI tier conditions
        if: ${{ !cancelled() && needs.changes.outputs.ops-selftests == 'true' }}
        run: node --test scripts/ci-tiers.test.mjs

      - name: Real smoke runner and checker fixtures (#2283)
        if: ${{ !cancelled() && needs.changes.outputs.ops-selftests == 'true' }}
        run: node --test scripts/ops/real-smoke.test.mjs

      - name: Orb host provisioning fixtures (#2273)
        if: ${{ !cancelled() && needs.changes.outputs.ops-selftests == 'true' }}
        run: node --test scripts/ops/orb/egress-relay.test.mjs scripts/ops/orb/orb-host-check.test.mjs scripts/ops/orb/provision.test.mjs scripts/ops/orb/shell.test.mjs scripts/ops/orb/canary.test.mjs scripts/ops/orb/canary-review.test.mjs scripts/ops/orb/canary-container.test.mjs scripts/ops/orb/container-host-check.test.mjs scripts/ops/orb/egress-unit.test.mjs scripts/ops/orb/trial-evidence-check.test.mjs scripts/ops/orb/trial-report.test.mjs
      - name: Host control script fixtures (#2380)
        if: ${{ !cancelled() && needs.changes.outputs.ops-selftests == 'true' }}
        run: node --test scripts/ops/host/brake.test.mjs scripts/ops/host/surface-stuck-rebase.test.mjs scripts/ops/host/lane-replaced.test.mjs scripts/ops/host/as-bot.test.mjs scripts/ops/host/dispatch-issue.test.mjs scripts/ops/host/identity-compat.test.mjs

      - name: Test temp guard fixtures (#1954)
        if: ${{ !cancelled() && needs.changes.outputs.ops-selftests == 'true' }}
        run: node --test scripts/ops/host/test-temp-guard.test.mjs

      - name: Runner secret isolation fixtures (#2189)
        if: ${{ !cancelled() && needs.changes.outputs.ops-selftests == 'true' }}
        run: node --test scripts/ops/secret-reach/canary.test.mjs scripts/ops/secret-reach/broker.test.mjs scripts/ops/secret-reach/setup-runner-user.test.mjs

      - name: Scoped root runner for ops scripts (#2362)
        if: ${{ !cancelled() && needs.changes.outputs.ops-selftests == 'true' }}
        run: node --test scripts/ops/cairn-ops/run.test.mjs scripts/ops/cairn-ops/install.test.mjs

      - name: Langfuse code evaluator isolation
        if: ${{ !cancelled() && needs.changes.outputs.ops-selftests == 'true' }}
        run: node --test scripts/ops/langfuse-code-eval.test.mjs

  ops-backup-test:
    needs: changes
    if: needs.changes.outputs.ops-selftests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Server backup script against an rrsync receiver (#2163)
        run: |
          command -v sqlite3 >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q sqlite3; }
          curl -fsSL -o "$RUNNER_TEMP/rrsync" https://raw.githubusercontent.com/RsyncProject/rsync/v3.4.1/support/rrsync
          echo "0bb743f8155907ed2a337c12a4672c67269e372803939ec98dac497edc714c9b  $RUNNER_TEMP/rrsync" | sha256sum -c -
          RRSYNC="$RUNNER_TEMP/rrsync" node --test scripts/ops/backup-server-db.test.mjs scripts/ops/push-test.test.mjs scripts/ops/push-worker.test.mjs
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies for the self-deploy build-settings guard
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Self-deploy and deploy-lag watch fixtures (#2288)
        run: node --test scripts/ops/deploy-self.test.mjs scripts/ops/control-plane-units.test.mjs
