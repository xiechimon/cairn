name: ci

# Third-party actions are pinned to full commit SHAs (#1076); the trailing version is Dependabot's anchor.
on:
  push:
    branches: [main, 'prototype/**']
  pull_request:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || github.ref == 'refs/heads/main' && 'ci-main' || format('ci-ref-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      has-code: ${{ steps.classify.outputs.has-code }}
      tested-in-queue: ${{ steps.classify.outputs.tested-in-queue }}
      has-sidecar: ${{ steps.classify.outputs.has-sidecar }}
      gates-needed: ${{ steps.classify.outputs.gates-needed }}
      ops-selftests: ${{ steps.classify.outputs.ops-selftests }}
      web-ui: ${{ steps.classify.outputs.web-ui }}
      e2e-tier: ${{ (github.event_name == 'push' || (github.event.pull_request.draft && github.event.pull_request.user.login == 'mergify[bot]' && startsWith(github.head_ref, 'mergify/merge-queue/'))) && 'full' || (github.event_name == 'pull_request' && !github.event.pull_request.draft && steps.classify.outputs.web-ui == 'true' && 'affected') || 'none' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Classify changes
        id: classify
        env:
          PREPUSH_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          has_code=true
          has_sidecar=true
          gates_needed=true
          tested_in_queue=false
          ops_selftests=true
          web_ui=false
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if ! git diff --name-only "$PREPUSH_BASE_SHA" HEAD | grep -qE '^(scripts/|\.github/|packages/shared/|\.mergify\.yml$|package\.json$|pnpm-lock\.yaml$)'; then
              ops_selftests=false
            fi
            if git diff --name-only "$PREPUSH_BASE_SHA" HEAD | grep -q '^apps/web/src/'; then
              web_ui=true
            fi
            has_code=$(node scripts/prepush.mjs --has-code) || has_code=true
            has_sidecar=$(node scripts/prepush.mjs --has-sidecar) || has_sidecar=true
            gates_needed=$(node scripts/prepush.mjs --needs-gates) || gates_needed=true
          elif [ "$GITHUB_REF" = refs/heads/main ]; then
            commits=$(git rev-list "$BEFORE_SHA..$GITHUB_SHA") || commits=
            tested_in_queue=$(node scripts/ops/merge-route-audit.mjs landed $commits) || tested_in_queue=false
            if [ "$tested_in_queue" = true ]; then
              has_code=false
              has_sidecar=false
            fi
          fi
          echo "has-code=$has_code" >> "$GITHUB_OUTPUT"
          echo "has-sidecar=$has_sidecar" >> "$GITHUB_OUTPUT"
          echo "tested-in-queue=$tested_in_queue" >> "$GITHUB_OUTPUT"
          echo "gates-needed=$gates_needed" >> "$GITHUB_OUTPUT"
          echo "ops-selftests=$ops_selftests" >> "$GITHUB_OUTPUT"
          echo "web-ui=$web_ui" >> "$GITHUB_OUTPUT"

  # #762: branch protection treats skipped jobs as success; always() ensures aggregates report failures.
  check:
    needs: [changes, check-core, vitest-light, vitest-integration, tsnet-sidecar-test, tsnet-sidecar-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate check parts
        run: |
          [ "${{ needs.changes.result }}" = "success" ]
          for result in "${{ needs.check-core.result }}" "${{ needs.vitest-light.result }}" "${{ needs.vitest-integration.result }}"; do
            if [ "$result" = "success" ]; then
              continue
            fi
            [ "${{ needs.changes.outputs.has-code }}" = "false" ] && [ "$result" = "skipped" ] || exit 1
          done
          for result in "${{ needs.tsnet-sidecar-test.result }}" "${{ needs.tsnet-sidecar-build.result }}"; do
            if [ "$result" = "success" ]; then
              continue
            fi
            [ "${{ needs.changes.outputs.has-sidecar }}" = "false" ] && [ "$result" = "skipped" ] || exit 1
          done

  check-core:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Conflict markers
        run: |
          if git grep -nE '^(<<<<<<< |>>>>>>> )' -- . ; then
            echo "::error::committed conflict markers — resolve the merge, do not commit the markers"
            exit 1
          fi

      - name: UI registry gate (#989)
        env:
          UI_REGISTRY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ui-registry-gate.mjs

      - name: UI consumer shape gate (#1054)
        run: node scripts/ui-consumer-shape-gate.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepush checks (#1533)
        env:
          PREPUSH_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          ENGLISH_ONLY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PREPUSH_FORCE_FULL: ${{ github.event_name == 'push' }}
          UI_DEBT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pnpm prepush --ci

      - name: Orb canary scratch runner (#2277)
        run: node --test scripts/ops/orb/canary-stack.test.mjs

      - name: PR evidence regression tests
        run: python3 scripts/pr-evidence-gate.test.py

      - name: Harbor task conversion, probe and labeler tests
        run: |
          cd integration/eval/harbor
          pipx run pytest test_pr_to_task.py test_control_probe.py test_label_task.py

      - name: Prepush self-test
        run: pnpm prepush --self-test

      - name: verify-cairn CLI self-test (#1402)
        if: github.event_name != 'pull_request' || needs.changes.outputs.has-code != 'false'
        run: node .claude/skills/verify-cairn/scripts/vp-selftest.mjs

      - name: Drizzle snapshot chain guard
        if: github.event_name != 'pull_request' || needs.changes.outputs.has-code != 'false'
        run: pnpm --filter @xiechimon/cairn db:check

      - name: Drizzle migration drift check
        if: github.event_name != 'pull_request' || needs.changes.outputs.has-code != 'false'
        run: |
          pnpm --filter @xiechimon/cairn db:generate
          git add -N apps/server/drizzle
          git diff --exit-code apps/server/drizzle

      - name: Lint warning cap gate (#1192)
        if: github.event_name != 'pull_request' || needs.changes.outputs.has-code != 'false'
        env:
          LINT_WARNING_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$LINT_WARNING_BASE_SHA" ]; then
            git fetch origin "$LINT_WARNING_BASE_SHA"
          fi
          node scripts/lint-warning-cap.mjs

  vitest-light:
    needs: changes
    if: needs.changes.outputs.has-code != 'false'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test (vitest, light project)
        run: VITEST_PROJECT_SET=light node scripts/test-temp-run.mjs -- pnpm test --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  vitest-integration:
    needs: changes
    if: needs.changes.outputs.has-code != 'false'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The integration vitest suites launch real Chromium; a missing executable fails browserType.launch.
      - name: Install Playwright chromium
        uses: ./.github/actions/playwright-chromium

      - name: Test (vitest, integration stack)
        run: VITEST_PROJECT_SET=integration node scripts/test-temp-run.mjs -- pnpm test --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  e2e:
    needs: changes
    if: needs.changes.outputs.e2e-tier == 'full' && needs.changes.outputs.has-code != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium
        uses: ./.github/actions/playwright-chromium

      # #765: pnpm forwards `--` to the script, so `e2e -- --shard=...` makes Playwright ignore sharding.
      # Flags after the script name are forwarded without the extra positional `--`.
      - name: "E2E (shard ${{ matrix.shard }}/4, #693)"
        run: pnpm prepush --e2e-shard ${{ matrix.shard }}/4

      - name: Upload gallery snapshot renders
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gallery-snapshots-shard-${{ matrix.shard }}
          path: |
            apps/web/e2e/gallery-snapshots.spec.ts-snapshots/
            apps/web/test-results/**/*-actual.png
            apps/web/test-results/**/*-diff.png
          if-no-files-found: ignore
          retention-days: 7

      - name: CSS mechanism gate (#747)
        run: node scripts/css-mechanism-gate.mjs

  e2e-affected:
    needs: changes
    if: needs.changes.outputs.e2e-tier == 'affected' && needs.changes.outputs.has-code != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium
        uses: ./.github/actions/playwright-chromium

      - name: E2E (specs affected by this PR, split by recorded spec times)
        run: pnpm --filter @cairn/web e2e:affected --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Fixture build for the CSS mechanism gate
        if: ${{ !cancelled() && matrix.shard == 1 }}
        working-directory: apps/web
        run: pnpm exec vite build --mode fixture

      - name: CSS mechanism gate (#747)
        if: ${{ !cancelled() && matrix.shard == 1 }}
        run: node scripts/css-mechanism-gate.mjs

      - name: Upload gallery snapshot renders
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gallery-snapshots-affected-${{ matrix.shard }}
          path: |
            apps/web/e2e/gallery-snapshots.spec.ts-snapshots/
            apps/web/test-results/**/*-actual.png
            apps/web/test-results/**/*-diff.png
          if-no-files-found: ignore
          retention-days: 7

  e2e-gate:
    needs: [changes, e2e, e2e-affected]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate the e2e tier
        run: |
          [ "${{ needs.changes.result }}" = "success" ]
          case "${{ needs.changes.outputs.e2e-tier }}" in
            full) ran="${{ needs.e2e.result }}" idle="${{ needs.e2e-affected.result }}" ;;
            affected) ran="${{ needs.e2e-affected.result }}" idle="${{ needs.e2e.result }}" ;;
            none)
              [ "${{ needs.e2e.result }}" = "skipped" ]
              [ "${{ needs.e2e-affected.result }}" = "skipped" ]
              exit 0
              ;;
            *) exit 1 ;;
          esac
          [ "$idle" = "skipped" ]
          [ "$ran" = "success" ] || { [ "${{ needs.changes.outputs.has-code }}" = "false" ] && [ "$ran" = "skipped" ]; }

  tsnet-sidecar-test:
    needs: changes
    if: needs.changes.outputs.has-sidecar != 'false'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/tsnet-sidecar
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/tsnet-sidecar/go.mod
          cache-dependency-path: apps/tsnet-sidecar/go.sum

      - name: Verify module files are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Format
        run: test -z "$(gofmt -l .)"

      - name: Test
        run: go test ./...

  tsnet-sidecar-build:
    needs: changes
    if: needs.changes.outputs.has-sidecar != 'false'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    defaults:
      run:
        working-directory: apps/tsnet-sidecar
    env:
      CGO_ENABLED: '0'
      GOOS: ${{ matrix.target.goos }}
      GOARCH: ${{ matrix.target.goarch }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/tsnet-sidecar/go.mod
          cache-dependency-path: apps/tsnet-sidecar/go.sum

      - name: Vet
        run: go vet ./...

      - name: Build
        run: |
          out="$RUNNER_TEMP/tsnet-sidecar-${GOOS}-${GOARCH}"
          [ "$GOOS" = windows ] && out="$out.exe"
          go build -trimpath -ldflags '-s -w' -o "$out" .
          size=$(stat -c %s "$out")
          echo "tsnet-sidecar ${GOOS}/${GOARCH}: ${size} bytes"
          [ "$size" -le 41943040 ] || { echo "::error::binary exceeds 40 MiB"; exit 1; }
          echo "BINARY_PATH=$out" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tsnet-sidecar-${{ matrix.target.goos }}-${{ matrix.target.goarch }}
          path: ${{ env.BINARY_PATH }}
          retention-days: 7
          if-no-files-found: error

  warm-caches:
    needs: changes
    if: needs.changes.outputs.tested-in-queue == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium
        uses: ./.github/actions/playwright-chromium

  pack-smoke:
    needs: changes
    if: needs.changes.outputs.has-code != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pack smoke (main package tarball, bare node)
        run: scripts/pack-smoke.sh

  dead-class-gate:
    needs: changes
    if: needs.changes.outputs.has-code != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dead class gate (#1036)
        env:
          PREPUSH_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm prepush --advisory

  gates:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Migration additions stay ahead of current main (#3692)
        if: ${{ !cancelled() }}
        run: |
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          node --test scripts/migration-main-gate.test.mjs
          node scripts/migration-main-gate.mjs

      - name: "Comment discipline gate (advisory, #1520)"
        continue-on-error: true
        if: ${{ !cancelled() }}
        env:
          COMMENT_DISCIPLINE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch origin "${COMMENT_DISCIPLINE_BASE_SHA:-main}"
          node --test scripts/comment-discipline-gate.test.mjs
          node scripts/comment-discipline-gate.mjs

      - name: "Probe reach gate (advisory, #1542)"
        if: ${{ !cancelled() }}
        env:
          VP_REACH_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch origin "${VP_REACH_BASE_SHA:-main}"
          node --test scripts/probe-reach.test.mjs
          node .claude/skills/verify-cairn/scripts/vp-registry-gate.mjs --check-reach

      - name: Dispatch agent start/check round trip (#1556)
        if: ${{ !cancelled() }}
        run: node --test scripts/dispatch-agent.test.mjs scripts/dispatch-dedupe.test.mjs scripts/lane-model-policy.test.mjs scripts/pr-body-hook.test.mjs

      - name: Mergify queue config follows pr-gate routing
        if: ${{ !cancelled() }}
        run: node --test scripts/mergify-config.test.mjs scripts/merge-route.test.mjs scripts/workflow-concurrency.test.mjs scripts/workflow-scalars.test.mjs scripts/autonomy-brake.test.mjs scripts/autonomy-brake-workflow.test.mjs

      - name: Commit identity allowlist and hooks (#2289)
        if: ${{ !cancelled() }}
        run: node --test scripts/commit-identity.test.mjs

      - name: UI debt ledger only shrinks against main
        if: ${{ !cancelled() }}
        run: node --test scripts/ui-debt-gate.test.mjs

      - name: Vitest shards split by recorded file times
        if: ${{ !cancelled() }}
        run: node --test scripts/vitest-timed-shard.test.mjs

      - name: E2E selection and timed shards
        if: ${{ !cancelled() }}
        run: node --test scripts/e2e-affected.test.mjs

      - name: Pages keep to tokens; gallery baselines map from CI renders
        if: ${{ !cancelled() }}
        run: node --test scripts/ui-page-style-gate.test.mjs

      - name: Feature map covers every route and stays in step with the code
        if: ${{ !cancelled() }}
        env:
          FEATURE_REGISTRY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$FEATURE_REGISTRY_BASE_SHA" ]; then git fetch origin "$FEATURE_REGISTRY_BASE_SHA"; fi
          node scripts/generate-feature-map.mjs --check

      - name: Gardener sweep self-test (#1617)
        if: ${{ !cancelled() }}
        run: node --test scripts/gardener-ratchet.test.mjs scripts/gardener-weekly.test.mjs scripts/doc-drift.test.mjs scripts/evidence-prune.test.mjs scripts/delivery-metrics.test.mjs scripts/issue-coverage.test.mjs scripts/feature-map-maintain.test.mjs scripts/generate-feature-map.test.mjs

      - name: Nightly scan self-test (§11.1)
        if: ${{ !cancelled() && needs.changes.outputs.ops-selftests == 'true' }}
        run: node --test scripts/nightly-scan/nightly-scan.test.mjs

      - name: Merge routing size caps (#2371)
        if: ${{ !cancelled() }}
        run: node --test scripts/pr-gate-routing.test.mjs scripts/pr-size.test.mjs scripts/batch-merger.test.mjs scripts/coordinator-merge.test.mjs scripts/merge-queue-drafts.test.mjs scripts/ci-tiers.test.mjs scripts/pr-ticket-link.test.mjs

      - name: Real smoke runner and checker fixtures (#2283)
        if: ${{ !cancelled() && needs.changes.outputs.ops-selftests == 'true' }}
        run: node --test scripts/ops/real-smoke.test.mjs

      - name: Orb host provisioning fixtures (#2273)
