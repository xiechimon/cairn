name: ci

# push 只留 main 与 prototype/**（#500）。`web/**` 曾在此列，导致每条车道分支
# 每次 push 触发两条同 workflow 的 run：push 一条、pull_request 一条，跑的是
# 同一个 head sha。近 30 条 run 里 5 条 web/** 分支全部 1:1 双跑，且结论会分歧
# ——web/sidebar-head-polish 的 push run 红、pull_request run 绿（m5 存量 flake），
# 把 commit status 钉成 UNSTABLE 并误导归因。
#
# 不用 concurrency 按 sha 去重：push 的 github.sha 与 pull_request 的
# event.pull_request.head.sha 是同一个值，两者落进同一 group，
# cancel-in-progress 会让后注册的那条取消先注册的——谁存活不确定；若存活的是
# push run，PR 页面只剩一条 cancelled，合并闸反而更糊。收敛触发面才是确定解。
#
# 保留 prototype/**：那两个分支（42-pixel-replica / shadcn-visual-tokens）无
# 开 PR，push run 是它们唯一的 CI 来源；摘掉等于零覆盖。web/** 车道一律开 PR，
# 由无条件的 pull_request 触发覆盖（lane/** docs/** 本就不在列，同一口径）。
# 副作用：web/** 分支在「已 push、未开 PR」的窗口内没有 CI——需要早看信号就开
# draft PR，pull_request 对 draft 同样触发。
#
# 第三方 action 一律钉完整 commit SHA + 尾注版本号（#1076）：浮动 tag 可被上游
# 重指（或仓库接管后重指），等于 CI 里跑的第三方代码可变；尾注里的版本号是
# Dependabot 升级时解析的锚点，别删。
on:
  push:
    branches: [main, 'prototype/**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # reads packageManager from package.json
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      # 冲突标记闸（2026-10-08）：合并冲突标记被提交进 main 过一次
      # （`.claude/skills/verify-pacman/SKILL.md` 里嵌套的 `<<<<<<<`，由解冲突
      # 脚本只处理最外层所致）。这种破损**不报错、不影响构建、也没人读得出来**
      # ——只有机器能替人抓住。只认带引用名的 `<<<<<<< ` / `>>>>>>> `（行首 +
      # 空格），不认裸 `=======`（markdown 的 setext 标题就是一行等号，会误伤）。
      # 零依赖，故意排在 install 之前：一分钟内红。
      - name: Conflict markers
        run: |
          if git grep -nE '^(<<<<<<< |>>>>>>> )' -- . ; then
            echo "::error::committed conflict markers — resolve the merge, do not commit the markers"
            exit 1
          fi

      # Lane file gate (#1199): herdr lane threads draft PROGRESS.md /
      # BLOCKED.md at the worktree root and the files keep riding PR
      # branches into main (#1189 merged BLOCKED.md in; #1153's PROGRESS.md
      # was caught in review). Zero-dependency, pre-install, one-minute red
      # for the offending lane. Takes the PR base sha the same way the
      # #851 ui-debt-gate takes UI_DEBT_BASE_SHA: the added-only diff leg
      # runs on pull_request; push runs self-check the tracked set.
      - name: Lane file gate (#1199)
        env:
          LANE_FILE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$LANE_FILE_BASE_SHA" ]; then
            git fetch --depth=1 origin "$LANE_FILE_BASE_SHA"
          fi
          node scripts/lane-file-gate.mjs

      # 止血闸转永久回归闸（#851 出身 #908 波 0a；#1012 封版裁决：保留，
      # 理由见 docs/verify/1012/README.md）：per-face CSS 逐文件行数、裸控件
      # 总数、Tailwind 任意值（text-[Npx] 与间距类 -[Npx] 两个总数，Paper
      # 改版 PR 2 加的第三本账，D5）只许降不许升。封版终态即地板（0 per-face 文件；3 裸控件 = 全部
      # deliberate-native 豁免的隐藏 file 触发器），棘轮自此纯防回潮——它是
      # 「非 registry 新增为零」的机械载体，且 #989 registry 闸的面到
      # components/ui 为止，消费侧 CSS 文件与裸 button/input/select/textarea
      # 总量没有第二道闸。比较基准取 PR base sha 上的基线文件（下面先
      # fetch），所以分支内重新冻结基线抬不高自己的天花板（脚本内 D3）。
      # 纯源码扫描、零依赖，故意排在 install 之前：违规车道的红灯一分钟内
      # 就到，不用等整个 check job 跑完。push（main / prototype/**）没有
      # base sha，退回仓内基线自校——main 上「树高于账本」同样红。
      - name: UI debt gate (#851)
        env:
          UI_DEBT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$UI_DEBT_BASE_SHA" ]; then
            git fetch --depth=1 origin "$UI_DEBT_BASE_SHA"
          fi
          node scripts/ui-debt-gate.mjs

      # components/ui registry 闸（#989，地图 #980）：白名单清单 + 内容 hash
      # 账本 + pristine 件对照 vendored 上游快照 + 状态棘轮（S5 对照 base
      # manifest，复用上面已 fetch 的 base sha）。手写原语进 components/ui
      # 即红；已登记文件被覆写而同 PR 未重冻账本也红。零网络、零依赖
      # （shadcn CLI 只存在于按需刷新脚本 scripts/ui-registry-refresh.mjs，
      # live diff 形态已被 #985 实测否掉），同样排在 install 之前。
      - name: UI registry gate (#989)
        env:
          UI_REGISTRY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ui-registry-gate.mjs

      # 消费点方角盒闸（#1054，ADR 0012 D1）：registry 闸的面到 components/ui
      # 为止，消费点画盒的几何没有任何闸判——本闸补上：每个「看得见的方形盒」
      # 消费行必须接 registry 依据 / 骑件默认 / 在 scripts/ui-consumer-registry.json
      # 登记偏离理由，台账 diff 即评审面。零依赖，同样排在 install 之前。
      - name: UI consumer shape gate (#1054)
        run: node scripts/ui-consumer-shape-gate.mjs

      # e2e 迁去独立分片 job（#693）后 ffmpeg 随迁；chromium 留在本 job——
      # integration vitest 的四个 e2e 套件（m5-web-e2e 等）在场内起真
      # Chromium（2026-10-03 实测摘掉即红：browserType.launch executable
      # doesn't exist）。「check 不再需要浏览器面」是误判，浏览器面有两层。
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Spec 解析闸（#1052）：e2e spec 少一个 `  });` 不进任何本地快速闸——
      # biome 只警告、apps/web 的 tsconfig 不含 e2e/，第一道红是 CI e2e 分片
      # 在收集期炸（分钟级反馈：fixture build + 分片启动）。`playwright test
      # --list` 只解析收集不执行、不构建、不起浏览器（实测 109 文件 / 849
      # 用例 1.6s），integration/test 那半交给它自己的 tsc（~0.5s）。排在
      # chromium 安装之前：坏 spec 的红灯不陪跑浏览器安装。
      # 「排在 e2e 分片之前」是**信号序**不是 DAG 序：e2e 是独立 job（#693），
      # 与本 job 并行，不给它加 needs——串行化会把所有健康 PR 的 e2e 反馈压后
      # 整个 check job 的时长，恰是 #693 要消掉的延迟。本步在 job 开头 ~1 分钟
      # （install 后 3s）出信号，分片要等 ffmpeg + chromium + fixture build
      # 才进收集期：坏 spec 时这里总是先红。分片白跑的 runner 分钟数是接受的
      # 代价，换健康 PR 的并行反馈不降速。
      - name: Spec parse gate (#1052)
        run: pnpm spec:parse

      - name: Install Playwright chromium
        run: pnpm exec playwright install chromium --with-deps

      # migration 纪律（01 §6）：drizzle-kit 生成、进 repo、CI 校验 drift——
      # schema 改动未带 migration 再生成 = 红。
      # 前置护栏：drizzle-kit 撞到 snapshot 链断裂时**只打印、退出码仍 0**，
      # 且不再生成任何迁移——下面这步的 git diff 就恒为空，闸静默失效。
      # db:check 直接校验链不变量把这种情况变成硬失败。
      - name: Drizzle snapshot chain guard
        run: pnpm --filter @xiechimon/pacman db:check

      - name: Drizzle migration drift check
        run: |
          pnpm --filter @xiechimon/pacman db:generate
          git add -N apps/server/drizzle
          git diff --exit-code apps/server/drizzle

      - name: Typecheck
        run: pnpm typecheck

      # 集成栈单独一步（2026-09-30）：它在场内起真 server + 真 daemon +
      # Chromium，与轻 project 同跑时在 2 vCPU runner 上争核假红——实测：同 sha
      # 连跑两次同点同败、纯文档提交也红、本地同一条 10.9s 过。分组清单在根
      # vitest.config.ts（light + integration 精确等于全量，无泄漏）。
      - name: Test (vitest，轻 project)
        run: VITEST_PROJECT_SET=light pnpm test

      - name: Test (vitest，集成栈单独跑)
        run: VITEST_PROJECT_SET=integration pnpm test

      - name: Lint (biome ci)
        run: pnpm lint

      # Lint warning cap ratchet (#1192): biome ci surfaces warnings in its
      # summary but only exits non-zero on errors, so the warning count grows
      # silently with each new code drop (#1180 alone shipped 7). This gate
      # parses the "Found N warnings" summary line and compares to a frozen
      # cap; over the cap is red, and the in-tree baseline cannot sit higher
      # than the base's baseline (so a PR can't lift its own ceiling — same
      # D3 mechanism as ui-debt-gate.mjs). Cap is pinned in
      # scripts/lint-warning-baseline.json and may only move down; re-freeze
      # with `node scripts/lint-warning-cap.mjs --write` after clearing debt
      # in a PR. Needs npx + node_modules for biome itself.
      - name: Lint warning cap gate (#1192)
        env:
          LINT_WARNING_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$LINT_WARNING_BASE_SHA" ]; then
            git fetch --depth=1 origin "$LINT_WARNING_BASE_SHA"
          fi
          node scripts/lint-warning-cap.mjs

      # UI 漂移闸（#851；#1012 封版裁决：保留为永久闸）：单一样式只许一种
      # 实现——活 `.btn` 选择子、token 源之外的 hex 字面量、chip 变体异地
      # 重定义、无 deliberate-native 标记的裸 `<input>`、components/ui 内
      # raw color（G5，与 #989 hash 账本互补：账本钉文件 hash，看不见
      # registered-deviated 文件里的颜色内容）、未登记的品牌墨 text-role
      # 行（G6）即红。这些内容级面没有第二道闸承载。纯源码扫描，不需构建。
      - name: UI drift gate (#851)
        run: node scripts/ui-drift-gate.mjs

  # e2e 全量归 CI（#693 分层职责）：本地开发期只跑受影响面
  # （pnpm --filter @pacman/web e2e:affected），全量唯一执行点在这。
  # 4 分片并行（playwright --shard，按测试精确切分、并集 = 全量 83 spec，
  # 覆盖面不降）：单 shard ≈ setup + fixture build + 1/4 测试量 ≈ 2 分钟，
  # 远小于原 check job 里串行的 223s e2e 步。独立 job/runner 也顺带消掉了
  # 「与 check job 同 runner 互写 apps/web/dist」的约束（token-gate 与
  # webServer 都在各自 runner 的 dist 上工作）。fail-fast 关闭：一个 shard
  # 红不掩盖其余 shard 的结果。
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # reads packageManager from root package.json
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      # `apt-get update` 去掉了（2026-10-07 夜实测）：它本身不是装 ffmpeg 必需的——
      # 镜像的 apt 列表在构建时就烤好了，直接的 install 走的是现成索引。而 update
      # 要遍历所有源，慢起来单步能爬 11m42s（实测），4 个分片同时卡在这一步、测试
      # 一步没跑，是当晚 CI 拖成「分片挂死」的真凶。删掉它把这一步的失败面收窄成
      # 「装不上包」这一种真故障。
      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium
        run: pnpm exec playwright install chromium --with-deps

      # 分隔符的位置是有判据的（#765）：pnpm 把 `--` 原样转给脚本，`e2e -- --shard=…`
      # 于是 playwright 收到一个 `--` 位置参数、`--shard` 根本没进解析——四条分片
      # 各跑全量 688 用例（实测 4m03–5m32/shard），分片形同虚设。去掉 `--`（pnpm
      # 会把脚本名之后的未知 flag 直接转发）后每分片 173/171/…，并集 = 全量。
      - name: E2E (shard ${{ matrix.shard }}/4, #693)
        run: pnpm --filter @pacman/web e2e --shard=${{ matrix.shard }}/4

      # 编译产物闸（#747）：上面的 E2E 步经 webServer fixture-build 已写出
      # apps/web/dist，本步只做 grep 断言，不另付全构建。防的是 #656/#677
      # 的真故障：tw-animate-css 装了、类名写了但没 @import，全族编译成空。
      - name: CSS mechanism gate (#747)
        run: node scripts/css-mechanism-gate.mjs

  # 分片聚合闸（#693）：分支保护的 required contexts 不编码 matrix 基数——
  # 名单写死 e2e (1..4) 的话，将来分片数一调，名单就静默失配（新增分片不
  # 阻塞合并 = 覆盖面实际下降）。本 job 名固定 e2e-gate、needs 全部分片，
  # 保护名单只引它；分片数调整不再触碰仓库设置。
  #
  # `if: always()` 与那句显式判定都不是可选装饰（#762）：只写 `needs` 时，
  # 任一 shard 失败会让本 job **整个 skip**，而分支保护对 `skipped` 与
  # `successful` / `neutral` 同等放行（GitHub 文档 about-protected-branches
  # 「Require status checks before merging」）——闸恰好在唯一需要它的时刻是
  # 开的。always() 保证它永远上报，再按 `needs.e2e.result` 显式判定：只有全
  # 绿放行，failure / cancelled / skipped 一律失败（fail-closed）。将来若给
  # e2e 加 paths 过滤让整层跳过，会在这里响亮地红，而不是静默丢掉覆盖面。
  e2e-gate:
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate e2e shards
        run: |
          echo "e2e result: ${{ needs.e2e.result }}"
          [ "${{ needs.e2e.result }}" = "success" ]

  # 发布产物冒烟（#264，spec #260 Testing Decisions 失败方式枚举的 CI 守）：
  # 独立 job/runner，不与任何 e2e shard 共享 runner（各自写自己的 dist）。
  pack-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # reads packageManager from root package.json
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pack smoke (main package tarball, bare node)
        run: scripts/pack-smoke.sh

  # 死类名闸（#1036，advisory）：TSX 渲染的类名与活样式表（Tailwind 编译物 +
  # src/**/*.css 选择子）求差集，零命中且零 spec/verify 引用即红——#950 退役
  # chief.css 留下的死类名不报错、不红 CI、布局静默塌掉，只有机器能替人抓住。
  # **故意不进分支保护 required contexts**（仓规：必需检查一律等合完之后再
  # 加）：本 job 红灯可见但不拦合并，跑干净一段时间后再由用户决定是否收紧。
  # 需要 node_modules（@tailwindcss/postcss 现场编译 ~0.5s，不依赖 dist）。
  dead-class-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # reads packageManager from root package.json
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dead class gate (#1036)
        run: node scripts/ui-dead-class-gate.mjs --compile

  # 票标签闸（advisory）：每张 open issue 必须带「一个分类 + 一个状态」双标签
  # （bug|enhancement + needs-triage|needs-info|ready-for-agent|ready-for-human|
  # wontfix）。自建票开票即打双标签的规矩（10-05 定）靠 agent 自觉会漏——
  # #1056/#1067 实漏，故上机器。wayfinder:* 车道票在排除面。
  # 故意不进分支保护 required contexts（同 dead-class-gate 口径）。
  # 只读 gh api，无需 node_modules。
  issue-label-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Issue label gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/issue-label-gate.mjs

  # feature-map 陈旧闸（#1160，advisory）：verify-pacman feature map
  # （.claude/skills/verify-pacman/features/*.md）引用的仓内路径 / .类名 /
  # [data-*] 选择子 / CSS 声明形，必须能在当前树命中。avatars.md 陈旧的
  # 「Root 走 display:contents」条目掩护了 #1156（头像被裁本该被 map 拦住）
  # ——map 过期靠人记忆维护必漏，过期可见是机器活。
  # 存量陈旧冻结在 scripts/feature-map-staleness-baseline.json，只对新增红；
  # baseline 条目转绿反过来红、要求删除。
  # 故意不进分支保护 required contexts（同 dead-class-gate 口径）：红灯可见
  # 但不拦合并，跑干净一段时间后再由用户决定是否收紧。
  # 纯 node stdlib、只读仓内文件，无需 node_modules。
  feature-map-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Feature map staleness gate (#1160)
        run: node scripts/feature-map-staleness-gate.mjs
