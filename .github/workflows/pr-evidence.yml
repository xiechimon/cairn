name: pr-evidence

# PR body evidence gate (#750, #939, #940, #1079; tasks check added by
# #1240): the body must answer the "Upstream" and "Verified" template
# sections, and image links (any host by extension; media hosts by URL
# shape) must be embedded (`![...]()`, not `[...]()`) and must answer
# HTTP 200. The body's Acceptance section must carry at least one
# task-list item and none may be unchecked.
#
# Separate file from ci.yml on purpose: the default `pull_request` activity
# types are only opened/synchronize/reopened, and the body is editable, so
# `edited` must be listed explicitly. Putting `types:` on ci.yml would
# re-trigger the whole pipeline on every body edit; here only this job runs.
#
# Third-party actions are pinned to full commit SHAs with trailing version
# comments (#1076): a floating tag can be re-pointed upstream, which would
# make the third-party code this gate runs variable. The version comment is
# the anchor Dependabot parses on upgrade — keep it.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  # Stable job name: after merge, add it to the branch-protection required
  # checks (do it after merge, never before, or open lanes get locked out).
  pr-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Check PR body evidence (sections + links embedded + reachable)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 scripts/pr-evidence-gate.py

      # !cancelled() so both gates' findings show in one run even when the
      # first step reds (#1240): a lane fixing a link problem should not
      # have to push again to discover a tasks problem.
      - name: Check PR body tasks (Acceptance checklist exists and is fully checked)
        if: ${{ !cancelled() }}
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 scripts/pr-tasks-gate.py
