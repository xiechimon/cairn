name: pr-evidence

# The hold guard: a PR carrying the `coordinator-hold` label is red here
# until the label is removed, and while the label is on, a run also
# disarms GitHub auto-merge on the PR. An unchecked task only turns the
# pr-tasks step red and never adds the label. This keeps a merge from landing
# while a human decision is pending, which happened on 2026-10-21 (#1435: auto-merge was armed, the
# orchestrator edited the body green while still asking the user, and the
# merge fired when `check` passed; this job was advisory then). The job is a
# required status check on main (pinned to the Actions app), so a red run
# blocks both auto-merge and `gh pr merge`. Only a label-state red disarms
# auto-merge: a link or wording red is already blocked by the required check
# and clears itself when the lane fixes it, and nobody re-arms auto-merge on
# a lane's behalf.
#
# The autonomy brake rejects paused repositories before body checks unless the
# PR is an exact recovery revert. Brake failures also disarm auto-merge.
#
# The trigger has no `paths:` and the job skips only the draft PRs Mergify
# opens to test a queued batch: a skipped run counts as a passing required
# check and would supersede a red one.
#
# Separate file from ci.yml on purpose: the default `pull_request` activity
# types are only opened/synchronize/reopened, and the body and labels are
# editable, so `edited`, `labeled` and `unlabeled` must be listed explicitly.
# Putting `types:` on ci.yml would re-trigger the whole pipeline on every body
# edit; here only this job runs. `auto_merge_enabled` is listed so that arming
# auto-merge on a labelled PR is undone within one run instead of waiting for
# the next edit or push; `ready_for_review` so a draft's unchecked items are
# judged the moment it stops being a draft.
#
# Third-party actions are pinned to full commit SHAs with trailing version
# comments (#1076): a floating tag can be re-pointed upstream, which would
# make the third-party code this gate runs variable. The version comment is
# the anchor Dependabot parses on upgrade — keep it.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, labeled, unlabeled, auto_merge_enabled]

# contents: write is for disablePullRequestAutoMerge alone: with
# pull-requests: write only, the mutation answers "Resource not accessible by
# integration" (run 39540555968 on #1441, 2026-10-21) and auto-merge stays
# armed. checkout and the label calls need no more than read / pull-requests.
permissions:
  contents: write
  pull-requests: write
  issues: read
  statuses: write

# No concurrency group: GitHub cancels the pending run of a group whenever a
# newer one is queued, and branch protection judges pr-evidence by the newest
# check suite on the head, so a cancelled newest suite kept PRs blocked after
# an older run passed (#2461, #2496). Every run reads the PR as it is now, so
# the newest run's result is the current one.

jobs:
  merge-route:
    if: ${{ github.event.pull_request.state != 'closed' && !(github.event.pull_request.draft && github.event.pull_request.user.login == 'mergify[bot]' && startsWith(github.head_ref, 'mergify/merge-queue/')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Route the head through main's pr-gate rules
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if ! git cat-file -e origin/main:scripts/merge-route.mjs; then
            echo "merge-route: main has no merge-route.mjs yet; no PR may enter the merge queue"
            exit 1
          fi
          git show origin/main:scripts/merge-route.mjs > "$RUNNER_TEMP/merge-route.mjs"
          label_args=()
          if [ "$SAME_REPO" = "true" ]; then label_args=(--label-pr "$PR_NUMBER"); fi
          node "$RUNNER_TEMP/merge-route.mjs" "$HEAD_SHA" "${label_args[@]}"

  # Stable job name: it is in the branch-protection required checks.
  pr-evidence:
    if: ${{ github.event.pull_request.state != 'closed' && !(github.event.pull_request.draft && github.event.pull_request.user.login == 'mergify[bot]' && startsWith(github.head_ref, 'mergify/merge-queue/')) }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      # The PR is read from the API as it is now, never from the event
      # payload: a rerun replays the payload the run was created with, so a
      # label added or a body fixed after that would be invisible to it (two
      # red reruns on #1045 before this was understood). REST rather than
      # `gh pr view`/`gh pr edit`: gh's PR GraphQL path trips on this repo's
      # classic-projects field and can fail without applying the edit.
      - name: Read the PR as it is now
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr.json"
          jq -r '.body // ""' "$RUNNER_TEMP/pr.json" > "$RUNNER_TEMP/pr-body.md"
          echo "labels=$(jq -r '[.labels[].name] | join(",")' "$RUNNER_TEMP/pr.json")" >> "$GITHUB_OUTPUT"
          echo "draft=$(jq -r '.draft' "$RUNNER_TEMP/pr.json")" >> "$GITHUB_OUTPUT"
        id: pr

      - name: Refuse while a hold is on (coordinator-hold label)
        env:
          LABELS: ${{ steps.pr.outputs.labels }}
        run: |
          case ",$LABELS," in
            *,coordinator-hold,*)
              touch hold.flag
              echo "FAIL coordinator-hold: the coordinator asked for changes or a person's decision is pending; this PR merges only after the label is removed"
              exit 1 ;;
          esac
          echo "pr-decision: GREEN (no coordinator-hold label)"

      - name: Check the autonomy brake
        if: ${{ !cancelled() }}
        run: |
          touch autonomy-paused.flag
          if git cat-file -e origin/main:scripts/autonomy-brake.mjs; then
            git show origin/main:scripts/autonomy-brake.mjs > "$RUNNER_TEMP/autonomy-brake.mjs"
            node "$RUNNER_TEMP/autonomy-brake.mjs" check-pr "$PR_NUMBER"
          else
            echo "autonomy-brake: main has no brake script yet; nothing can be paused"
          fi
          rm autonomy-paused.flag

      # !cancelled() so every gate's findings show in one run even when an
      # earlier step reds (#1240): a lane fixing a link problem should not
      # have to push again to discover a tasks problem.
      - name: Check PR body evidence (sections + links embedded + reachable + schema table + evidence card + coverage lines + baseline pairs)
        if: ${{ !cancelled() && steps.pr.outcome == 'success' }}
        run: |
          BASE_SHA="$(jq -r '.base.sha' "$RUNNER_TEMP/pr.json")"
          HEAD_SHA="$(jq -r '.head.sha' "$RUNNER_TEMP/pr.json")"
          MERGE_BASE="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          schema_args=()
          if [ -n "$(git diff --name-only "$MERGE_BASE" "$HEAD_SHA" -- apps/server/drizzle)" ]; then
            git show "$BASE_SHA:scripts/schema-glance.mjs" > "$RUNNER_TEMP/schema-glance.mjs" 2>/dev/null || git show "$HEAD_SHA:scripts/schema-glance.mjs" > "$RUNNER_TEMP/schema-glance.mjs"
            node "$RUNNER_TEMP/schema-glance.mjs" --base "$MERGE_BASE" --head "$HEAD_SHA" > "$RUNNER_TEMP/schema-glance.md"
            schema_args=(--schema-glance "$RUNNER_TEMP/schema-glance.md")
          fi
          baseline_args=()
          git diff --name-only --diff-filter=AMR "$MERGE_BASE" "$HEAD_SHA" -- '*-snapshots/*.png' > "$RUNNER_TEMP/changed-baselines.txt"
          if [ -s "$RUNNER_TEMP/changed-baselines.txt" ]; then
            baseline_args=(--changed-baselines "$RUNNER_TEMP/changed-baselines.txt")
          fi
          git diff --name-only "$MERGE_BASE" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files.txt"
          python3 scripts/pr-evidence-gate.py "$RUNNER_TEMP/pr-body.md" --changed-files "$RUNNER_TEMP/changed-files.txt" "${schema_args[@]}" "${baseline_args[@]}"

      - name: Check security-review disposition on a security surface
        if: ${{ !cancelled() && steps.pr.outcome == 'success' }}
        run: |
          BASE_SHA="$(jq -r '.base.sha' "$RUNNER_TEMP/pr.json")"
          HEAD_SHA="$(jq -r '.head.sha' "$RUNNER_TEMP/pr.json")"
          MERGE_BASE="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          git diff --name-status --find-renames "$MERGE_BASE" "$HEAD_SHA" > "$RUNNER_TEMP/name-status.txt"
          git show "$BASE_SHA:packages/shared/merge-gate-paths.json" > "$RUNNER_TEMP/gate-paths.json"
          if ! git cat-file -e "$BASE_SHA:scripts/security-review-disposition.mjs"; then
            echo "security-review-disposition: base has no checker yet; not running the PR copy"
            exit 0
          fi
          git show "$BASE_SHA:scripts/security-review-disposition.mjs" > "$RUNNER_TEMP/security-review-disposition.mjs"
          git show "$BASE_SHA:scripts/pr_body.py" > "$RUNNER_TEMP/pr_body.py"
          node "$RUNNER_TEMP/security-review-disposition.mjs" --body "$RUNNER_TEMP/pr-body.md" --name-status "$RUNNER_TEMP/name-status.txt" --head "$HEAD_SHA" --paths "$RUNNER_TEMP/gate-paths.json"

      - name: Check PR body tasks (no unchecked task anywhere)
        if: ${{ !cancelled() && steps.pr.outcome == 'success' }}
        run: |
          set -o pipefail
          python3 scripts/pr-tasks-gate.py "$RUNNER_TEMP/pr-body.md" | tee pr-tasks.log

      # Repository content is English (AGENTS.md "Language"). Chinese quoted
      # inside backticks or fenced blocks, such as a UI label, is allowed.
      - name: Check PR body language (English only)
        if: ${{ !cancelled() && steps.pr.outcome == 'success' }}
        run: node scripts/english-only-gate.mjs --text "$RUNNER_TEMP/pr-body.md"

      # A pending decision must not be racing an armed auto-merge: whenever
      # the coordinator-hold label is on, auto-merge is disarmed. An unchecked
      # task only turns the pr-tasks step red and never adds the
      # label, so checking the item turns the PR green with no manual label
      # removal. Disabling an unarmed auto-merge is a no-op and uses the
      # workflow token, so it does not trigger another workflow run.
      - name: Mark the decision pending and disarm auto-merge
        if: ${{ failure() }}
        run: |
          if [ ! -f hold.flag ] && [ ! -f autonomy-paused.flag ]; then
            echo "pr-decision: red without a pending decision; auto-merge left as it is"
            exit 0
          fi
          if gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --disable-auto 2>disable-auto.err; then
            echo "pr-decision: auto-merge disarmed"
          elif grep -q 'not in auto-merge mode\|not enabled' disable-auto.err; then
            echo "pr-decision: auto-merge was not armed"
          else
            cat disable-auto.err
            echo "FAIL disarm: auto-merge may still be armed on a PR with a pending decision"
            exit 1
          fi
