name: pr-evidence

# PR body evidence gate (#750, #939, #940, #1079; tasks check added by
# #1240; decision guard added 2026-10-21 after #1435): the body must answer the "Upstream"
# and "Verified" template sections, image links (any host by extension; media
# hosts by URL shape) must be embedded (`![...]()`, not `[...]()`) and must
# answer HTTP 200, and the body's Acceptance section must carry at least one
# task-list item with none unchecked.
#
# The decision guard: a PR carrying the `needs-decision` label is red here
# until a person removes the label, and while the label is on, a run also
# disarms GitHub auto-merge on the PR. An unchecked Acceptance item adds the
# label. This is what keeps a merge from landing while a human decision is
# pending, which happened on 2026-10-21 (#1435: auto-merge was armed, the
# orchestrator edited the body green while still asking the user, and the
# merge fired when `check` passed; this job was advisory then). The job is a
# required status check on main (pinned to the Actions app), so a red run
# blocks both auto-merge and `gh pr merge`. Only a label-state red disarms
# auto-merge: a link or wording red is already blocked by the required check
# and clears itself when the lane fixes it, and nobody re-arms auto-merge on
# a lane's behalf.
#
# The job has no `if:` and the trigger no `paths:`: a skipped run counts as
# a passing required check and would supersede a red one.
#
# Separate file from ci.yml on purpose: the default `pull_request` activity
# types are only opened/synchronize/reopened, and the body and labels are
# editable, so `edited`, `labeled` and `unlabeled` must be listed explicitly.
# Putting `types:` on ci.yml would re-trigger the whole pipeline on every body
# edit; here only this job runs. `auto_merge_enabled` is listed so that arming
# auto-merge on a labelled PR is undone within one run instead of waiting for
# the next edit or push.
#
# Third-party actions are pinned to full commit SHAs with trailing version
# comments (#1076): a floating tag can be re-pointed upstream, which would
# make the third-party code this gate runs variable. The version comment is
# the anchor Dependabot parses on upgrade — keep it.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, auto_merge_enabled]

# contents: write is for disablePullRequestAutoMerge alone: with
# pull-requests: write only, the mutation answers "Resource not accessible by
# integration" (run 39540555968 on #1441, 2026-10-21) and auto-merge stays
# armed. checkout and the label calls need no more than read / pull-requests.
permissions:
  contents: write
  pull-requests: write

# One run per PR at a time, newest wins: a label added seconds after a body
# edit must not be outlived by the edit's run finishing green. A cancelled
# run is not a passing check.
concurrency:
  group: pr-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Stable job name: it is in the branch-protection required checks.
  pr-evidence:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Labels are re-read from the API rather than taken from the event
      # payload: a rerun replays the payload the run was created with, and a
      # label added after that would be invisible to it. REST rather than
      # `gh pr view`/`gh pr edit`: gh's PR GraphQL path trips on this repo's
      # classic-projects field and can fail without applying the edit.
      - name: Refuse while a person has a decision pending (needs-decision label)
        run: |
          labels=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" --jq '[.[].name] | join(",")')
          case ",$labels," in
            *,needs-decision,*)
              touch needs-decision.flag
              echo "FAIL needs-decision: a person has to remove the needs-decision label before this PR can merge"
              exit 1 ;;
          esac
          echo "pr-decision: GREEN (no needs-decision label)"

      # !cancelled() so every gate's findings show in one run even when an
      # earlier step reds (#1240): a lane fixing a link problem should not
      # have to push again to discover a tasks problem.
      - name: Check PR body evidence (sections + links embedded + reachable)
        if: ${{ !cancelled() }}
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 scripts/pr-evidence-gate.py

      - name: Check PR body tasks (Acceptance checklist exists and is fully checked)
        if: ${{ !cancelled() }}
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -o pipefail
          python3 scripts/pr-tasks-gate.py | tee pr-tasks.log

      # A pending decision must not be racing an armed auto-merge. An
      # unchecked Acceptance item is a pending decision (verify it or waive
      # it), so it adds the label; then, whenever the label is on, auto-merge
      # is disarmed. A draft is still being written, cannot be auto-merged,
      # and its template boxes are not yet anyone's decision, so it is not
      # labelled; the red check alone holds it. Both calls are idempotent (re-adding a present label and
      # disabling an unarmed auto-merge are no-ops) and both use the workflow
      # token, so neither triggers another workflow run; the first step
      # re-reads the label from the API on the next user-triggered event.
      - name: Mark the decision pending and disarm auto-merge
        if: ${{ failure() }}
        env:
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          if [ "$PR_DRAFT" != "true" ] && grep -q 'FAIL unchecked-task' pr-tasks.log 2>/dev/null; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" -f 'labels[]=needs-decision' --silent
            touch needs-decision.flag
            echo "pr-decision: needs-decision label added (unchecked Acceptance item)"
          fi
          if [ ! -f needs-decision.flag ]; then
            echo "pr-decision: red without a pending decision; auto-merge left as it is"
            exit 0
          fi
          if gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --disable-auto 2>disable-auto.err; then
            echo "pr-decision: auto-merge disarmed"
          elif grep -q 'not in auto-merge mode\|not enabled' disable-auto.err; then
            echo "pr-decision: auto-merge was not armed"
          else
            cat disable-auto.err
            echo "FAIL disarm: auto-merge may still be armed on a PR with a pending decision"
            exit 1
          fi
