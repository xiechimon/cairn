name: merge-queue-audit
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to audit (defaults to the current main head)
        required: false
permissions:
  contents: read
  issues: write
  pull-requests: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
          fetch-depth: 0
      - name: Audit the merged commit
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_SHA: ${{ inputs.sha || github.event.head_commit.id }}
        run: |
          if node scripts/ops/merge-route-audit.mjs commit "$AUDIT_SHA"; then
            exit 0
          fi
          title="Merged outside the merge queue"
          body="Commit $AUDIT_SHA reached main without a \`queued\` label before its merge. Agents merge only through the Mergify queue; a direct \`gh pr merge\` (or admin merge) bypasses every required check. Opened by the merge-queue-audit workflow."
          open_issue="$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$open_issue" ]; then
            gh issue comment "$open_issue" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --assignee xiechimon
          fi
          exit 1
