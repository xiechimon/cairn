name: feature-map-refresh

on:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: feature-map-refresh
  cancel-in-progress: false

jobs:
  feature-map-refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Regenerate feature map
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/generate-feature-map.mjs > "$RUNNER_TEMP/regen.log"
          cat "$RUNNER_TEMP/regen.log"

      - name: Open a PR when the doc changed
        env:
          GH_TOKEN: ${{ secrets.FEATURE_MAP_REFRESH_TOKEN || github.token }}
        run: |
          if git diff --quiet -- docs/feature-map.md; then
            echo "feature-map-refresh: docs/feature-map.md matches its sources; no PR to open"
            exit 0
          fi
          STAMP=$(date -u +%Y%m%d-%H%M%S)
          BRANCH="chore/feature-map-refresh-$STAMP"
          git diff --stat -- docs/feature-map.md > "$RUNNER_TEMP/diff-stat.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"
          git add docs/feature-map.md
          git commit -m "docs: feature map daily refresh ($STAMP)"
          git push origin "$BRANCH"
          gh pr list --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("chore/feature-map-refresh-")) | "\(.number) \(.headRefName)"' |
          while read -r NUM HEAD; do
            if [ "$HEAD" != "$BRANCH" ]; then
              gh pr close "$NUM" --delete-branch --comment "superseded by $BRANCH"
            fi
          done
          {
            echo '## What'
            echo ''
            echo 'Scheduled daily refresh of `docs/feature-map.md` (feature-map-refresh workflow, from #1527): the doc is generated by `scripts/generate-feature-map.mjs`, and this PR carries a fresh extraction from spec references, test references, `docs/verify/` directories, and current GitHub issue state. No hand edits.'
            echo ''
            echo '## Verified'
            echo ''
            echo '`node scripts/generate-feature-map.mjs` on this run printed:'
            echo ''
            sed 's/^/    /' "$RUNNER_TEMP/regen.log"
            echo ''
            echo 'The change is confined to the generated doc:'
            echo ''
            sed 's/^/    /' "$RUNNER_TEMP/diff-stat.txt"
            echo ''
            echo '## Upstream'
            echo ''
            echo 'No mechanism: this PR is the output of `scripts/generate-feature-map.mjs` as wired up by #1527.'
            echo ''
            echo '## Risk'
            echo ''
            echo 'Doc-only: one generated file, no runtime consumers. If this PR carries no CI checks, that is GitHub suppressing GITHUB_TOKEN-caused events; configuring the FEATURE_MAP_REFRESH_TOKEN secret (contents + pull-requests write) makes future refresh PRs run CI normally.'
            echo ''
            echo '## Acceptance'
            echo ''
            echo '- [x] `docs/feature-map.md` matches a fresh extraction of its sources (this PR is that extraction)'
            echo ''
            echo '## Issues'
            echo ''
            echo 'None. This refresh PR is not tied to a ticket.'
          } > "$RUNNER_TEMP/pr-body.md"
          gh pr create --base main --head "$BRANCH" \
            --title "docs: feature map daily refresh ($STAMP)" \
            --body-file "$RUNNER_TEMP/pr-body.md"
