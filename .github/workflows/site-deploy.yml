name: site-deploy

on:
  push:
    branches: [main]
    paths: ['site/**', 'eval/suite.json', 'eval/tasks/**']
  workflow_dispatch:

concurrency:
  group: site-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.VERCEL_DEPLOY == 'on' }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @cairn/site
      - run: pnpm --filter @cairn/site build
      - name: Stage the built site under the project's root directory
        run: |
          mkdir -p "$RUNNER_TEMP/deploy/site"
          cp -R site/dist/. "$RUNNER_TEMP/deploy/site/"
          cp site/vercel.json "$RUNNER_TEMP/deploy/site/"
      - working-directory: ${{ runner.temp }}/deploy
        run: npx --yes vercel@latest deploy --prod --yes --archive=tgz --token "${{ secrets.VERCEL_TOKEN }}"
