name: release

# Automated npm releases (#1998): on every push to main the changesets action
# opens or updates a `Version Packages` pull request when changesets are
# pending, and publishes @xiechimon/cairn and @xiechimon/cairn-cli to npm when
# that pull request merges. Publishing needs the owner's npm token in the
# NPM_TOKEN secret; the guard step below fails with a named error when it is
# missing instead of letting the publish step die on a registry 401.
#
# The pull_request trigger is paths-filtered so the release surface itself is
# checked before merge (the config invariant test below); it never opens or
# merges release pull requests - the changesets step only runs on pushes.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.changeset/**'
      - '.github/workflows/release.yml'
      - 'apps/daemon/package.json'
      - 'apps/server/package.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/release-config.test.mjs'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # reads packageManager from package.json
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Release config invariant
        run: node --test scripts/release-config.test.mjs

  release:
    if: github.event_name == 'push'
    needs: config
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # changesets resolves the commits that added each changeset file to
          # build the changelog, which needs the full history.
          fetch-depth: 0
      # reads packageManager from package.json
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Require NPM_TOKEN
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::the NPM_TOKEN repository secret is not set; publishing needs the owner's npm token"
            exit 1
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create release pull request or publish to npm
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm run release:version
          publish-script: pnpm run release:publish
          push-git-tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
