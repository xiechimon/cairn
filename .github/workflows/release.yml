name: release

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.changeset/**'
      - '.github/workflows/release.yml'
      - '**/package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/release-config.test.mjs'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Release config invariant
        run: node --test scripts/release-config.test.mjs

  release:
    if: github.event_name == 'push'
    needs: config
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Detect pending changesets
        run: |
          shopt -s nullglob
          pending=()
          for file in .changeset/*.md; do
            if [[ "$file" != ".changeset/README.md" ]]; then
              pending+=("$file")
            fi
          done
          if (( ${#pending[@]} > 0 )); then
            echo "::warning::Pending changesets wait for a pull request that runs pnpm release:version: ${pending[*]}"
          fi
      - name: Configure tag identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Publish to npm
        env:
          NPM_CONFIG_PROVENANCE: 'true'
        run: pnpm run release:publish
      - name: Push release tags
        if: ${{ !cancelled() }}
        run: git push origin --tags
