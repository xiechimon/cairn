name: motion-reel

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

concurrency:
  group: motion-reel
  cancel-in-progress: true

env:
  # Every machine this repo is built on is one lane's machine; a GitHub runner is one job's
  # machine. The explicit flag keeps the bypass visible in the runner log instead of implicit.
  CAIRN_HEAVY_GATE_BYPASS: '1'

permissions:
  contents: read

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium
        uses: ./.github/actions/playwright-chromium

      - name: Record the live surfaces
        working-directory: apps/web
        env:
          CAIRN_E2E_VIDEO: '1'
        run: pnpm exec playwright test --grep @motion --workers=1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: motion-reel
          path: apps/web/test-results/**/*.webm
          retention-days: 14
          if-no-files-found: warn
