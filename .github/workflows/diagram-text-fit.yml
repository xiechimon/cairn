name: diagram-text-fit

# Diagram text-fit gate (#1087): every label in every
# docs/verify/**/*.drawio.svg must fit its shape. The check is
# scripts/check-diagram-text-fit.py — pure stdlib, a static advance table
# instead of fonts, so it runs identically on fontless CI runners.
#
# Advisory for now (#1087): this job is NOT in branch protection. It follows
# the rollout rule pr-evidence followed (promoted 2026-10-21, #1440) — a
# check joins the required set only after it
# has been green for a stretch and the in-flight lanes have merged, never
# before (requiring it early locks out every open lane whose older diagrams
# predate the gate). Stable job name below so that promotion is a one-line
# branch-protection change later.
#
# Separate file from ci.yml for the same reason pr-evidence.yml is: the
# default `pull_request` types are only opened/synchronize/reopened, and this
# gate needs no others (the body is irrelevant; only the tree is scanned).
#
# No fetch-depth override: the sweep is the whole tree, not a diff, so the
# shallow default checkout is enough.
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  diagram-text-fit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Check diagram label text fit (docs/verify/**/*.drawio.svg)
        run: python3 scripts/check-diagram-text-fit.py 'docs/verify/**/*.drawio.svg'
