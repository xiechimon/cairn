name: diagram-text-fit

# Diagram text-fit gate (#1087): every label in every
# docs/**/*.drawio.svg must fit its shape. The check is
# scripts/check-diagram-text-fit.py — pure stdlib, a static advance table
# instead of fonts, so it runs identically on fontless CI runners.
#
# Advisory: no branch rule requires it; it runs on pull requests and on
# pushes to main.
#
# No fetch-depth override: the sweep is the whole tree, not a diff, so the
# shallow default checkout is enough.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('diagram-text-fit-pr-{0}', github.event.pull_request.number) || format('diagram-text-fit-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  diagram-text-fit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Check diagram label text fit (docs/**/*.drawio.svg)
        run: |
          shopt -s globstar nullglob
          diagrams=(docs/**/*.drawio.svg)
          if [ "${#diagrams[@]}" -eq 0 ]; then
            echo "no diagrams under docs/"
            exit 0
          fi
          python3 scripts/check-diagram-text-fit.py "${diagrams[@]}"
