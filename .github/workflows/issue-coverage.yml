name: issue-coverage

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-coverage
  cancel-in-progress: false

jobs:
  issue-coverage:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      TRACKING_ISSUE: '2393'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Check that every open issue has a destination (#2393)
        run: |
          status=0
          node scripts/issue-coverage.mjs > coverage-report.md || status=$?
          cat coverage-report.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            last=$(gh api "repos/$GITHUB_REPOSITORY/issues/$TRACKING_ISSUE/comments?per_page=100" --jq '[.[] | select(.user.login == "github-actions[bot]")] | last | .body // ""')
            body=$(printf 'Daily issue-coverage check found issues without a valid destination (add them to `docs/ops/issue-coverage.json` or a `.claude/epics` manifest, or close them):\n\n%s\n' "$(cat coverage-report.md)")
            if [ "$last" != "$body" ]; then
              gh issue comment "$TRACKING_ISSUE" --repo "$GITHUB_REPOSITORY" --body "$body"
            fi
          fi
          exit "$status"
