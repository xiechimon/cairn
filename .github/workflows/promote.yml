name: promote

# Auto-promotes green commits from the speculative batching merge queue
# (refs/heads/enqueue/* + refs/heads/queue/try/*) onto main. Preflight-green
# fast-forward SHAs land directly through push-queue.mjs when the queue is
# idle; concurrent lanes enqueue into enqueue/* and run CI in parallel on
# queue/try/*. The workflow_run trigger only fires for workflow files on main,
# so this file is trusted code; the green-main ruleset guards main.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: ['queue/**']
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: promote-main
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: desktop-release
    permissions:
      contents: read
      actions: write
      checks: read
      issues: write
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Advance speculative batching merge queue
        env:
          GH_TOKEN: ${{ github.token }}
          QUEUE_WRITE_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node scripts/ops/speculative-queue.mjs --enforce
