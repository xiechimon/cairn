name: autonomy-brake
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  issues:
    types: [opened, closed, reopened, labeled, unlabeled]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  issues: write
  statuses: write
  actions: write
concurrency:
  group: autonomy-brake
  cancel-in-progress: false
jobs:
  brake:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      EVENT_NAME: ${{ github.event_name }}
      RUN_EVENT: ${{ github.event.workflow_run.event }}
      HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
      CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      FAILED_SHA: ${{ github.event.workflow_run.head_sha }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
          fetch-depth: 0
      - name: Apply the brake
        run: |
          if [ "$EVENT_NAME" = workflow_run ]; then
            if [ "$RUN_EVENT" != push ] || [ "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ] || [ "$CONCLUSION" = cancelled ] || [ "$HEAD_BRANCH" != main ]; then
              exit 0
            fi
            if [ "$CONCLUSION" = success ]; then
              node scripts/autonomy-brake.mjs resume
              exit 0
            fi
            if [ "$RUN_ATTEMPT" = 1 ] && node scripts/autonomy-brake.mjs rerun-failed --run "$RUN_ID" --sha "$FAILED_SHA"; then
              exit 0
            fi
            node scripts/autonomy-brake.mjs pause --reason "Main CI failed at $FAILED_SHA: $RUN_URL"
          else
            node scripts/autonomy-brake.mjs sweep
            if [ "$EVENT_NAME" = schedule ] || [ "$EVENT_NAME" = workflow_dispatch ]; then
              node scripts/autonomy-brake.mjs resume
            fi
          fi
