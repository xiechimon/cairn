name: queue-guard

# queue/main holds one candidate at a time, and only the promote workflow
# removes one. The guard keeps the live candidate in queue-state/main and puts
# it back when a push stacks on it or replaces it, or when the ref is deleted
# and recreated by anyone but the promoter. A delete event always runs the
# default branch copy of this file.
on:
  push:
    branches: [queue/main]
  delete:

jobs:
  guard:
    if: github.event_name == 'push' || (github.event.ref_type == 'branch' && github.event.ref == 'queue/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Keep one live candidate on queue/main
        env:
          GH_TOKEN: ${{ github.token }}
          GUARD_EVENT: ${{ github.event_name }}
          GUARD_ACTOR: ${{ github.actor }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: node scripts/ops/guard-queue.mjs
