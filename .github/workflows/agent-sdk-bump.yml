name: agent-sdk-bump

# Keeps the bundled agent SDKs on their latest release, so the Claude Code CLI
# Cairn ships never falls behind the models it offers. A bump lands only through
# the normal path: preflight ci on the bump commit, then push-queue and promote.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: agent-sdk-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    environment: desktop-release
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Bump each bundled agent SDK to its latest release
        id: bump
        run: node scripts/ops/bump-agent-sdk.mjs

      - name: Commit the bump
        if: steps.bump.outputs.bumped != ''
        env:
          BUMPED: ${{ steps.bump.outputs.bumped }}
        run: |
          git config user.name xiechimon
          git config user.email 157263579+xiechimon@users.noreply.github.com
          git add apps/daemon/package.json pnpm-lock.yaml pnpm-workspace.yaml
          git commit -m "daemon(deps): bump bundled agent SDKs to latest" -m "$BUMPED"

      - name: Install gitleaks for preflight secret scan (sha256-verified)
        if: steps.bump.outputs.bumped != ''
        run: |
          node scripts/ops/install-gitleaks.mjs --dest "$RUNNER_TEMP/gitleaks-bin"
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"

      - name: Preflight ci, then queue the bump for promotion
        if: steps.bump.outputs.bumped != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PUSH_QUEUE_WAIT_MINUTES: 180
        run: |
          node scripts/ops/preflight.mjs --wait
          node scripts/ops/push-queue.mjs --wait

      - name: Delete the preflight branch
        if: always() && steps.bump.outputs.bumped != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          lane=$(node -e "import('./scripts/ops/push-queue.mjs').then((m) => console.log(m.localLane(process.cwd())))")
          git push origin --delete "preflight/$lane"
