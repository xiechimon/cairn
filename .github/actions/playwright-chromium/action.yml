name: playwright-chromium
description: Install Playwright chromium, reusing the system packages cached for this runner image.

runs:
  using: composite
  steps:
    - name: Key the system package cache
      id: key
      shell: bash
      run: echo "key=playwright-debs-${ImageOS:-unknown}-${ImageVersion:-unknown}-$(pnpm exec playwright --version | tr -cs 'A-Za-z0-9.' '-')" >> "$GITHUB_OUTPUT"

    - name: Restore system packages
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ~/.cache/playwright-debs
        key: ${{ steps.key.outputs.key }}

    # Both Ubuntu apt mirrors intermittently throttle runners to a few kB/s, which stalls `--with-deps` for 10 to 25 minutes.
    - name: Install chromium and its system packages
      shell: bash
      run: |
        debs="$HOME/.cache/playwright-debs"
        if compgen -G "$debs/*.deb" > /dev/null && sudo dpkg -i "$debs"/*.deb; then
          pnpm exec playwright install chromium
          exit 0
        fi
        sudo sed -i 's#azure.archive.ubuntu.com#archive.ubuntu.com#g' /etc/apt/apt-mirrors.txt
        printf 'Acquire::Retries "3";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAPT::Keep-Downloaded-Packages "true";\n' | sudo tee /etc/apt/apt.conf.d/99-ci-bounded > /dev/null
        sudo apt-get clean
        pnpm exec playwright install chromium --with-deps
        if compgen -G '/var/cache/apt/archives/*.deb' > /dev/null; then
          mkdir -p "$debs"
          cp /var/cache/apt/archives/*.deb "$debs"/
        fi
