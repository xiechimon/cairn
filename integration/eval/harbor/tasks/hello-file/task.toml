schema_version = "1.4"
artifacts = ["/app/hello.txt"]

[task]
name = "cairn/hello-file"
version = "1.0.0"
description = "Write one file. The grader runs offline in a separate container."
authors = [{ name = "Cairn" }]
keywords = ["harbor", "smoke"]

[metadata]
difficulty = "easy"
category = "programming"
tags = ["smoke"]

[verifier]
timeout_sec = 60.0
environment_mode = "separate"

[agent]
timeout_sec = 120.0

[environment]
docker_image = "node:24-bookworm-slim"
cpus = 1
memory_mb = 512
storage_mb = 1024
network_mode = "public"
