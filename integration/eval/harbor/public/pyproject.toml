[project]
name = "cairn-harbor-public"
version = "0.1.0"
description = "Public benchmark spike for Cairn via Harbor: SWE-bench Verified and Terminal-Bench 2.1"
requires-python = ">=3.12"
dependencies = [
    "harbor==0.25.0",
    "httpx[socks]>=0.28.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cairn_harbor"]

[tool.uv]
package = true
