queue_rules:
  - name: default
    queue_conditions:
      - -author = cairnwright[bot]
      - or:
          - base = main
          - "#depends-on > 0"
      - -draft
      - '#review-threads-unresolved = 0'
      - -label = coordinator-hold
      - -label = owner-route
      - '-files ~= (?i)^(?:\.github/workflows(?:/.*)?|\.mergify\.yml|\.claude/workflows/pr-gate\.js|scripts/merge-route\.mjs|scripts/autonomy-brake\.mjs|scripts/ops/review-gate(?:/.*)?|packages/shared/merge-gate-paths\.json|integration/eval(?:/.*)?|\.claude/hillclimb(?:/.*)?|apps/server/src/trajectory-export\.ts|apps/server/src/trajectory-export-cli\.ts|apps/server/src/trajectory-outcome\.ts|packages/shared/src/trajectory-pack\.ts|apps/server/src/lib/secret-box\.ts|apps/server/src/lib/keys\.ts|apps/server/src/lib/token-auth\.ts|apps/server/src/lib/attachments-token\.ts|apps/server/src/services/secrets\.ts|apps/server/src/services/credentials\.ts|apps/server/src/services/api-keys\.ts|apps/server/src/services/oauth\.ts|apps/server/src/coordinator/credentials\.ts|apps/server/src/coordinator/codex-login\.ts|apps/daemon/src/credentials\.ts|apps/daemon/src/secret-channel\.ts|apps/daemon/src/machine-client\.ts|apps/server/src/routes-machine\.ts|apps/server/src/services/machine[^/]*\.ts|apps/daemon/src/backend/command-gate\.ts|apps/server/src/services/mcp-face\.ts|apps/server/src/services/mcp-servers\.ts)$'
      - or:
          - -head ~= ^B[0-9]+/
          - label = queue-admit
      - check-success = commit-author
      - check-success = @github-actions/review-gate
      - check-success = merge-route
      - check-success = pr-size
      - or:
          - check-success = check
          - check-skipped = check
      - or:
          - check-success = pack-smoke
          - check-skipped = pack-smoke
      - or:
          - check-success = e2e-gate
          - check-skipped = e2e-gate
      - or:
          - check-success = pr-evidence
          - check-skipped = pr-evidence
      - or:
          - check-success = gates
          - check-skipped = gates
      - or:
          - check-success = dead-class-gate
          - check-skipped = dead-class-gate
      - or:
          - check-success = ops-backup-test
          - check-skipped = ops-backup-test
      - '#files <= 80'
    merge_conditions:
      - or:
          - check-success = check
          - check-skipped = check
      - or:
          - check-success = pack-smoke
          - check-skipped = pack-smoke
      - or:
          - check-success = e2e-gate
          - check-skipped = e2e-gate
      - or:
          - check-success = gates
          - check-skipped = gates
      - or:
          - check-success = dead-class-gate
          - check-skipped = dead-class-gate
      - or:
          - check-success = ops-backup-test
          - check-skipped = ops-backup-test
    merge_method: fast-forward
    batch_size:
      min: 1
      max: 4
    batch_max_wait_time: 0 s
    max_checks_retries: 1
    branch_protection_injection_mode: none
    merge_bot_account: xiechimon
  - name: bot
    queue_conditions:
      - author = cairnwright[bot]
      - or:
          - base = main
          - "#depends-on > 0"
      - -draft
      - '#review-threads-unresolved = 0'
      - -label = coordinator-hold
      - -label = owner-route
      - '-files ~= (?i)^(?:\.github/workflows(?:/.*)?|\.mergify\.yml|\.claude/workflows/pr-gate\.js|scripts/merge-route\.mjs|scripts/autonomy-brake\.mjs|scripts/ops/review-gate(?:/.*)?|packages/shared/merge-gate-paths\.json|integration/eval(?:/.*)?|\.claude/hillclimb(?:/.*)?|apps/server/src/trajectory-export\.ts|apps/server/src/trajectory-export-cli\.ts|apps/server/src/trajectory-outcome\.ts|packages/shared/src/trajectory-pack\.ts|apps/server/src/lib/secret-box\.ts|apps/server/src/lib/keys\.ts|apps/server/src/lib/token-auth\.ts|apps/server/src/lib/attachments-token\.ts|apps/server/src/services/secrets\.ts|apps/server/src/services/credentials\.ts|apps/server/src/services/api-keys\.ts|apps/server/src/services/oauth\.ts|apps/server/src/coordinator/credentials\.ts|apps/server/src/coordinator/codex-login\.ts|apps/daemon/src/credentials\.ts|apps/daemon/src/secret-channel\.ts|apps/daemon/src/machine-client\.ts|apps/server/src/routes-machine\.ts|apps/server/src/services/machine[^/]*\.ts|apps/daemon/src/backend/command-gate\.ts|apps/server/src/services/mcp-face\.ts|apps/server/src/services/mcp-servers\.ts)$'
      - or:
          - -head ~= ^B[0-9]+/
          - label = queue-admit
      - check-success = commit-author
      - check-success = @github-actions/review-gate
      - check-success = merge-route
      - check-success = pr-size
      - or:
          - check-success = check
          - check-skipped = check
      - or:
          - check-success = pack-smoke
          - check-skipped = pack-smoke
      - or:
          - check-success = e2e-gate
          - check-skipped = e2e-gate
      - or:
          - check-success = pr-evidence
          - check-skipped = pr-evidence
      - or:
          - check-success = gates
          - check-skipped = gates
      - or:
          - check-success = dead-class-gate
          - check-skipped = dead-class-gate
      - or:
          - check-success = ops-backup-test
          - check-skipped = ops-backup-test
      - '#files <= 80'
    merge_conditions:
      - or:
          - check-success = check
          - check-skipped = check
      - or:
          - check-success = pack-smoke
          - check-skipped = pack-smoke
      - or:
          - check-success = e2e-gate
          - check-skipped = e2e-gate
      - or:
          - check-success = gates
          - check-skipped = gates
      - or:
          - check-success = dead-class-gate
          - check-skipped = dead-class-gate
      - or:
          - check-success = ops-backup-test
          - check-skipped = ops-backup-test
    merge_method: fast-forward
    batch_size:
      min: 1
      max: 4
    batch_max_wait_time: 0 s
    max_checks_retries: 1
    branch_protection_injection_mode: none
    merge_bot_account: xiechimon
merge_protections_settings:
  auto_merge_conditions: true
commands_restrictions:
  dequeue:
    conditions:
      - sender-permission >= write
merge_queue:
  mode: serial
  max_parallel_checks: 1
  dequeued_label: dequeued
scopes:
  source:
    files:
      web:
        include:
          - apps/web/**/*
      backend:
        include:
          - apps/server/**/*
          - apps/daemon/**/*
          - integration/**/*
  barrier_files:
    include:
      - packages/**/*
