schema_version = "1.4"
artifacts = ["/logs/artifacts"]

[metadata]
issue = 1561
base_sha = "77e7da2b95b9dfa28569268ba3e415c4d5be101f"
harbor_version = "0.25.0"

[agent]
timeout_sec = 600

[verifier]
timeout_sec = 300
environment_mode = "separate"

[[verifier.collect]]
command = "rm -rf /logs/artifacts/workspace && mkdir -p /logs/artifacts/workspace && cd /app && tar --exclude=node_modules --exclude=.git -cf - . | tar -xf - -C /logs/artifacts/workspace"

[environment]
build_timeout_sec = 1200
