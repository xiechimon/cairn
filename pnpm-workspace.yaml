pmOnFail: ignore

packages:
  - apps/*
  - packages/*
  - eval
  - integration
  - site

hoistPattern:
  - '*'
  - '!electron'

allowBuilds:
  '@google/genai': false
  better-sqlite3: false
  electron: false
  electron-winstaller: false
  esbuild: true
  protobufjs: false

catalog:
  '@biomejs/biome': 2.5.14
  '@tailwindcss/postcss': 4.3.3
  '@tanstack/react-query': 5.103.1
  diff: 9.0.0
  '@playwright/test': 1.63.0
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@vitejs/plugin-react': 6.1.1
  autoprefixer: 10.6.1
  postcss: 8.5.28
  react: 19.3.0
  react-dom: 19.3.0
  react-router: 8.4.0
  tailwindcss: 4.3.3
  typescript: 7.0.2
  vite: 8.3.8
  vitest: 5.0.5
  zod: 4.6.7

overrides:
  '@google/genai>@modelcontextprotocol/sdk': 1.32.2
  '@modelcontextprotocol/sdk>@hono/node-server': 2.1.11
  '@modelcontextprotocol/sdk>hono': 4.13.19

minimumReleaseAgeExclude:
