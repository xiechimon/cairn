<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#18181b" />
    <meta name="color-scheme" content="dark light" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- scheme-aware tiles (#122): opaque bases keep the glyph legible on
         either browser chrome; iOS ignores media on apple-touch-icon and
         composites transparency over black, so both variants ship opaque -->
    <!-- logo.svg(描摹自 icon-512.png,透明底):favicon 首选,内嵌
         prefers-color-scheme 自翻转;PNG 媒体对仅作不支持 SVG 时的兜底 -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link
      rel="icon"
      type="image/png"
      href="/icon-192-dark.png"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/icon-192-light.png"
      media="(prefers-color-scheme: light)"
    />
    <link rel="apple-touch-icon" href="/icon-192-dark.png" media="(prefers-color-scheme: dark)" />
    <link
      rel="apple-touch-icon"
      href="/icon-192-light.png"
      media="(prefers-color-scheme: light)"
    />
    <link rel="preload" href="/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin />
    <link
      rel="preload"
      href="/fonts/jetbrains-mono-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/source-serif-4-latin-wght.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Pacman</title>
  </head>
  <body>
    <div id="boot" aria-hidden="true"></div>
    <script src="/boot-skeleton.js"></script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
