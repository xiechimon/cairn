appId: io.github.xiechimon.cairn
productName: Cairn
directories:
  output: release
files:
  - dist/main.mjs
  - assets/trayTemplate.png
  - assets/trayTemplate@2x.png
  - package.json
extraResources:
  - from: server
    to: server
afterPack: scripts/after-pack.cjs
npmRebuild: false
publish: null
mac:
  artifactName: ${productName}-${version}-${arch}.${ext}
  icon: ../../assets/AppIcon.icns
  category: public.app-category.developer-tools
  identity: '-'
  hardenedRuntime: false
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
