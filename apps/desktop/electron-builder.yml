appId: io.github.xiechimon.cairn
productName: Cairn
directories:
  output: release
files:
  - dist/main.mjs
  - dist/preload.cjs
  - assets/trayTemplate.png
  - assets/trayTemplate@2x.png
  - assets/trayAwakeTemplate.png
  - assets/trayAwakeTemplate@2x.png
  - package.json
extraResources:
  - from: dist/antigravity-login-worker.mjs
    to: antigravity-login-worker.mjs
  - from: server
    to: server
  - from: runner
    to: runner
afterPack: scripts/after-pack.cjs
npmRebuild: false
publish: null
linux:
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
  executableName: cairn
  icon: ../web/public/icon-512.png
  category: Development
  target:
    - target: tar.gz
      arch: [x64]
mac:
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  icon: ../../assets/AppIcon.icns
  category: public.app-category.developer-tools
  extraResources:
    - from: agent-desktop/${arch}
      to: agent-desktop
    - from: agent-browser/${arch}
      to: agent-browser
    - from: node_modules/electron-liquid-glass/prebuilds
      to: liquid-glass
      filter: ['darwin-*/*.node']
    - from: node_modules/electron-liquid-glass/LICENSE
      to: liquid-glass/LICENSE
    - from: tray-helper/${arch}
      to: tray
    - from: dist/background-updater.mjs
      to: background-updater.mjs
  identity: '-'
  sign: scripts/sign-mac.cjs
  timestamp: none
  hardenedRuntime: false
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
win:
  artifactName: ${productName}-${version}-win-${arch}.${ext}
  icon: ../../assets/AppIcon-1024.png
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
