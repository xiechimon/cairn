appId: io.github.xiechimon.cairn
productName: Cairn
directories:
  output: release
files:
  - dist/main.mjs
  - package.json
extraResources:
  - from: server
    to: server
afterPack: scripts/after-pack.cjs
npmRebuild: false
publish: null
mac:
