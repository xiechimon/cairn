appId: io.github.xiechimon.cairn
productName: Cairn
directories:
  output: release
files:
  - dist/main.mjs
  - dist/preload.cjs
  - assets/trayTemplate.png
  - assets/trayTemplate@2x.png
  - package.json
extraResources:
  - from: server
    to: server
  - from: runner
    to: runner
afterPack: scripts/after-pack.cjs
npmRebuild: false
publish: null
linux:
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
  executableName: cairn
  icon: ../web/public/icon-512.png
  category: Development
  target:
    - target: tar.gz
      arch: [x64]
mac:
  artifactName: ${productName}-${version}-${arch}.${ext}
  icon: ../../assets/AppIcon.icns
  category: public.app-category.developer-tools
  identity: '-'
  sign: scripts/sign-mac.cjs
  timestamp: none
  hardenedRuntime: false
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
