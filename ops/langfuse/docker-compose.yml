name: cairn-langfuse

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

x-langfuse-env: &langfuse-env
  NEXTAUTH_URL: ${NEXTAUTH_URL:?set NEXTAUTH_URL in .env}
  DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
  SALT: ${SALT:?set SALT in .env}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
  TELEMETRY_ENABLED: "false"
  LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: ${CLICKHOUSE_USER:?}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: ${MINIO_BUCKET:?}
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?}
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: ${MINIO_BUCKET:?}
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?}
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${REDIS_AUTH:?set REDIS_AUTH in .env}
  HTTPS_PROXY: ${LANGFUSE_LLM_HTTPS_PROXY:-}
  NO_PROXY: localhost,127.0.0.1,postgres,clickhouse,minio,redis,langfuse-web,langfuse-worker,code-eval-gateway
  LANGFUSE_CODE_EVAL_DISPATCHER: aws-lambda

x-egress-relay: &egress-relay
  image: docker.io/langfuse/langfuse-worker:4.68.0
  restart: always
  profiles: [egress-relay]
  entrypoint: ["node", "/egress/egress-relay.mjs"]
  user: "0:0"
  read_only: true
  cap_drop: [ALL]
  cap_add: [DAC_READ_SEARCH]
  security_opt: [no-new-privileges:true]
  logging: *default-logging

x-code-eval-hardening: &code-eval-hardening
  restart: always
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 64
  logging: *default-logging

services:
  code-eval-runner:
    <<: *code-eval-hardening
    build: ./code-eval-runner
    image: cairn-langfuse-code-eval-runner:4.68.0
    user: "65534:65534"
    mem_limit: 256m
    cpus: 0.5
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    environment:
      AWS_LAMBDA_FUNCTION_TIMEOUT: "2"
    networks: [code-eval-sandbox]

  code-eval-gateway:
    <<: *code-eval-hardening
    image: docker.io/langfuse/langfuse-worker:4.68.0
    entrypoint: ["node", "/gateway/code-eval-gateway.mjs"]
    user: "0:0"
    cap_add: [DAC_READ_SEARCH]
    mem_limit: 64m
    depends_on: [code-eval-runner]
    environment:
      GATEWAY_TARGET: code-eval-runner:8080
    volumes:
      - ./code-eval-gateway.mjs:/gateway/code-eval-gateway.mjs:ro
    networks: [code-eval-ingress, code-eval-sandbox]

  egress-relay-host:
    <<: *egress-relay
    command: ["host"]
    network_mode: host
    environment:
      EGRESS_UPSTREAM: ${EGRESS_UPSTREAM:-127.0.0.1:7890}
    volumes:
      - ./egress-relay.mjs:/egress/egress-relay.mjs:ro
      - egress_socket:/run/egress

  egress-relay:
    <<: *egress-relay
    command: ["bridge"]
    depends_on: [egress-relay-host]
    environment:
      EGRESS_ALLOW: ${EGRESS_ALLOW:-api.anthropic.com:443}
    volumes:
      - ./egress-relay.mjs:/egress/egress-relay.mjs:ro
      - egress_socket:/run/egress

  langfuse-worker:
    image: docker.io/langfuse/langfuse-worker:4.68.0
    restart: always
    depends_on: &langfuse-depends-on
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      <<: *langfuse-env
      LANGFUSE_CODE_EVAL_AWS_LAMBDA_ENDPOINT: http://code-eval-gateway:8080
      LANGFUSE_CODE_EVAL_AWS_LAMBDA_NODE_FUNCTION_NAME: function
      LANGFUSE_CODE_EVAL_EXECUTION_WORKER_CONCURRENCY: "1"
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: code-eval-dispatcher-signing-only
      AWS_SECRET_ACCESS_KEY: code-eval-dispatcher-signing-only
    networks: [default, code-eval-ingress]
    logging: *default-logging

  langfuse-web:
    image: docker.io/langfuse/langfuse:4.68.0
    restart: always
    depends_on: *langfuse-depends-on
    ports:
      - ${BIND_ADDRESS:-127.0.0.1}:${LANGFUSE_WEB_PORT:-3000}:3000
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET in .env}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: ${LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT:-http://127.0.0.1:9090}
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://minio:9000
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:-}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:-}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-}
    logging: *default-logging

  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:25.12.11
    restart: always
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:?}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging

  minio:
    image: cgr.dev/chainguard/minio@sha256:73297936408b731668ca0e835ac9add1a35cb6026a125c2f0cd476d9ef48222c
    restart: always
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mkdir -p /data/${MINIO_BUCKET:?} && minio server --address :9000 --console-address :9001 /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    ports:
      - ${BIND_ADDRESS:-127.0.0.1}:${MINIO_API_PORT:-9090}:9000
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging

  redis:
    image: docker.io/library/redis:7.4.11
    restart: always
    command:
      - redis-server
      - --requirepass
      - ${REDIS_AUTH:?set REDIS_AUTH in .env}
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_AUTH:?}", "ping"]
      interval: 3s
      timeout: 5s
      retries: 10
    logging: *default-logging

  postgres:
    image: docker.io/library/postgres:17.11
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?} -d ${POSTGRES_DB:?}"]
      interval: 3s
      timeout: 3s
      retries: 10
    logging: *default-logging

networks:
  code-eval-ingress:
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
      com.docker.network.bridge.gateway_mode_ipv6: isolated
  code-eval-sandbox:
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
      com.docker.network.bridge.gateway_mode_ipv6: isolated

volumes:
  postgres_data:
  clickhouse_data:
  clickhouse_logs:
  minio_data:
  redis_data:
  egress_socket:
